        project(bx + size, by, 0),
        project(bx + size, by + size, 0),
        project(bx, by + size, 0)
      ];
      const cast = [
        project(bx + offsetX, by + offsetY, 0),
        project(bx + size + offsetX, by + offsetY, 0),
        project(bx + size + offsetX, by + size + offsetY, 0),
        project(bx + offsetX, by + size + offsetY, 0)
      ];

      const hull = getConvexHull([...base, ...cast]);
      ctx.moveTo(hull[0].x, hull[0].y);
      hull.slice(1).forEach(point => ctx.lineTo(point.x, point.y));
      ctx.closePath();
    }

    function getConvexHull(points) {
      const sorted = [...points].sort((a, b) => a.x - b.x || a.y - b.y);
      const cross = (origin, a, b) =>
        (a.x - origin.x) * (b.y - origin.y) -
        (a.y - origin.y) * (b.x - origin.x);
      const lower = [];
      sorted.forEach(point => {
        while (lower.length >= 2 &&
          cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0) {
          lower.pop();
        }
        lower.push(point);
      });
      const upper = [];
      [...sorted].reverse().forEach(point => {
        while (upper.length >= 2 &&
          cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0) {
          upper.pop();
        }
        upper.push(point);
      });
      lower.pop();
      upper.pop();
      return lower.concat(upper);
    }

    function appendTrafficLightShadowPath(intersection) {
      const halfRoad = ROAD_WIDTH * TILE_SIZE / 2 + 7;
      const posts = [
        [-halfRoad, -halfRoad],
        [halfRoad, halfRoad],
        [halfRoad, -halfRoad],
        [-halfRoad, halfRoad]
      ];
      const shadowOffsetX = -30 * 1.65;
      const shadowOffsetY = -30 * 1.23;

      posts.forEach(([dx, dy]) => {
        const worldX = intersection.x + dx;
        const worldY = intersection.y + dy;
        const base = project(worldX, worldY, 0);
        const tip = project(
          worldX + shadowOffsetX,
          worldY + shadowOffsetY,
          0
        );
        const length = Math.max(1, Math.hypot(tip.x - base.x, tip.y - base.y));
        const sideX = -(tip.y - base.y) / length * 2;
        const sideY = (tip.x - base.x) / length * 2;

        ctx.moveTo(base.x + sideX, base.y + sideY);
        ctx.lineTo(base.x - sideX, base.y - sideY);
        ctx.lineTo(tip.x - sideX * 1.7, tip.y - sideY * 1.7);
        ctx.lineTo(tip.x + sideX * 1.7, tip.y + sideY * 1.7);
        ctx.closePath();
        ctx.moveTo(tip.x + 4, tip.y);
        ctx.arc(tip.x, tip.y, 4, 0, Math.PI * 2);
        ctx.closePath();
      });
    }

    // Baked wash + vignette + scanlines; grain redrawn every N sim ticks.
    const ATMOS_GRAIN_EVERY = 4;
    let atmosBaseCanvas = null;
    let atmosBaseCtx = null;
    let atmosGrainCanvas = null;
    let atmosGrainCtx = null;
    let atmosOverlayW = 0;
    let atmosOverlayH = 0;
    let atmosGrainFrame = -1;

    function invalidateAtmosphereOverlay() {
      atmosBaseCanvas = null;
      atmosBaseCtx = null;
      atmosGrainCanvas = null;
      atmosGrainCtx = null;
      atmosOverlayW = 0;
      atmosOverlayH = 0;
      atmosGrainFrame = -1;
    }

    function ensureAtmosphereCanvases() {
      if (atmosBaseCanvas &&
          atmosOverlayW === screenWidth &&
          atmosOverlayH === screenHeight) {
        return;
      }
      atmosOverlayW = screenWidth;
      atmosOverlayH = screenHeight;

      atmosBaseCanvas = document.createElement('canvas');
      atmosBaseCanvas.width = atmosOverlayW;
      atmosBaseCanvas.height = atmosOverlayH;
      atmosBaseCtx = atmosBaseCanvas.getContext('2d');

      atmosGrainCanvas = document.createElement('canvas');
      atmosGrainCanvas.width = atmosOverlayW;
      atmosGrainCanvas.height = atmosOverlayH;
      atmosGrainCtx = atmosGrainCanvas.getContext('2d');
      atmosGrainFrame = -1;

      const actx = atmosBaseCtx;
      actx.clearRect(0, 0, atmosOverlayW, atmosOverlayH);

      // Soft warm wash
      actx.fillStyle = 'rgba(202, 171, 122, 0.035)';
      actx.fillRect(0, 0, atmosOverlayW, atmosOverlayH);

      // Soft warm vignette (PS1 / GTA1 mood)
      const cx = atmosOverlayW * 0.5;
      const cy = atmosOverlayH * 0.52;
      const vignette = actx.createRadialGradient(
        cx, cy, Math.min(atmosOverlayW, atmosOverlayH) * 0.28,
        cx, cy, Math.max(atmosOverlayW, atmosOverlayH) * 0.72
      );
      vignette.addColorStop(0, 'rgba(40, 22, 10, 0)');
      vignette.addColorStop(0.55, 'rgba(50, 28, 14, 0.08)');
      vignette.addColorStop(1, 'rgba(28, 12, 6, 0.42)');
      actx.fillStyle = vignette;
      actx.fillRect(0, 0, atmosOverlayW, atmosOverlayH);

      // CRT scanlines
      actx.fillStyle = 'rgba(20, 12, 8, 0.065)';
      for (let y = 0; y < atmosOverlayH; y += 3) {
        actx.fillRect(0, y, atmosOverlayW, 1);
      }
    }

    function rebuildAtmosphereGrain(grainFrame) {
      const gctx = atmosGrainCtx;
      gctx.clearRect(0, 0, atmosOverlayW, atmosOverlayH);
      for (let i = 0; i < 130; i++) {
        const xSeed = Math.sin((i + grainFrame * 131) * 12.9898) * 43758.5453;
        const ySeed = Math.sin((i + grainFrame * 71) * 78.233) * 24634.6345;
        const x = (xSeed - Math.floor(xSeed)) * atmosOverlayW;
        const y = (ySeed - Math.floor(ySeed)) * atmosOverlayH;
        gctx.fillStyle = i % 3 === 0
          ? 'rgba(65, 52, 38, 0.055)'
          : 'rgba(238, 220, 184, 0.035)';
        gctx.fillRect(x, y, i % 5 === 0 ? 2 : 1, 1);
      }
      atmosGrainFrame = grainFrame;
    }

    function drawAtmosphere() {
      ensureAtmosphereCanvases();
      ctx.drawImage(atmosBaseCanvas, 0, 0);

      const grainFrame = Math.floor(simulationTick / ATMOS_GRAIN_EVERY);
      if (grainFrame !== atmosGrainFrame) {
        rebuildAtmosphereGrain(grainFrame);
      }
      ctx.drawImage(atmosGrainCanvas, 0, 0);
    }

    // --- 3D BUILDING & GROUND RENDERER ---
    function drawTile(tile, groundOnly) {
      const { wx, wy, tileType, r, c } = tile;
      const h = BUILDING_HEIGHTS[tileType];

      // Ground diamond points (z = 0)
      const g0 = project(wx, wy, 0);
      const g1 = project(wx + TILE_SIZE, wy, 0);
      const g2 = project(wx + TILE_SIZE, wy + TILE_SIZE, 0);
      const g3 = project(wx, wy + TILE_SIZE, 0);

      if (groundOnly) {
        ctx.fillStyle = tileType === 1
          ? PALETTE.road
          : (tileType === 0 ? PALETTE.grass : PALETTE.sidewalk);
        fillQuad(g0, g1, g2, g3);

        if (tileType === PAVEMENT_TILE) {
          const p0 = project(wx, wy, 2);
          const p1 = project(wx + TILE_SIZE, wy, 2);
          const p2 = project(wx + TILE_SIZE, wy + TILE_SIZE, 2);
          const p3 = project(wx, wy + TILE_SIZE, 2);
          ctx.fillStyle = PALETTE.pavement;
          fillQuad(p0, p1, p2, p3);
          ctx.strokeStyle = PALETTE.pavementEdge;
          ctx.lineWidth = 1;
          strokeQuad(p0, p1, p2, p3);
          drawSurfaceWear(tile, 3);
        } else if (tileType === 1) {
          // Directional lane markings make the street network legible.
          const roadRow = isRoadIndex(r);
          const roadCol = isRoadIndex(c);
          ctx.strokeStyle = PALETTE.roadLine;
          ctx.lineWidth = 1.2;
          ctx.setLineDash([9, 8]);

          if (roadRow && !roadCol) {
            drawProjectedLine(
              project(wx, wy + TILE_SIZE / 2, 1),
              project(wx + TILE_SIZE, wy + TILE_SIZE / 2, 1)
            );
          } else if (roadCol && !roadRow) {
            drawProjectedLine(
              project(wx + TILE_SIZE / 2, wy, 1),
              project(wx + TILE_SIZE / 2, wy + TILE_SIZE, 1)
            );
          }
          ctx.setLineDash([]);
          drawCrosswalks(tile);
          drawSurfaceWear(tile, 1);
        } else {
          drawSurfaceWear(tile, 1);
        }
        return;
      }

      // --- BUILDINGS (Inset solid 3D blocks) ---
      const bx = wx + BUILDING_INSET;
      const by = wy + BUILDING_INSET;
      const size = TILE_SIZE * BUILDING_FOOTPRINT_TILES - BUILDING_INSET * 2;

      // Roof diamond points (z = height)
      const r0 = project(bx, by, h);
      const r1 = project(bx + size, by, h);
      const r2 = project(bx + size, by + size, h);
      const r3 = project(bx, by + size, h);

      // Sort all four facades as the camera turns, allowing the nearest two
      // to naturally cover the hidden rear faces.
      const walls = [
        { a: [bx, by], b: [bx + size, by], color: PALETTE.wallsRight[tileType], index: 0 },
        { a: [bx + size, by], b: [bx + size, by + size], color: PALETTE.wallsLeft[tileType], index: 1 },
        { a: [bx + size, by + size], b: [bx, by + size], color: PALETTE.wallsRight[tileType], index: 2 },
        { a: [bx, by + size], b: [bx, by], color: PALETTE.wallsLeft[tileType], index: 3 }
      ];

      walls.forEach(wall => {
        wall.depth = project(
          (wall.a[0] + wall.b[0]) / 2,
          (wall.a[1] + wall.b[1]) / 2,
          h / 2
        ).depth;
      });
      walls.sort((a, b) => a.depth - b.depth);

      walls.forEach(wall => {
        const bottomA = project(wall.a[0], wall.a[1], 1);
        const bottomB = project(wall.b[0], wall.b[1], 1);
        const topB = project(wall.b[0], wall.b[1], h);
        const topA = project(wall.a[0], wall.a[1], h);

        ctx.fillStyle = wall.color;
        fillQuad(bottomA, bottomB, topB, topA);

        // Sun casts shadows toward -X/-Y; east (+X) and south (+Y) faces stay lit.
        const sunlit = wall.index === 1 || wall.index === 2;
        ctx.strokeStyle = sunlit ? PALETTE.windowsLit : PALETTE.windowsShade;
        ctx.globalAlpha = sunlit ? 0.72 : 0.28;
        ctx.lineWidth = 2;
        for (let z = 18; z < h - 8; z += 18) {
          for (let offset = 0.18; offset <= 0.7; offset += 0.26) {
            const endOffset = offset + 0.12;
            drawProjectedLine(
              project(
                wall.a[0] + (wall.b[0] - wall.a[0]) * offset,
                wall.a[1] + (wall.b[1] - wall.a[1]) * offset,
                z
              ),
              project(
                wall.a[0] + (wall.b[0] - wall.a[0]) * endOffset,
                wall.a[1] + (wall.b[1] - wall.a[1]) * endOffset,
                z
              )
            );
          }
        }
        ctx.globalAlpha = 1;
        drawBillboardOnWall(r, c, wall.index);
      });

      // Roof Surface
      ctx.fillStyle = PALETTE.roofs[tileType];
      fillQuad(r0, r1, r2, r3);

      ctx.strokeStyle = '#51483c';
      ctx.lineWidth = 1;
      strokeQuad(r0, r1, r2, r3);

      // Occasional brick-red roof awnings and muted service units.
      const detailSeed = (r * 7 + c * 13) % 7;
      if (detailSeed === 0) {
        const a0 = project(bx + 6, by + 6, h + 1);
        const a1 = project(bx + size - 6, by + 6, h + 1);
        const a2 = project(bx + size - 6, by + 16, h + 1);
        const a3 = project(bx + 6, by + 16, h + 1);
        ctx.fillStyle = PALETTE.brick;
        fillQuad(a0, a1, a2, a3);
        ctx.strokeStyle = '#6f2d29';
        strokeQuad(a0, a1, a2, a3);
      } else if (detailSeed === 3) {
        const unitSize = size * 0.26;
        const ux = bx + size * 0.55;
        const uy = by + size * 0.22;
        ctx.fillStyle = '#746d61';
        fillQuad(
          project(ux, uy, h + 1),
          project(ux + unitSize, uy, h + 1),
          project(ux + unitSize, uy + unitSize, h + 1),
          project(ux, uy + unitSize, h + 1)
        );
      }
    }

    function drawSurfaceWear(tile, z) {
      const hash = ((tile.r + 1) * 73856093 ^ (tile.c + 1) * 19349663) >>> 0;
      const offsetX = 10 + (hash % Math.max(12, TILE_SIZE - 25));
      const offsetY = 10 + ((hash >>> 8) % Math.max(12, TILE_SIZE - 25));
      const markSize = 3 + (hash % 6);
      const x = tile.wx + offsetX;
      const y = tile.wy + offsetY;

      if (tile.tileType === 1) {
        ctx.fillStyle = 'rgba(12, 10, 8, 0.16)';
      } else if (tile.tileType === 0) {
        ctx.fillStyle = 'rgba(177, 159, 105, 0.16)';
      } else {
        ctx.fillStyle = 'rgba(91, 73, 54, 0.13)';
      }
      fillQuad(
        project(x, y, z),
        project(x + markSize, y, z),
        project(x + markSize, y + markSize * 0.65, z),
        project(x, y + markSize * 0.65, z)
      );

      if (tile.tileType === PAVEMENT_TILE && hash % 3 === 0) {
        ctx.strokeStyle = 'rgba(76, 65, 53, 0.2)';
        ctx.lineWidth = 1;
        drawProjectedLine(
          project(x - 5, y + 8, z + 0.2),
          project(x + 8, y - 3, z + 0.2)
        );
      }
    }

    function drawBillboardOnWall(r, c, wallIndex) {
      if (!billboardImage.complete || billboardImage.naturalWidth === 0) return;
      const board = billboards.find(item => item.r === r && item.c === c && item.wallIndex === wallIndex);
      if (!board) return;

      const alongX = board.bx - board.ax;
      const alongY = board.by - board.ay;
      const x0 = board.ax + alongX * board.u0 + board.ox;
      const y0 = board.ay + alongY * board.u0 + board.oy;
      const x1 = board.ax + alongX * board.u1 + board.ox;
      const y1 = board.ay + alongY * board.u1 + board.oy;
      const frame = 1.8;
      const fx0 = board.ax + alongX * (board.u0 - 0.02) + board.ox;
      const fy0 = board.ay + alongY * (board.u0 - 0.02) + board.oy;
      const fx1 = board.ax + alongX * (board.u1 + 0.02) + board.ox;
      const fy1 = board.ay + alongY * (board.u1 + 0.02) + board.oy;

      ctx.fillStyle = '#1a1814';
      fillQuad(
        project(fx0, fy0, board.z0 - frame),
        project(fx1, fy1, board.z0 - frame),
        project(fx1, fy1, board.z1 + frame),
        project(fx0, fy0, board.z1 + frame)
      );

      drawImageToQuad(
        billboardImage,
        project(x1, y1, board.z0),
        project(x0, y0, board.z0),
        project(x0, y0, board.z1),
        project(x1, y1, board.z1)
      );

      const glow = 0.08 + board.burstGlow * 0.14;
      const gx0 = board.ax + alongX * (board.u0 - 0.04) + board.ox * 1.35;
      const gy0 = board.ay + alongY * (board.u0 - 0.04) + board.oy * 1.35;
      const gx1 = board.ax + alongX * (board.u1 + 0.04) + board.ox * 1.35;
      const gy1 = board.ay + alongY * (board.u1 + 0.04) + board.oy * 1.35;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255, 255, 245, ${glow})`;
      fillQuad(
        project(gx0, gy0, board.z0 - 3),
        project(gx1, gy1, board.z0 - 3),
        project(gx1, gy1, board.z1 + 3),
        project(gx0, gy0, board.z1 + 3)
      );
      ctx.fillStyle = `rgba(210, 225, 255, ${glow * 0.4})`;
      fillQuad(
        project(gx0, gy0, board.z0 - 8),
        project(gx1, gy1, board.z0 - 8),
        project(gx1, gy1, board.z1 + 8),
        project(gx0, gy0, board.z1 + 8)
      );
      board.sparks.forEach(spark => {
        const fade = spark.life / spark.maxLife;
        const head = project(spark.x, spark.y, spark.z);
        const tail = project(
          spark.x - spark.vx * 2.4,
          spark.y - spark.vy * 2.4,
          spark.z - spark.vz * 2.4
        );
        ctx.strokeStyle = `rgba(255, 255, 252, ${fade * 0.95})`;
        ctx.lineWidth = 1.6;
        drawProjectedLine(tail, head);
        ctx.fillStyle = `rgba(255, 255, 255, ${fade})`;
        ctx.beginPath();
        ctx.arc(head.x, head.y, 1.2 + fade, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function emitBillboardSparks(board) {
      let total = 0;
      billboards.forEach(item => { total += item.sparks.length; });
      const alongX = board.bx - board.ax;
      const alongY = board.by - board.ay;
      const outX = board.ox * 0.22;
      const outY = board.oy * 0.22;
      const count = 7 + Math.floor(Math.random() * 5);
      for (let i = 0; i < count; i++) {
        if (total >= 120) break;
        const edge = Math.floor(Math.random() * 4);
        let u;
        let z;
        if (edge === 0) {
          u = board.u0 + Math.random() * (board.u1 - board.u0);
          z = board.z1;
        } else if (edge === 1) {
          u = board.u0 + Math.random() * (board.u1 - board.u0);
          z = board.z0;
        } else if (edge === 2) {
          u = board.u0;
          z = board.z0 + Math.random() * (board.z1 - board.z0);
        } else {
          u = board.u1;
          z = board.z0 + Math.random() * (board.z1 - board.z0);
        }
        const life = 12 + Math.floor(Math.random() * 14);
        board.sparks.push({
          x: board.ax + alongX * u + board.ox,
          y: board.ay + alongY * u + board.oy,
          z,
          vx: outX + (Math.random() - 0.5) * 0.22,
          vy: outY + (Math.random() - 0.5) * 0.22,
          vz: 0.12 + Math.random() * 0.38,
          life,
          maxLife: life
        });
        total++;
      }
    }

    function updateBillboardEffects() {
      billboards.forEach(board => {
        board.burstGlow *= 0.86;
        board.sparkWait--;
        if (board.sparkWait <= 0) {
          emitBillboardSparks(board);
          board.burstGlow = 1;
          board.sparkWait = 360 + Math.floor(Math.random() * 300);
        }
        for (let i = board.sparks.length - 1; i >= 0; i--) {
          const spark = board.sparks[i];
          spark.x += spark.vx;
          spark.y += spark.vy;
          spark.z += spark.vz;
          spark.vz -= 0.035;
          spark.life--;
          if (spark.life <= 0) board.sparks.splice(i, 1);
        }
      });
    }

    function drawImageToQuad(img, bottomLeft, bottomRight, topRight, topLeft) {
      const width = img.naturalWidth;
      const height = img.naturalHeight;
      if (!width || !height) return;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(bottomLeft.x, bottomLeft.y);
      ctx.lineTo(bottomRight.x, bottomRight.y);
      ctx.lineTo(topRight.x, topRight.y);
      ctx.lineTo(topLeft.x, topLeft.y);
      ctx.closePath();
      ctx.clip();
      const e = topLeft.x;
      const f = topLeft.y;
      const c = (bottomLeft.x - e) / height;
      const d = (bottomLeft.y - f) / height;
      const a = (bottomRight.x - e - c * height) / width;
      const b = (bottomRight.y - f - d * height) / width;
      ctx.setTransform(a, b, c, d, e, f);
      ctx.drawImage(img, 0, 0);
      ctx.restore();
    }

    function drawCrosswalks(tile) {
      const localRow = tile.r % ROAD_SPACING;
      const localCol = tile.c % ROAD_SPACING;
      ctx.strokeStyle = 'rgba(224, 216, 196, 0.62)';
      ctx.lineWidth = 5;
      const roadWidth = ROAD_WIDTH * TILE_SIZE;
      const stripeCount = 8;

      // Along horizontal roads just outside the west/east intersection edges.
      // Draw only the stripes that fall on this tile so later road tiles
      // cannot paint over a neighbour's crossing.
      if (localRow < ROAD_WIDTH &&
        (localCol === ROAD_WIDTH || localCol === ROAD_SPACING - 1)) {
        const roadOriginY = tile.wy - localRow * TILE_SIZE;
        for (let i = 1; i <= stripeCount; i++) {
          const y = roadOriginY + i * roadWidth / (stripeCount + 1);
          if (y < tile.wy || y > tile.wy + TILE_SIZE) continue;
          drawProjectedLine(
            project(tile.wx + 10, y, 1.2),
            project(tile.wx + TILE_SIZE - 10, y, 1.2)
          );
        }
      }

      // Along vertical roads just outside the north/south intersection edges.
      if (localCol < ROAD_WIDTH &&
        (localRow === ROAD_WIDTH || localRow === ROAD_SPACING - 1)) {
        const roadOriginX = tile.wx - localCol * TILE_SIZE;
        for (let i = 1; i <= stripeCount; i++) {
          const x = roadOriginX + i * roadWidth / (stripeCount + 1);
          if (x < tile.wx || x > tile.wx + TILE_SIZE) continue;
          drawProjectedLine(
            project(x, tile.wy + 10, 1.2),
            project(x, tile.wy + TILE_SIZE - 10, 1.2)
          );
        }
      }
    }

    function drawParkingBays() {
      const z = 2.5;
      parkingBays.forEach(bay => {
        const p0 = project(bay.x, bay.y, z);
        const p1 = project(bay.x + bay.w, bay.y, z);
        const p2 = project(bay.x + bay.w, bay.y + bay.h, z);
        const p3 = project(bay.x, bay.y + bay.h, z);
        ctx.fillStyle = PALETTE.bayFill;
        fillQuad(p0, p1, p2, p3);
        ctx.strokeStyle = PALETTE.bayLine;
        ctx.lineWidth = 1.6;
        ctx.setLineDash([5, 4]);
        strokeQuad(p0, p1, p2, p3);
        ctx.setLineDash([]);
      });
    }

    function drawBikeBays() {
      const z = 2.4;
      bikeBays.forEach(bay => {
        const p0 = project(bay.x, bay.y, z);
        const p1 = project(bay.x + bay.w, bay.y, z);
        const p2 = project(bay.x + bay.w, bay.y + bay.h, z);
        const p3 = project(bay.x, bay.y + bay.h, z);
        ctx.fillStyle = '#1a1916';
        fillQuad(p0, p1, p2, p3);
        ctx.strokeStyle = 'rgba(236, 232, 220, 0.85)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 3]);
        strokeQuad(p0, p1, p2, p3);
        ctx.setLineDash([]);

        const label = project(bay.cx, bay.cy, z + 0.2);
        ctx.save();
        ctx.fillStyle = 'rgba(236, 232, 220, 0.9)';
        ctx.font = 'bold 8px "Courier New", Courier, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.translate(label.x, label.y);
        ctx.rotate(-player.cameraAngle * 0.15);
        ctx.fillText('CYCLE HIRE ONLY', 0, 0);
        ctx.restore();
      });
    }

    function drawLimeBike(bike, withRider = false, riderCoat = '#a94336', riderSkin = playerSkin) {
      const wx = bike.x;
      const wy = bike.y;
      const angle = bike.angle;
      const toWorld = (side, forward, z) => ({
        x: wx + Math.cos(angle) * forward - Math.sin(angle) * side,
        y: wy + Math.sin(angle) * forward + Math.cos(angle) * side,
        z
      });
      const drawBox = (halfWidth, halfLength, centerForward, bottom, top, boxColor, sideOffset = 0) => {
        const localCorners = [
          [-halfWidth + sideOffset, centerForward - halfLength],
          [halfWidth + sideOffset, centerForward - halfLength],
          [halfWidth + sideOffset, centerForward + halfLength],
          [-halfWidth + sideOffset, centerForward + halfLength]
        ];
        const worldCorners = localCorners.map(([side, forward]) => toWorld(side, forward, 0));
        const bottomPoints = worldCorners.map(point => project(point.x, point.y, bottom));
        const topPoints = worldCorners.map(point => project(point.x, point.y, top));
        ctx.fillStyle = boxColor;
        fillQuad(topPoints[0], topPoints[1], topPoints[2], topPoints[3]);
        for (let i = 0; i < 4; i++) {
          const next = (i + 1) % 4;
          ctx.fillStyle = shadeColor(boxColor, i < 2 ? -24 : -10);
          fillQuad(bottomPoints[i], bottomPoints[next], topPoints[next], topPoints[i]);
        }
      };

      const ground = project(wx, wy, 0);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
      ctx.beginPath();
      ctx.ellipse(ground.x, ground.y, 7, 3.2, 0, 0, Math.PI * 2);
      ctx.fill();

      // Wheels
      drawBox(1.1, 1.4, 8, 0, 3.2, BIKE.tyre);
      drawBox(1.1, 1.4, -8, 0, 3.2, BIKE.tyre);
      // Lime ends + white frame (mockup style)
      drawBox(2.4, 2.2, 7, 2.5, 6.5, BIKE.lime);
      drawBox(2.2, 5.5, 0, 2.8, 6.2, BIKE.frame);
      drawBox(2.4, 2.2, -7, 2.5, 6.5, BIKE.lime);
      // Handlebar hint
      drawBox(4.2, 0.55, 8.5, 5.5, 7.2, '#2a2a2a');

      if (withRider) {
        drawPedestrian(wx, wy, angle, player.walkPhase || 0, riderCoat, riderSkin, false);
      }
    }

    function updateSkidMarks() {
      for (let i = skidMarks.length - 1; i >= 0; i--) {
        skidMarks[i].life--;
        if (skidMarks[i].life <= 0) skidMarks.splice(i, 1);
      }
    }

    function drawSkidMarks() {
      skidMarks.forEach(mark => {
        const alpha = Math.max(0, mark.life / SKID_LIFE) * 0.38;
        const hx = Math.cos(mark.angle);
        const hy = Math.sin(mark.angle);
        const sx = Math.cos(mark.angle + Math.PI / 2);
        const sy = Math.sin(mark.angle + Math.PI / 2);
        ctx.strokeStyle = `rgba(32, 28, 24, ${alpha})`;
        ctx.lineWidth = 2.4;
        [-5, 5].forEach(side => {
          const x = mark.x + sx * side;
          const y = mark.y + sy * side;
          drawProjectedLine(
            project(x - hx * 4, y - hy * 4, 1.4),
            project(x + hx * 4, y + hy * 4, 1.4)
          );
        });
      });
    }

    function drawCabinet(cab) {
      const bx = cab.x;
      const by = cab.y;
      const bw = cab.w;
      const bd = cab.h;
      const baseZ = 2;
      const topZ = baseZ + cab.height;

      ctx.fillStyle = 'rgba(48, 40, 31, 0.28)';
      fillQuad(
        project(bx + 3, by + 3, 0),
        project(bx + bw + 3, by + 3, 0),
        project(bx + bw + 3, by + bd + 3, 0),
        project(bx + 3, by + bd + 3, 0)
      );

      const walls = [
        { a: [bx, by], b: [bx + bw, by] },
        { a: [bx + bw, by], b: [bx + bw, by + bd] },
        { a: [bx + bw, by + bd], b: [bx, by + bd] },
        { a: [bx, by + bd], b: [bx, by] }
      ];
      walls.forEach(wall => {
        wall.depth = project(
          (wall.a[0] + wall.b[0]) / 2,
          (wall.a[1] + wall.b[1]) / 2,
          baseZ + cab.height / 2
        ).depth;
      });
      walls.sort((a, b) => a.depth - b.depth);
      walls.forEach((wall, order) => {
        ctx.fillStyle = shadeColor(PALETTE.cabinet, order < 2 ? -28 : -10);
        fillQuad(
          project(wall.a[0], wall.a[1], baseZ),
          project(wall.b[0], wall.b[1], baseZ),
          project(wall.b[0], wall.b[1], topZ),
          project(wall.a[0], wall.a[1], topZ)
        );
      });

      ctx.fillStyle = PALETTE.cabinetRoof;
      fillQuad(
        project(bx, by, topZ),
        project(bx + bw, by, topZ),
        project(bx + bw, by + bd, topZ),
        project(bx, by + bd, topZ)
      );

      const midX = bx + bw / 2;
      const midY = by + bd / 2;
      ctx.strokeStyle = 'rgba(214, 210, 196, 0.35)';
      ctx.lineWidth = 1;
      if (cab.side === 'n' || cab.side === 's') {
        const faceY = cab.side === 'n' ? by : by + bd;
        drawProjectedLine(
          project(midX, faceY, baseZ + 2),
          project(midX, faceY, topZ - 2)
        );
        ctx.fillStyle = '#c9c4b0';
        fillQuad(
          project(midX - 2.2, faceY, topZ - 7),
          project(midX + 2.2, faceY, topZ - 7),
          project(midX + 2.2, faceY, topZ - 4),
          project(midX - 2.2, faceY, topZ - 4)
        );
      } else {
        const faceX = cab.side === 'w' ? bx : bx + bw;
        drawProjectedLine(
          project(faceX, midY, baseZ + 2),
          project(faceX, midY, topZ - 2)
        );
        ctx.fillStyle = '#c9c4b0';
        fillQuad(
          project(faceX, midY - 2.2, topZ - 7),
          project(faceX, midY + 2.2, topZ - 7),
          project(faceX, midY + 2.2, topZ - 4),
          project(faceX, midY - 2.2, topZ - 4)
        );
      }
    }

    function fillQuad(p1, p2, p3, p4) {
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.lineTo(p4.x, p4.y);
      ctx.closePath();
      ctx.fill();
    }

    function strokeQuad(p1, p2, p3, p4) {
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.lineTo(p4.x, p4.y);
      ctx.closePath();
      ctx.stroke();
    }

    function drawProjectedLine(p1, p2) {
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
    }

    function drawTrafficLights(intersection) {
      const halfRoad = ROAD_WIDTH * TILE_SIZE / 2 + 7;
      const signalAxis = getSignalAxis(intersection);
      const posts = [
        { dx: -halfRoad, dy: -halfRoad, axis: 'horizontal' },
        { dx: halfRoad, dy: halfRoad, axis: 'horizontal' },
        { dx: halfRoad, dy: -halfRoad, axis: 'vertical' },
        { dx: -halfRoad, dy: halfRoad, axis: 'vertical' }
      ];

      posts.forEach(post => {
        const x = intersection.x + post.dx;
        const y = intersection.y + post.dy;
        const base = project(x, y, 2);
        const top = project(x, y, 30);
        ctx.strokeStyle = '#3b352d';
        ctx.lineWidth = 3;
        drawProjectedLine(base, top);

        ctx.fillStyle = signalAxis === post.axis ? '#73935f' : '#b84c3e';
        ctx.beginPath();
        ctx.arc(top.x, top.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#29251f';
        ctx.lineWidth = 1;
        ctx.stroke();
      });
    }

    // --- PROJECTED 3D VEHICLES ---

          cabin: { w: 9, l: 6.2, z0: 13, z1: 20.5, fwd: 8.2 },
          cabinColor: '#4a4e48',

          headLight: { spread: 5.5, w: 1.2, l: 0.5, z0: 5.4, z1: 8.1 },

          glassFwdFront: 3.5,
          glassFwdRear: -6.5,

        headLight: { spread: 4.85, w: 1.15, l: 0.45, z0: 4.2, z1: 6.5 },
