<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KR CITY 2</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #5f584d;
      color: #eee5d4;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #wanted-stars {
      position: absolute;
      top: 12px;
      left: 15px;
      pointer-events: none;
      z-index: 5;
      font-size: 22px;
      letter-spacing: 5px;
      line-height: 1;
      text-shadow: 2px 2px 0 rgba(20, 16, 12, 0.55);
      user-select: none;
    }
    #wanted-stars .star {
      color: #5c564c;
    }
    #wanted-stars .star.lit {
      color: #f3eee3;
    }
    #ui-overlay {
      position: absolute;
      top: 44px;
      left: 15px;
      background: rgba(43, 38, 31, 0.9);
      border: 1px solid #b7a78e;
      padding: 12px 16px;
      border-radius: 2px;
      box-shadow: 5px 6px 0 rgba(42, 34, 27, 0.25);
      pointer-events: none;
      font-size: 13px;
      line-height: 1.6;
    }
    #ui-overlay h1 {
      font-size: 15px;
      color: #c8573f;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .key {
      color: #d4b56e;
      font-weight: bold;
    }
    #minimap-container {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 160px;
      height: 160px;
      border: 2px solid #b7a78e;
      background: rgba(43, 38, 31, 0.94);
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 5px 6px 0 rgba(42, 34, 27, 0.25);
    }
    #minimap {
      display: block;
      width: 160px;
      height: 160px;
      border-radius: 50%;
    }
    #wasted-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(70, 8, 8, 0.62);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      pointer-events: none;
      z-index: 20;
    }
    #wasted-overlay h2 {
      color: #c4453c;
      font-size: 72px;
      letter-spacing: 10px;
      text-transform: uppercase;
      text-shadow: 4px 5px 0 rgba(20, 4, 4, 0.55);
      margin: 0;
    }
    #mp-panel {
      position: absolute;
      bottom: 15px;
      left: 15px;
      width: 248px;
      background: rgba(43, 38, 31, 0.92);
      border: 1px solid #b7a78e;
      border-radius: 2px;
      box-shadow: 5px 6px 0 rgba(42, 34, 27, 0.25);
      font-size: 12px;
      line-height: 1.45;
      z-index: 15;
      color: #eee5d4;
      user-select: none;
    }
    #mp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-bottom: 1px solid rgba(183, 167, 142, 0.35);
      cursor: pointer;
    }
    #mp-panel.collapsed #mp-header {
      border-bottom: none;
    }
    #mp-panel.collapsed #mp-body {
      display: none;
    }
    #mp-title {
      color: #c8573f;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 12px;
    }
    #mp-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #mp-badge {
      font-size: 10px;
      padding: 1px 5px;
      border: 1px solid rgba(183, 167, 142, 0.55);
      color: #d4b56e;
      text-transform: uppercase;
    }
    #mp-toggle {
      background: none;
      border: none;
      color: #b7a78e;
      font-family: inherit;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      padding: 0 2px;
    }
    #mp-body {
      padding: 9px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .mp-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .mp-input {
      flex: 1;
      min-width: 0;
      background: rgba(24, 20, 16, 0.85);
      border: 1px solid #8a7d68;
      color: #eee5d4;
      font-family: inherit;
      font-size: 12px;
      padding: 4px 6px;
      border-radius: 1px;
      outline: none;
    }
    .mp-input:focus {
      border-color: #d4b56e;
    }
    .mp-btn {
      background: #473f34;
      border: 1px solid #b7a78e;
      color: #eee5d4;
      font-family: inherit;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 5px 8px;
      cursor: pointer;
      border-radius: 1px;
      white-space: nowrap;
    }
    .mp-btn:hover {
      background: #5b5041;
      color: #fff8eb;
    }
    .mp-btn.primary {
      background: #8f3a2a;
      border-color: #d4b56e;
      color: #fff6e5;
    }
    .mp-btn.primary:hover {
      background: #a94336;
    }
    .mp-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }
    #mp-room-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(24, 20, 16, 0.65);
      border: 1px solid rgba(183, 167, 142, 0.45);
      padding: 5px 7px;
    }
    #mp-room-code {
      color: #d4b56e;
      font-weight: bold;
      letter-spacing: 2px;
      font-size: 14px;
    }
    #mp-players {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: 92px;
      overflow-y: auto;
      font-size: 11px;
      border-top: 1px solid rgba(183, 167, 142, 0.25);
      padding-top: 5px;
    }
    .mp-player-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .mp-player-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .mp-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid rgba(0, 0, 0, 0.5);
    }
    .mp-player-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mp-stars {
      color: #f3eee3;
      font-size: 10px;
      letter-spacing: 1px;
      flex-shrink: 0;
    }
    #mp-status {
      font-size: 11px;
      color: #c8bfa9;
      min-height: 15px;
    }
    #mp-status.err {
      color: #e47a6c;
    }

    /* ---------- MOBILE LAYOUT — KR·BOY (60% screen / 40% console) ---------- */
    .mobile-only { display: none; }
    #pad, #paused-overlay { display: none; }

    #paused-overlay {
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: rgba(10, 8, 6, 0.72);
      z-index: 19;
      pointer-events: none;
    }
    #paused-overlay.show {
      display: flex;
    }
    #paused-overlay span {
      font-size: 36px;
      letter-spacing: 12px;
      color: #e9dec8;
      text-shadow:
        3px 3px 0 #2a2217,
        0 0 18px rgba(233, 222, 200, 0.45);
      padding: 12px 24px;
      border: 1px solid rgba(233, 222, 200, 0.35);
      background: rgba(40, 30, 20, 0.45);
    }

    /* Cream injection-moulded plastic chassis (Rams-style, copied from KR·BOY) */
    body.mobile {
      display: block;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      background:
        radial-gradient(ellipse at 50% 0%, #efe6d4 0%, #d9ceb7 60%, #c8bca3 100%);
    }
    body.mobile .desktop-only { display: none !important; }
    body.mobile .mobile-only { display: block; }

    /* Top 60% recessed screen with thin bezel */
    body.mobile #game-container {
      position: fixed;
      top: max(10px, env(safe-area-inset-top, 0px));
      left: max(10px, env(safe-area-inset-left, 0px));
      right: max(10px, env(safe-area-inset-right, 0px));
      width: auto;
      height: calc(60dvh - max(10px, env(safe-area-inset-top, 0px)) - 8px);
      border-radius: 3px;
      background: #0a0806;
      overflow: hidden;
      z-index: 1;
      box-shadow:
        0 0 0 2px #1a1510,
        0 0 0 3px #b9ad94,
        0 0 0 6px #d9ceb7,
        inset 0 0 0 1px rgba(255, 255, 255, 0.04),
        0 3px 10px rgba(40, 30, 15, 0.35);
    }
    body.mobile #screen {
      touch-action: none;
    }

    /* Compact mobile HUD inside the 60% viewport */
    body.mobile #wanted-stars {
      top: 8px;
      left: 10px;
      font-size: 18px;
      letter-spacing: 3px;
    }
    body.mobile #ui-overlay {
      top: 32px;
      left: 10px;
      padding: 5px 8px;
      font-size: 11px;
      line-height: 1.38;
      box-shadow: 3px 4px 0 rgba(42, 34, 27, 0.25);
    }
    body.mobile #mobile-ammo-label.reloading {
      color: #e47a6c;
    }
    body.mobile #minimap-container {
      top: 8px;
      right: 8px;
      width: 104px;
      height: 104px;
      box-shadow: 3px 4px 0 rgba(42, 34, 27, 0.25);
    }
    body.mobile #minimap {
      width: 104px;
      height: 104px;
    }
    body.mobile #wasted-overlay h2 {
      font-size: 46px;
      letter-spacing: 8px;
    }
    body.mobile #mp-panel {
      display: none;
      bottom: 8px;
      left: 8px;
      right: 8px;
      width: auto;
      max-width: 280px;
      z-index: 18;
      touch-action: auto;
    }
    body.mobile #mp-panel.mobile-open {
      display: block;
    }

    /* Bottom 40% console faceplate */
    body.mobile #pad {
      display: block;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 40dvh;
      background: transparent;
      z-index: 10;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .jj-plate {
      position: relative;
      height: 100%;
      min-height: 0;
      padding: 6px 14px 8px;
      display: flex;
      flex-direction: column;
      border-top: 1px solid rgba(40, 30, 15, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }
    /* Top console strip: centered KR·BOY wordmark + right-aligned ENTER/EXIT button */
    .jj-top-bar {
      position: relative;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: clamp(46px, 7.2dvh, 56px);
      padding: 0 2px 2px;
    }
    .jj-wordmark {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: 10px;
      letter-spacing: 5px;
      color: #3a3328;
      font-weight: bold;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
      pointer-events: none;
      white-space: nowrap;
    }
    .jj-wordmark span {
      display: inline-block;
      padding: 2px 5px;
      margin-right: 4px;
      background: #2a2217;
      color: #e9dec8;
      border-radius: 2px;
      letter-spacing: 2px;
    }

    /* Full-width twin-stick row */
    .jj-row {
      flex: 1;
      display: flex;
      align-items: stretch;
      min-height: 0;
      position: relative;
    }
    #pad .stick-zone {
      flex: 1;
      position: relative;
      touch-action: none;
      min-width: 0;
    }
    #pad .stick-well {
      position: absolute;
      left: 50%;
      top: 48%;
      width: clamp(112px, min(20.5dvh, 39vw), 148px);
      height: clamp(112px, min(20.5dvh, 39vw), 148px);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(circle at 50% 35%, #b8ac95 0%, #8c8070 55%, #6f634f 100%);
      box-shadow:
        inset 0 5px 12px rgba(0, 0, 0, 0.55),
        inset 0 -2px 4px rgba(255, 255, 255, 0.18),
        0 1px 0 rgba(255, 255, 255, 0.65);
      pointer-events: none;
    }
    /* Subtle etched directional ticks inside each recessed well */
    #pad .well-tick {
      position: absolute;
      font-size: 9px;
      line-height: 1;
      color: rgba(30, 22, 12, 0.44);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.22);
      pointer-events: none;
      user-select: none;
    }
    #pad .well-tick.n { top: 7px; left: 50%; transform: translateX(-50%); }
    #pad .well-tick.s { bottom: 7px; left: 50%; transform: translateX(-50%); }
    #pad .well-tick.w { left: 8px; top: 50%; transform: translateY(-50%); }
    #pad .well-tick.e { right: 8px; top: 50%; transform: translateY(-50%); }
    #pad .stick-zone.right .well-tick.n,
    #pad .stick-zone.right .well-tick.s {
      color: rgba(140, 38, 28, 0.58);
    }

    #pad .stick-base {
      position: absolute;
      width: clamp(88px, min(16dvh, 30vw), 112px);
      height: clamp(88px, min(16dvh, 30vw), 112px);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: transparent;
      pointer-events: none;
      opacity: 0;
    }
    #pad .stick-knob {
      position: absolute;
      left: 50%;
      top: 48%;
      width: clamp(52px, min(9.2dvh, 17.5vw), 66px);
      height: clamp(52px, min(9.2dvh, 17.5vw), 66px);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(circle at 50% 30%, #4a4238 0%, #2a2419 55%, #15110b 100%);
      box-shadow:
        0 3px 6px rgba(0, 0, 0, 0.55),
        inset 0 2px 3px rgba(255, 255, 255, 0.12),
        inset 0 -3px 6px rgba(0, 0, 0, 0.55);
      border: 1px solid #0a0805;
      pointer-events: none;
    }
    #pad .stick-knob::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 44%;
      height: 44%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 50% 35%, #3a342a 0%, #1a1510 90%);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.7), 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    #pad .label {
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      font-weight: bold;
      color: rgba(40, 30, 15, 0.55);
      letter-spacing: 2.5px;
      pointer-events: none;
      white-space: nowrap;
    }

    /* Tactile circular ENTER / EXIT button in the top-right console strip */
    #interactBtn {
      flex: 0 0 auto;
      width: clamp(46px, 7dvh, 56px);
      height: clamp(46px, 7dvh, 56px);
      border-radius: 50%;
      color: #2a2217;
      font-family: inherit;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      border: 1px solid #6a5d48;
      background:
        radial-gradient(circle at 50% 30%, #fff6e2 0%, #e9dec8 45%, #c2b596 100%);
      box-shadow:
        0 3px 0 #8c7f68,
        0 5px 10px rgba(40, 30, 15, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        inset 0 -3px 6px rgba(140, 120, 90, 0.3);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
      cursor: pointer;
      opacity: 0.38;
      transition: opacity 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #interactBtn.available {
      opacity: 1;
      border-color: #8f3a2a;
      box-shadow:
        0 3px 0 #8c7f68,
        0 5px 10px rgba(40, 30, 15, 0.38),
        0 0 0 2px rgba(200, 87, 63, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.95),
        inset 0 -3px 6px rgba(140, 120, 90, 0.28);
    }
    #interactBtn.available:active {
      background: radial-gradient(circle at 50% 30%, #e9dec8 0%, #c2b596 100%);
      box-shadow:
        0 1px 0 #8c7f68,
        0 2px 4px rgba(40, 30, 15, 0.35),
        inset 0 2px 4px rgba(40, 30, 15, 0.3);
      transform: translateY(2px);
    }

    /* Bottom bar: Rams drilled-dot speakers + MP & PAUSE cream pills */
    .jj-bottom {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 3vw, 18px);
      padding-top: 6px;
      min-height: 36px;
    }
    .jj-speaker {
      width: clamp(42px, 14vw, 70px);
      height: 16px;
      background-image:
        radial-gradient(circle, #3a3328 1.5px, transparent 2px);
      background-size: 10px 8px;
      background-position: 0 3px;
      opacity: 0.55;
      flex-shrink: 1;
    }
    .jj-pill {
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 2.5px;
      font-weight: bold;
      color: #3a3328;
      padding: 6px 14px;
      border-radius: 10px;
      border: 1px solid #6a5d48;
      background:
        linear-gradient(180deg, #f5ecd7 0%, #d9ceb7 55%, #bbae93 100%);
      box-shadow:
        0 2px 0 #8c7f68,
        0 3px 6px rgba(40, 30, 15, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
    }
    .jj-pill:active:not(:disabled) {
      background: linear-gradient(180deg, #d9ceb7 0%, #bbae93 100%);
      box-shadow:
        0 0 0 #8c7f68,
        0 1px 3px rgba(40, 30, 15, 0.35),
        inset 0 1px 2px rgba(40, 30, 15, 0.25);
      transform: translateY(2px);
    }
    .jj-pill.active {
      border-color: #8f3a2a;
      color: #6f2217;
      box-shadow:
        0 2px 0 #8c7f68,
        0 3px 6px rgba(40, 30, 15, 0.35),
        0 0 0 1px rgba(200, 87, 63, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
    }
    .jj-pill:disabled {
      opacity: 0.42;
      cursor: default;
    }

    /* Compact adjustments for very short viewports (e.g. phone landscape) */
    @media (max-height: 500px) {
      body.mobile .jj-plate { padding: 3px 10px 4px; }
      body.mobile .jj-top-bar { min-height: 36px; padding-bottom: 0; }
      body.mobile .jj-wordmark { font-size: 9px; letter-spacing: 3px; }
      body.mobile #interactBtn {
        width: 36px;
        height: 36px;
        font-size: 8px;
      }
      body.mobile #pad .stick-well {
        width: clamp(72px, 21dvh, 102px);
        height: clamp(72px, 21dvh, 102px);
      }
      body.mobile #pad .stick-knob {
        width: clamp(36px, 10dvh, 48px);
        height: clamp(36px, 10dvh, 48px);
      }
      body.mobile #pad .label { display: none; }
      body.mobile .jj-bottom { min-height: 26px; padding-top: 2px; }
      body.mobile .jj-pill { padding: 3px 10px; font-size: 8px; }
    }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="game-container">
    <canvas id="screen"></canvas>
    <div id="wanted-stars" aria-label="Wanted level">
      <span class="star" data-star="1">★</span><span class="star" data-star="2">★</span><span class="star" data-star="3">★</span><span class="star" data-star="4">★</span><span class="star" data-star="5">★</span>
    </div>
    <div id="ui-overlay">
      <h1 class="desktop-only">KR CITY 2</h1>
      <div class="desktop-only"><span class="key">W / S</span> : Move / Accelerate</div>
      <div class="desktop-only"><span class="key">A / D</span> : Turn</div>
      <div class="desktop-only"><span class="key">↑ / ↓</span> : Shoot Up / Down</div>
      <div class="desktop-only"><span class="key">E</span> : Enter / Exit Car or Bike</div>
      <div>HP: <span class="key" id="hp-label">100</span></div>
      <div id="car-hp-row" style="display: none;"><span id="car-class-label">Car</span>: <span class="key" id="car-hp-label">90</span></div>
      <div id="mobile-ammo-row" class="mobile-only">AMMO: <span class="key" id="mobile-ammo-label">12/12</span></div>
    </div>
    <div id="mp-panel">
      <div id="mp-header">
        <span id="mp-title">Multiplayer</span>
        <span id="mp-header-right">
          <span id="mp-badge">Solo</span>
          <button id="mp-toggle" type="button" title="Toggle panel">−</button>
        </span>
      </div>
      <div id="mp-body">
        <div class="mp-row">
          <input id="mp-name" class="mp-input" type="text" maxlength="14" placeholder="Your name" aria-label="Player name">
        </div>
        <div id="mp-idle-controls">
          <div class="mp-row" style="margin-bottom: 6px;">
            <button id="mp-host-btn" class="mp-btn primary" type="button" style="flex: 1;">Host City</button>
          </div>
          <div class="mp-row">
            <input id="mp-code-input" class="mp-input" type="text" maxlength="6" placeholder="Room code" aria-label="Room code" style="text-transform: uppercase;">
            <button id="mp-join-btn" class="mp-btn" type="button">Join</button>
          </div>

  <script>
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const miniCanvas = document.getElementById('minimap');
    const miniCtx = miniCanvas.getContext('2d');

    // Mobile detection: touch-capable + narrow viewport, or explicit ?mobile=1 / ?mobile=0 preview flag.
    const mobileQueryParam = (() => {
      try {
        const param = new URLSearchParams(location.search).get('mobile');
        if (param === '1' || param === 'true') return true;
        if (param === '0' || param === 'false') return false;
      } catch (_) {}
      return null;
    })();
    const isMobile = mobileQueryParam !== null
      ? mobileQueryParam
      : (('ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0) &&
         Math.min(window.innerWidth, window.innerHeight) <= 900);
    if (isMobile) document.body.classList.add('mobile');

    let screenWidth = window.innerWidth;
    let screenHeight = window.innerHeight;

    function resizeCanvas() {
      if (isMobile) {
        const rect = canvas.getBoundingClientRect();
        screenWidth = Math.max(1, Math.floor(rect.width) || (window.innerWidth - 20));
        screenHeight = Math.max(1, Math.floor(rect.height) || Math.floor(window.innerHeight * 0.6));
      } else {
        screenWidth = window.innerWidth;
        screenHeight = window.innerHeight;
      }
      canvas.width = screenWidth;
      canvas.height = screenHeight;
      ctx.imageSmoothingEnabled = false;
      invalidateAtmosphereOverlay();
    }
    window.addEventListener('resize', resizeCanvas);
    if (isMobile) {
      window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 120));
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resizeCanvas);
      }
    }

    // --- WORLD CONFIGURATION ---
    const MAP_SIZE = 57;
    const TILE_SIZE = 72;
    const ROAD_SPACING = 13;
    const ROAD_WIDTH = 3;
    const BUILDING_INSET = 11;
    const BUILDING_FOOTPRINT_TILES = 2;
    const PAVEMENT_TILE = 5;
    const map = [];

    // Tile Types: 0 = Park, 1 = Road, 2-4 = Buildings, 5 = Pavement
    const BUILDING_HEIGHTS = { 0: 0, 1: 0, 2: 40, 3: 80, 4: 130, 5: 0 };

    // Warm, weathered urban palette.
    const PALETTE = {
      background: '#665e51',
      grass: '#355936',
      road: '#29251f',
      roadLine: '#d8cfba',
      sidewalk: '#aaa08d',
      pavement: '#beb39d',
      pavementEdge: '#827866',
      brick: '#a93f34',
      rust: '#8e4937',
      shadow: 'rgba(54, 45, 35, 0.25)',
      roofs: { 2: '#9d988f', 3: '#817d75', 4: '#68655f' },
      wallsLeft: { 2: '#7f7b74', 3: '#68655f', 4: '#514f4b' },
      wallsRight: { 2: '#918c83', 3: '#77736b', 4: '#5f5c56' },
      windows: '#c2beb2',
      windowsLit: '#e8c99a',
      windowsShade: '#8a8478',
      cabinet: '#3c5641',
      cabinetRoof: '#2f4534',
      bayFill: '#2a2620',
      bayLine: 'rgba(224, 216, 196, 0.72)'
    };

    function isRoadIndex(index) {
      return index % ROAD_SPACING < ROAD_WIDTH;
    }

    function isBuildingAnchor(r, c) {
      const localRow = r % ROAD_SPACING;
      const localCol = c % ROAD_SPACING;
      const firstBuildingTile = ROAD_WIDTH + 1;
      return localRow >= firstBuildingTile &&
        localCol >= firstBuildingTile &&
        (localRow - firstBuildingTile) % BUILDING_FOOTPRINT_TILES === 0 &&
        (localCol - firstBuildingTile) % BUILDING_FOOTPRINT_TILES === 0;
    }

    // Broad avenues surround 10x10 blocks with 4x4 large buildings inside.
    for (let r = 0; r < MAP_SIZE; r++) {
      map[r] = [];
      for (let c = 0; c < MAP_SIZE; c++) {
        const roadRow = isRoadIndex(r);
        const roadCol = isRoadIndex(c);
        const blockRow = Math.floor(r / ROAD_SPACING);
        const blockCol = Math.floor(c / ROAD_SPACING);
        const parkBlock = (blockRow * 3 + blockCol * 5) % 9 === 0;
        const localRow = r % ROAD_SPACING;
        const localCol = c % ROAD_SPACING;
        const blockEdge = localRow === ROAD_WIDTH ||
          localRow === ROAD_SPACING - 1 ||
          localCol === ROAD_WIDTH ||
          localCol === ROAD_SPACING - 1;

        if (roadRow || roadCol) {
          map[r][c] = 1;
        } else if (parkBlock) {
          map[r][c] = 0;
        } else if (blockEdge) {
          map[r][c] = PAVEMENT_TILE;
        } else {
          const firstBuildingTile = ROAD_WIDTH + 1;
          const buildingRow = Math.floor((localRow - firstBuildingTile) / BUILDING_FOOTPRINT_TILES);
          const buildingCol = Math.floor((localCol - firstBuildingTile) / BUILDING_FOOTPRINT_TILES);
          const typeSeed = (
            blockRow * 7 +
            blockCol * 11 +
            buildingRow * 5 +
            buildingCol * 3
          ) % 12;
          map[r][c] = typeSeed > 8 ? 4 : (typeSeed > 4 ? 3 : 2);
        }
      }
    }

    const billboardImage = new Image();
    billboardImage.src = 'KR.png';
    const billboards = [];

    function isStreetTile(r, c) {
      if (r < 0 || c < 0 || r >= MAP_SIZE || c >= MAP_SIZE) return false;
      const type = map[r][c];
      return type === 1 || type === PAVEMENT_TILE;
    }

    function spawnBillboards() {
      const candidates = [];
      for (let r = 0; r < MAP_SIZE; r++) {
        for (let c = 0; c < MAP_SIZE; c++) {
          if (!isBuildingAnchor(r, c)) continue;
          const tileType = map[r][c];
          if (tileType !== 3 && tileType !== 4) continue;
          const faces = [];
          if (isStreetTile(r - 1, c) || isStreetTile(r - 1, c + 1)) faces.push(0);
          if (isStreetTile(r, c + 2) || isStreetTile(r + 1, c + 2)) faces.push(1);
          if (isStreetTile(r + 2, c) || isStreetTile(r + 2, c + 1)) faces.push(2);
          if (isStreetTile(r, c - 1) || isStreetTile(r + 1, c - 1)) faces.push(3);
          if (faces.length) candidates.push({ r, c, tileType, faces });
        }
      }
      shuffleInPlace(candidates);
      const count = Math.min(candidates.length, Math.max(8, Math.floor(candidates.length * 0.4)));
      const size = TILE_SIZE * BUILDING_FOOTPRINT_TILES - BUILDING_INSET * 2;
      const boardAlong = 0.72;
      const aspect = 948 / 563;
      for (let i = 0; i < count; i++) {
        const { r, c, tileType, faces } = candidates[i];
        const wallIndex = faces[Math.floor(Math.random() * faces.length)];
        const h = BUILDING_HEIGHTS[tileType];
        const bx = c * TILE_SIZE + BUILDING_INSET;
        const by = r * TILE_SIZE + BUILDING_INSET;
        const wallWidth = size * boardAlong;
        const wallHeight = wallWidth / aspect;
        const u0 = (1 - boardAlong) / 2;
        const u1 = u0 + boardAlong;
        const z0 = h * 0.5 - wallHeight / 2;
        const z1 = h * 0.5 + wallHeight / 2;
        const walls = [
          { a: [bx, by], b: [bx + size, by], ox: 0, oy: -1.8 },
          { a: [bx + size, by], b: [bx + size, by + size], ox: 1.8, oy: 0 },
          { a: [bx + size, by + size], b: [bx, by + size], ox: 0, oy: 1.8 },
          { a: [bx, by + size], b: [bx, by], ox: -1.8, oy: 0 }
        ];
        const wall = walls[wallIndex];
        billboards.push({
          r, c, wallIndex, u0, u1, z0, z1,
          ax: wall.a[0], ay: wall.a[1],
          bx: wall.b[0], by: wall.b[1],
          ox: wall.ox, oy: wall.oy,
          sparkWait: 240 + Math.floor(Math.random() * 420),
          burstGlow: 0,
          sparks: []
        });
      }
    }

    spawnBillboards();

    // --- PLAYER & CAMERA ---
    const START_ROAD = Math.floor((MAP_SIZE / 2) / ROAD_SPACING) * ROAD_SPACING;
    const START_BLOCK = START_ROAD + ROAD_WIDTH;
    const NPC_CAR_MAX_HEALTH = 40;
    const PLAYER_CAR_MAX_HEALTH = 90;
    const PLAYER_MAX_HP = 100;
    const PLAYER_WALK_DRIVE = { maxSpeed: 7, accel: 0.06, driveRadius: 10 };

    // Steer acceleration: fraction of this frame's full turn speed added per frame
    // while a turn key is held. Release or both directions snaps to 0.
    // At 60fps: 0.05 ≈ 0.33s to full, 0.10 ≈ 0.17s, 0.20 ≈ 0.08s, 1 = instant.
    const STEER_FEEL = {
      walkAccel: 0.05,
      driveAccel: 0.02
    };

    const CAR_CLASSES = {
      normal: {
        label: 'Car',
        npcHealth: NPC_CAR_MAX_HEALTH,
        playerHealth: PLAYER_CAR_MAX_HEALTH,
        maxSpeed: 7,
        accel: 0.06,
        radius: 13,
        driveRadius: 10,
        cruiseMin: 1.5,
        cruiseSpan: 0.8,
        driftEnter: 0.55,
        driftHold: 0.4,
        driftGrip: 0.07,
        grip: 0.22,
        driftSteer: 0.42,
        steerAccel: 0.14,
        shove: 1,
        colors: ['#a94336', '#668078', '#d0b56f', '#6f7b4b', '#c19a61']
      },
      van: {
        label: 'Van',
        npcHealth: 60,
        playerHealth: 130,
        maxSpeed: 5.4,
        accel: 0.042,
        radius: 16,
        driveRadius: 12,
        cruiseMin: 1.15,
        cruiseSpan: 0.55,
        driftEnter: 0.68,
        driftHold: 0.52,
        driftGrip: 0.12,
        grip: 0.32,
        driftSteer: 0.18,
        steerAccel: 0.09,
        shove: 1.45,
        colors: ['#6b675c', '#5d6a62', '#7a6a58', '#4f5854', '#8a7e6a']
      },
      sports: {
        label: 'Sports',
        npcHealth: 28,
        playerHealth: 65,
        maxSpeed: 8.6,
        accel: 0.082,
        radius: 12,
        driveRadius: 9,
        cruiseMin: 2.0,
        cruiseSpan: 0.8,
        driftEnter: 0.45,
        driftHold: 0.32,
        driftGrip: 0.045,
        grip: 0.18,
        driftSteer: 0.58,
        steerAccel: 0.20,
        shove: 0.85,
        colors: ['#c4453c', '#d4a03a', '#3d7a8c', '#b84e6e', '#e8d07a']
      }
    };
    const player = {
      // Begin on the roadside beside the parked player car.
      mode: 'walking',
      x: START_BLOCK * TILE_SIZE + TILE_SIZE / 2,
      y: START_BLOCK * TILE_SIZE - 12,
      angle: 34 * (Math.PI / 180),
      cameraAngle: 34 * (Math.PI / 180),
      cameraEasing: false,
      speed: 0,
      vx: 0,
      vy: 0,
      drifting: false,
      motionSpeed: 0,
      cameraSlope: 0.36,
      cameraLookAhead: 0,
      cameraRearPeek: 0,
      maxSpeed: 7,
      accel: 0.06,
      friction: 0.92,
      turnSpeed: 0.045,
      steerRate: 0,
      walkSpeed: 2.6,
      walkPhase: 0,
      radius: 4,
      driveRadius: 10,
      hp: PLAYER_MAX_HP,
      hitCooldown: 0,
      blastCooldown: 0,
      gunHitCooldown: 0
    };

    const vehicles = [];
    let activeVehicle = null;

    // --- MULTIPLAYER (P2P WebRTC / PeerJS, Level 2 Host-Authoritative) ---
    const MP_COAT_PALETTE = [
      '#a94336', '#3d7a8c', '#c9933b', '#6b8e4e', '#8e5572', '#4c6fa8', '#b86b35'
    ];
    const net = {
      role: 'solo', // 'solo' | 'host' | 'guest'
      peer: null,
      roomCode: '',
      peerPrefix: 'krcity2-room-',
      localId: 'local',
      localName: '',
      localCoat: '#a94336',
      conns: new Map(), // host: peerId -> DataConnection
      hostConn: null,   // guest: DataConnection to host
      players: new Map(), // remote players: peerId -> state
      frameCounter: 0,
      respawnTimeout: null,
      coatIndex: 1
    };

    function isVehicleOccupiedByOther(vehicle) {
      return !!(vehicle && vehicle.driverId && vehicle.driverId !== net.localId);
    }

    function isVehicleDrivenBy(vehicle, playerId) {
      if (!vehicle) return false;
      if (playerId === net.localId && vehicle === activeVehicle) return true;
      return !!(playerId && vehicle.driverId === playerId);
    }
    const skidMarks = [];
    const SKID_LIFE = 180;
    const SKID_MAX = 180;
    // Radians of slip (nose vs travel) before marks appear while drifting.
    const SKID_SLIP_MIN = 0.22;

    // Camera shake: trauma 0–1, squared for punch; decays each frame.
    const SHAKE = {
      maxTrauma: 1,
      decay: 0.86,
      maxOffset: 32,
      maxAngle: 0.035,
      minorFire: 0.11,
      minorWall: 0.2,
      mediumRunover: 0.34,
      mediumCrash: 0.38,
      bigBlast: 0.72,
      tinyGunHit: 0.1,
      blastNear: ROAD_SPACING * TILE_SIZE * 1.15
    };
    const cameraShake = { trauma: 0 };
    let shakeSample = { x: 0, y: 0, angle: 0 };

    function addCameraShake(amount) {
      if (amount <= 0 || wasted) return;
      cameraShake.trauma = Math.min(
        SHAKE.maxTrauma,
        cameraShake.trauma + amount
      );
    }

    function updateCameraShake() {
      if (cameraShake.trauma <= 0) {
        cameraShake.trauma = 0;
        shakeSample = { x: 0, y: 0, angle: 0 };
        return;
      }
      cameraShake.trauma *= SHAKE.decay;
      if (cameraShake.trauma < 0.002) cameraShake.trauma = 0;
      const mag = cameraShake.trauma * cameraShake.trauma;
      shakeSample = {
        x: (Math.random() * 2 - 1) * mag * SHAKE.maxOffset,
        y: (Math.random() * 2 - 1) * mag * SHAKE.maxOffset,
        angle: (Math.random() * 2 - 1) * mag * SHAKE.maxAngle
      };
    }

    const carSmoke = [];
    const wreckFx = [];
    const bullets = [];
    const muzzleFlashes = [];
    let wasted = false;

    // --- COMBAT & WANTED (tweakable) ---
    const BLOCK_WORLD = ROAD_SPACING * TILE_SIZE;
    const COMBAT = {
      magSize: 12,
      fireInterval: 12,
      reloadFrames: 90,
      bulletSpeed: 12,
      bulletLife: 42,
      playerBulletLife: 84,
      bulletRadius: 7,
      carDamage: 5,
      playerGunDamage: 12,
      policeGunDamagePed: 14,
      policeGunDamageCar: 9,
      muzzleLife: 4,
      fleeRadius: 130
    };
    const WANTED = {
      maxStars: 5,
      coolFrames: 480,
      nearDist: BLOCK_WORLD * 2,
      spawnInterval: 90,
      policeHp: 3,
      policeSpeed: 1.15,
      policeShootRange: 210,
      policeShootInterval: 38,
      policeAimDot: 0.72,
      spawnMinDist: BLOCK_WORLD * 0.85,
      spawnMaxDist: BLOCK_WORLD * 1.55,
      maxByStars: [0, 2, 3, 4, 5, 6],
      policeCarsBase: 3,
      policeCarsHigh: 6,
      policeCarsHighAt: 3,
      policeChaseFrom: 1,
      policeChaseSpeed: 3.2,
      policeRoamSpeed: 2.4
    };
    const POLICE_LOOK = {
      coat: '#1a3a6e',
      coatEdge: '#0f2448',
      hiVis: '#1a3a6e',
      hiVisEdge: '#0f2448',
      hat: '#0c1018',
      checkLight: '#ffffff',
      checkDark: '#111111',
      collar: '#e8e4dc',
      accent: '#c9a227'
    };

    const gun = {
      ammo: COMBAT.magSize,
      fireCooldown: 0,
      reloadTimer: 0,
      reloadMax: 0,
      lastShootCode: null
    };
    let wantedLevel = 0;
    let wantedCoolTimer = 0;
    let policeSpawnCooldown = 0;
    let policeCarsHunting = false;
    let policeCarSpawnId = 0;

    const starterVehicle = {
      id: 'starter',
      x: START_BLOCK * TILE_SIZE + BUILDING_INSET / 2,
      y: START_BLOCK * TILE_SIZE - 18,
      angle: 0,
      speed: 0,
      baseSpeed: 5,
      color: '#e0b44a',
      ai: false,
      parked: true,
      collisionCooldown: 0
    };
    assignCarClass(starterVehicle, 'normal', true);
    vehicles.push(starterVehicle);

    // --- TRAFFIC & PEDESTRIANS ---
    for (let i = 0; i < 12; i++) {
      const horizontal = i % 2 === 0;
      const avenueCount = Math.ceil(MAP_SIZE / ROAD_SPACING);
      const roadBase = Math.floor(Math.random() * avenueCount) * ROAD_SPACING;
      const forward = Math.random() > 0.5;
      const dirIndex = horizontal
        ? (forward ? 0 : 2)
        : (forward ? 1 : 3);
      const lane = getLeftLaneCenter(roadBase, dirIndex);
      const travelPosition = (1 + Math.random() * (MAP_SIZE - 2)) * TILE_SIZE;
      const carClass = pickCarClass();
      const spec = getCarSpec(carClass);
      const cruisingSpeed = spec.cruiseMin + Math.random() * spec.cruiseSpan;

      const trafficCar = {
        id: `traffic-${i}`,
        type: 'car',
        x: horizontal ? travelPosition : lane,
        y: horizontal ? lane : travelPosition,
        axis: horizontal ? 'horizontal' : 'vertical',
        roadBase,
        dirIndex,
        dir: dirIndex * (Math.PI / 2),
        angle: dirIndex * (Math.PI / 2),
        speed: cruisingSpeed,
        baseSpeed: cruisingSpeed,
        targetSpeed: cruisingSpeed,
        color: pickCarColor(carClass),
        ai: true,
        turn: null,
        turnIntent: null,
        lastIntersection: null,
        collisionCooldown: 0
      };
      assignCarClass(trafficCar, carClass, false);
      vehicles.push(trafficCar);
    }

    function pickRoadSpawnAwayFromPlayer(minDist) {
      const avenueCount = Math.ceil(MAP_SIZE / ROAD_SPACING);
      for (let attempt = 0; attempt < 30; attempt++) {
        const horizontal = Math.random() > 0.5;
        const roadBase = Math.floor(Math.random() * avenueCount) * ROAD_SPACING;
        const forward = Math.random() > 0.5;
        const dirIndex = horizontal
          ? (forward ? 0 : 2)
          : (forward ? 1 : 3);
        const lane = getLeftLaneCenter(roadBase, dirIndex);
        const travelPosition = (1.5 + Math.random() * (MAP_SIZE - 3)) * TILE_SIZE;
        const x = horizontal ? travelPosition : lane;
        const y = horizontal ? lane : travelPosition;
        if (minDist && Math.hypot(x - player.x, y - player.y) < minDist) continue;
        return { x, y, horizontal, roadBase, dirIndex, lane };
      }
      return null;
    }

    function createPoliceCar() {
      const spot = pickRoadSpawnAwayFromPlayer(BLOCK_WORLD * 0.7) || pickRoadSpawnAwayFromPlayer(0);
      if (!spot) return null;
      policeCarSpawnId++;
      const cruisingSpeed = WANTED.policeRoamSpeed;
      const car = {
        id: `police-car-${policeCarSpawnId}`,
        type: 'car',
        x: spot.x,
        y: spot.y,
        axis: spot.horizontal ? 'horizontal' : 'vertical',
        roadBase: spot.roadBase,
        dirIndex: spot.dirIndex,
        dir: spot.dirIndex * (Math.PI / 2),
        angle: spot.dirIndex * (Math.PI / 2),
        speed: cruisingSpeed,
        baseSpeed: cruisingSpeed,
        targetSpeed: cruisingSpeed,
        color: '#f3f0e8',
        ai: true,
        turn: null,
        turnIntent: null,
        lastIntersection: null,
        collisionCooldown: 0,
        isPoliceCar: true
      };
      assignCarClass(car, 'normal', false);
      car.maxHealth = 55;
      car.health = 55;
      car.baseSpeed = cruisingSpeed;
      return car;
    }

    for (let i = 0; i < WANTED.policeCarsBase; i++) {
      const copCar = createPoliceCar();
      if (copCar) vehicles.push(copCar);
    }

    const pedestrians = [];
    const pedestrianTiles = [];
    for (let r = 0; r < MAP_SIZE; r++) {
      for (let c = 0; c < MAP_SIZE; c++) {
        if (map[r][c] === PAVEMENT_TILE || map[r][c] === 0) {
          pedestrianTiles.push({ r, c });
        }
      }
    }

    const pedestrianColors = ['#a94336', '#6f7b4b', '#c19a61', '#69757a', '#8b6451'];
    const skinTones = ['#f0c7a5', '#d9a27f', '#bc7f5f', '#925d43', '#68402f'];
    const playerSkin = skinTones[Math.floor(Math.random() * skinTones.length)];
    for (let i = 0; i < 24; i++) {
      const tile = pedestrianTiles[Math.floor(Math.random() * pedestrianTiles.length)];
      pedestrians.push({
        id: `pedestrian-${i}`,
        x: (tile.c + 0.5) * TILE_SIZE,
        y: (tile.r + 0.5) * TILE_SIZE,
        angle: Math.floor(Math.random() * 4) * (Math.PI / 2),
        speed: 0.55 + Math.random() * 0.45,
        radius: 3,
        walkPhase: Math.random() * Math.PI * 2,
        coat: pedestrianColors[i % pedestrianColors.length],
        skin: skinTones[Math.floor(Math.random() * skinTones.length)],
        idleTimer: Math.floor(Math.random() * 90),
        health: 1,
        isPolice: false
      });
    }

    const parkingBays = [];
    const bikeBays = [];
    const cabinets = [];

    const BIKE = {
      speed: 4.2,
      radius: 5,
      enterDist: 42,
      baySnapDist: 78,
      bayCount: 6,
      bikesMin: 1,
      bikesMax: 5,
      slotSpacing: 13,
      length: 22,
      lime: '#b8e000',
      frame: '#f2f4f0',
      tyre: '#1a1a1a',
      minimap: 'rgba(180, 220, 120, 0.85)'
    };

    function isJunctionPavement(r, c) {
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr < 0 || nc < 0 || nr >= MAP_SIZE || nc >= MAP_SIZE) continue;
          if (isRoadIndex(nr) && isRoadIndex(nc)) return true;
        }
      }
      return false;
    }

    function roadSideOfPavement(r, c) {
      if (map[r][c] !== PAVEMENT_TILE) return null;
      const north = r > 0 && map[r - 1][c] === 1;
      const south = r < MAP_SIZE - 1 && map[r + 1][c] === 1;
      const west = c > 0 && map[r][c - 1] === 1;
      const east = c < MAP_SIZE - 1 && map[r][c + 1] === 1;
      const count = (north ? 1 : 0) + (south ? 1 : 0) + (west ? 1 : 0) + (east ? 1 : 0);
      if (count !== 1) return null;
      if (north) return 'n';
      if (south) return 's';
      if (west) return 'w';
      return 'e';
    }

    function shuffleInPlace(list) {
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = list[i];
        list[i] = list[j];
        list[j] = tmp;
      }
      return list;
    }

    function spawnStreetFurniture() {
      const BAY_LENGTH = 42;
      const BAY_DEPTH = 28;
      const BAY_GAP = 8;
      const ROAD_OVERLAP = 12;
      const pairSpan = BAY_LENGTH * 2 + BAY_GAP;
      const usedTiles = new Set();
      const tileKey = (r, c) => `${r},${c}`;

      const frontageByGroup = new Map();
      for (let r = 0; r < MAP_SIZE; r++) {
        for (let c = 0; c < MAP_SIZE; c++) {
          if (map[r][c] !== PAVEMENT_TILE || isJunctionPavement(r, c)) continue;
          const side = roadSideOfPavement(r, c);
          if (!side) continue;
          const groupKey = (side === 'n' || side === 's') ? `h-${r}-${side}` : `v-${c}-${side}`;
          if (!frontageByGroup.has(groupKey)) frontageByGroup.set(groupKey, []);
          frontageByGroup.get(groupKey).push({ r, c, side });
        }
      }

      const pairSlots = [];
      frontageByGroup.forEach(tiles => {
        const side = tiles[0].side;
        tiles.sort((a, b) => (side === 'n' || side === 's') ? a.c - b.c : a.r - b.r);
        for (let i = 0; i < tiles.length - 1; i++) {
          const a = tiles[i];
          const b = tiles[i + 1];
          const consecutive = (side === 'n' || side === 's')
            ? a.r === b.r && b.c === a.c + 1
            : a.c === b.c && b.r === a.r + 1;
          if (consecutive) pairSlots.push([a, b]);
        }
      });
      shuffleInPlace(pairSlots);

      const pairBudget = Math.min(16, Math.max(6, Math.floor(pairSlots.length * 0.1)));
      let placedPairs = 0;
      for (let s = 0; s < pairSlots.length && placedPairs < pairBudget; s++) {
        const [a, b] = pairSlots[s];
        if (usedTiles.has(tileKey(a.r, a.c)) || usedTiles.has(tileKey(b.r, b.c))) continue;
        usedTiles.add(tileKey(a.r, a.c));
        usedTiles.add(tileKey(b.r, b.c));
        placedPairs++;

        const side = a.side;
        const alongX = side === 'n' || side === 's';
        const originX = Math.min(a.c, b.c) * TILE_SIZE;
        const originY = Math.min(a.r, b.r) * TILE_SIZE;
        const startAlong = (TILE_SIZE * 2 - pairSpan) / 2;

        const addBay = alongOffset => {
          let x;
          let y;
          let w;
          let h;
          let angle;
          if (alongX) {
            w = BAY_LENGTH;
            h = BAY_DEPTH;
            x = originX + startAlong + alongOffset;
            y = side === 'n'
              ? originY - ROAD_OVERLAP
              : originY + TILE_SIZE - BAY_DEPTH + ROAD_OVERLAP;
            angle = 0;
          } else {
            w = BAY_DEPTH;
            h = BAY_LENGTH;
            y = originY + startAlong + alongOffset;
            x = side === 'w'
              ? originX - ROAD_OVERLAP
              : originX + TILE_SIZE - BAY_DEPTH + ROAD_OVERLAP;
            angle = Math.PI / 2;
          }
          parkingBays.push({
            x, y, w, h, angle, side,
            cx: x + w / 2,
            cy: y + h / 2,
            occupied: false
          });
        };
        addBay(0);
        addBay(BAY_LENGTH + BAY_GAP);
      }

      const cabinetCandidates = [];
      for (let r = 0; r < MAP_SIZE; r++) {
        for (let c = 0; c < MAP_SIZE; c++) {
          if (map[r][c] !== PAVEMENT_TILE || isJunctionPavement(r, c)) continue;
          if (usedTiles.has(tileKey(r, c))) continue;
          const side = roadSideOfPavement(r, c);
          if (!side) continue;
          cabinetCandidates.push({ r, c, side });
        }
      }
      shuffleInPlace(cabinetCandidates);
      const cabinetBudget = Math.min(22, Math.max(10, Math.floor(cabinetCandidates.length * 0.07)));
      for (let i = 0; i < cabinetBudget; i++) {
        const { r, c, side } = cabinetCandidates[i];
        const againstKerb = (r * 13 + c * 7) % 2 === 0;
        const along = 14;
        const depth = 10;
        const inset = 8;
        const tileX = c * TILE_SIZE;
        const tileY = r * TILE_SIZE;
        const centerAlong = TILE_SIZE / 2 - along / 2;
        let x;
        let y;
        let w;
        let h;
        if (side === 'n' || side === 's') {
          w = along;
          h = depth;
          x = tileX + centerAlong;
          if (side === 'n') {
            y = againstKerb ? tileY + inset : tileY + TILE_SIZE - depth - inset;
          } else {
            y = againstKerb ? tileY + TILE_SIZE - depth - inset : tileY + inset;
          }
        } else {
          w = depth;
          h = along;
          y = tileY + centerAlong;
          if (side === 'w') {
            x = againstKerb ? tileX + inset : tileX + TILE_SIZE - depth - inset;
          } else {
            x = againstKerb ? tileX + TILE_SIZE - depth - inset : tileX + inset;
          }
        }
        cabinets.push({ x, y, w, h, height: 17, side });
      }
    }

    function bayRectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    function spawnBikeHire() {
      const BAY_DEPTH = 34;
      const ROAD_OVERLAP = 10;
      const candidates = [];

      for (let r = 0; r < MAP_SIZE; r++) {
        for (let c = 0; c < MAP_SIZE; c++) {
          if (map[r][c] !== PAVEMENT_TILE || isJunctionPavement(r, c)) continue;
          const side = roadSideOfPavement(r, c);
          if (!side) continue;
          candidates.push({ r, c, side });
        }
      }
      shuffleInPlace(candidates);

      for (let i = 0; i < candidates.length && bikeBays.length < BIKE.bayCount; i++) {
        const { r, c, side } = candidates[i];
        const bikeCount = BIKE.bikesMin + Math.floor(Math.random() * (BIKE.bikesMax - BIKE.bikesMin + 1));
        const along = bikeCount * BIKE.slotSpacing + 10;
        const tileX = c * TILE_SIZE;
        const tileY = r * TILE_SIZE;
        let x;
        let y;
        let w;
        let h;
        let angle;
        let bikeAngle;

        if (side === 'n' || side === 's') {
          w = along;
          h = BAY_DEPTH;
          x = tileX + (TILE_SIZE - along) / 2;
          y = side === 'n'
            ? tileY - ROAD_OVERLAP
            : tileY + TILE_SIZE - BAY_DEPTH + ROAD_OVERLAP;
          angle = 0;
          bikeAngle = side === 'n' ? -Math.PI / 2 : Math.PI / 2;
        } else {
          w = BAY_DEPTH;
          h = along;
          y = tileY + (TILE_SIZE - along) / 2;
          x = side === 'w'
            ? tileX - ROAD_OVERLAP
            : tileX + TILE_SIZE - BAY_DEPTH + ROAD_OVERLAP;
          angle = Math.PI / 2;
          bikeAngle = side === 'w' ? Math.PI : 0;
        }

        if (parkingBays.some(bay =>
          bayRectsOverlap(x, y, w, h, bay.x, bay.y, bay.w, bay.h)
        )) continue;
        if (bikeBays.some(bay =>
          bayRectsOverlap(x, y, w, h, bay.x, bay.y, bay.w, bay.h)
        )) continue;

        const slots = [];
        for (let s = 0; s < bikeCount; s++) {
          const t = (s + 0.5) / bikeCount;
          let sx;
          let sy;
          if (side === 'n' || side === 's') {
            sx = x + t * w;
            sy = y + h * 0.55;
          } else {
            sx = x + w * 0.55;
            sy = y + t * h;
          }
          slots.push({ x: sx, y: sy, angle: bikeAngle, bikeId: null });
        }

        const bay = {
          id: `bike-bay-${bikeBays.length}`,
          x, y, w, h, angle, side, bikeAngle,
          cx: x + w / 2,
          cy: y + h / 2,
          slots
        };
        bikeBays.push(bay);

        slots.forEach((slot, slotIndex) => {
          const bike = {
            id: `lime-${bay.id}-${slotIndex}`,
            type: 'bike',
            isBike: true,
            x: slot.x,
            y: slot.y,
            angle: slot.angle,
            speed: 0,
            radius: BIKE.radius,
            driveRadius: BIKE.radius,
            color: BIKE.lime,
            ai: false,
            parked: true,
            bayId: bay.id,
            slotIndex,
            maxHealth: 40,
            health: 40,
            collisionCooldown: 0
          };
          slot.bikeId = bike.id;
          vehicles.push(bike);
        });
      }
    }

    spawnStreetFurniture();
    spawnBikeHire();

    const spawnRefX = START_BLOCK * TILE_SIZE + TILE_SIZE / 2;
    const spawnRefY = START_BLOCK * TILE_SIZE - 12;
    let spawnBay = null;
    let spawnDist = Infinity;
    parkingBays.forEach(bay => {
      const distance = Math.hypot(bay.cx - spawnRefX, bay.cy - spawnRefY);
      if (distance < spawnDist) {
        spawnDist = distance;
        spawnBay = bay;
      }
    });
    if (spawnBay && spawnDist < TILE_SIZE * 10) {
      starterVehicle.x = spawnBay.cx;
      starterVehicle.y = spawnBay.cy;
      starterVehicle.angle = spawnBay.angle;
      spawnBay.occupied = true;
      const pad = 11;
      const walkSpots = spawnBay.side === 'n'
        ? [{ x: spawnBay.cx, y: spawnBay.y + spawnBay.h + pad }]
        : spawnBay.side === 's'
          ? [{ x: spawnBay.cx, y: spawnBay.y - pad }]
          : spawnBay.side === 'w'
            ? [{ x: spawnBay.x + spawnBay.w + pad, y: spawnBay.cy }]
            : [{ x: spawnBay.x - pad, y: spawnBay.cy }];
      const walkSpot = walkSpots.find(spot => canWalkAt(spot.x, spot.y, player.radius));
      if (walkSpot) {
        player.x = walkSpot.x;
        player.y = walkSpot.y;
        player.angle = spawnBay.angle;
        player.cameraAngle = spawnBay.angle;
      }
    }

    let parkedIndex = 0;
    parkingBays.forEach(bay => {
      if (bay.occupied || Math.random() > 0.45) return;
      bay.occupied = true;
      const carClass = pickCarClass();
      const parkedCar = {
        id: `parked-${parkedIndex}`,
        x: bay.cx,
        y: bay.cy,
        angle: bay.angle + (Math.random() > 0.5 ? Math.PI : 0),
        speed: 0,
        baseSpeed: 5,
        color: pickCarColor(carClass),
        ai: false,
        parked: true,
        collisionCooldown: 0
      };
      assignCarClass(parkedCar, carClass, false);
      vehicles.push(parkedCar);
      parkedIndex++;
    });

    pedestrians.forEach(pedestrian => {
      if (!hitsCabinet(pedestrian.x, pedestrian.y, pedestrian.radius + 4)) return;
      for (let attempt = 0; attempt < 16; attempt++) {
        const tile = pedestrianTiles[Math.floor(Math.random() * pedestrianTiles.length)];
        const x = (tile.c + 0.5) * TILE_SIZE;
        const y = (tile.r + 0.5) * TILE_SIZE;
        if (!hitsCabinet(x, y, pedestrian.radius + 4)) {
          pedestrian.x = x;
          pedestrian.y = y;
          return;
        }
      }
    });

    function getLeftLaneCenter(roadBase, dirIndex) {
      // Opposing traffic uses the quarter points of each broad avenue.
      const firstLane = dirIndex === 0 || dirIndex === 3;
      const laneOffset = ROAD_WIDTH * (firstLane ? 0.25 : 0.75);
      return (roadBase + laneOffset) * TILE_SIZE;
    }

    const intersections = [];
    let simulationTick = 0;
    for (let roadY = 0; roadY < MAP_SIZE; roadY += ROAD_SPACING) {
      for (let roadX = 0; roadX < MAP_SIZE; roadX += ROAD_SPACING) {
        intersections.push({
          id: `${roadX}-${roadY}`,
          roadX,
          roadY,
          x: (roadX + ROAD_WIDTH / 2) * TILE_SIZE,
          y: (roadY + ROAD_WIDTH / 2) * TILE_SIZE,
          phaseOffset: ((roadX + roadY) / ROAD_SPACING % 2) * 300,
          occupant: null
        });
      }
    }

    function getSignalAxis(intersection) {
      const phase = (simulationTick + intersection.phaseOffset) % 600;
      if (phase < 260) return 'horizontal';
      if (phase < 300) return 'all-red';
      if (phase < 560) return 'vertical';
      return 'all-red';
    }

    function directionVector(dirIndex) {
      return {
        x: [1, 0, -1, 0][dirIndex],
        y: [0, 1, 0, -1][dirIndex]
      };
    }

    // --- CONTROLS ---
    const keys = {};
    const heldCodes = new Set();
    // Set true to log drive input / mode / blocking in the console.
    const DEBUG_DRIVE = false;
    let debugDriveLogAt = 0;
    function debugDrive(tag, extra) {
      if (!DEBUG_DRIVE) return;
      const now = performance.now();
      // Enter/exit / early-exit / key events always; frame samples ~4/sec.
      const isFrame = tag === 'drive-frame' || tag === 'input-route' || tag === 'drive-blocked';
      if (isFrame && now - debugDriveLogAt < 250) return;
      if (isFrame) debugDriveLogAt = now;
      const held = Array.from(heldCodes);
      console.log(`[drive] ${tag}`, {
        mode: player.mode,
        activeId: activeVehicle && activeVehicle.id,
        isBike: !!(activeVehicle && activeVehicle.isBike),
        keys: { w: !!keys.w, a: !!keys.a, s: !!keys.s, d: !!keys.d },
        heldW: heldCodes.has('KeyW'),
        heldA: heldCodes.has('KeyA'),
        heldS: heldCodes.has('KeyS'),
        heldD: heldCodes.has('KeyD'),
        held,
        speed: player.speed,
        accel: player.accel,
        maxSpeed: player.maxSpeed,
        vx: player.vx,
        vy: player.vy,
        ...(extra || {})
      });
    }

    const CODE_TO_KEY = {
      KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd', KeyE: 'e',
      ArrowLeft: 'arrowleft', ArrowRight: 'arrowright',
      ArrowUp: 'arrowup', ArrowDown: 'arrowdown'
    };

    function setKeyPressed(e, pressed) {
      if (e.code) {
        if (pressed) heldCodes.add(e.code);
        else heldCodes.delete(e.code);
      }
      // Prefer e.code so keyup still matches after A/D + arrow chords.
      // e.key can change between down/up when several keys are held.
      const nameFromCode = e.code && CODE_TO_KEY[e.code];
      if (nameFromCode) {
        keys[nameFromCode] = pressed;
        if (DEBUG_DRIVE && !e.repeat && (nameFromCode === 'w' || nameFromCode === 'a' ||
            nameFromCode === 's' || nameFromCode === 'd')) {
          debugDrive(pressed ? 'keydown' : 'keyup', {
            code: e.code,
            key: e.key,
            mapped: nameFromCode
          });
        }
        return;
      }
      const nameFromKey = e.key && e.key.toLowerCase();
      if (nameFromKey) keys[nameFromKey] = pressed;
    }

    function clearHeldKeys() {
      if (DEBUG_DRIVE && (heldCodes.size || keys.w || keys.a || keys.s || keys.d)) {
        debugDrive('clear-held-keys');
      }
      heldCodes.clear();
      Object.keys(keys).forEach(name => { keys[name] = false; });
      player.steerRate = 0;
      gun.lastShootCode = null;
      if (typeof resetMobileSticks === 'function') resetMobileSticks();
    }

    function anyCodeHeld() {
      for (let i = 0; i < arguments.length; i++) {
        if (heldCodes.has(arguments[i])) return true;
      }
      return false;
    }

    function getActiveShootCode() {
      const up = anyCodeHeld('ArrowUp');
      const down = anyCodeHeld('ArrowDown');
      if (up && down) return gun.lastShootCode === 'ArrowDown' ? 'ArrowDown' : 'ArrowUp';
      if (down) return 'ArrowDown';
      if (up) return 'ArrowUp';
      return null;
    }

    function isTypingInUi(target) {
      if (!target) return false;
      const tag = target.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || target.isContentEditable;
    }

    function onKeyDown(e) {
      if (isTypingInUi(e.target)) return;
      setKeyPressed(e, true);
      if (e.code === 'ArrowLeft' || e.code === 'ArrowRight' ||
          e.code === 'ArrowUp' || e.code === 'ArrowDown') {
        e.preventDefault();
      }
      if (!e.repeat && (e.code === 'ArrowUp' || e.code === 'ArrowDown')) {
        gun.lastShootCode = e.code;
      }
      if (!e.repeat && (e.code === 'KeyE' || e.key.toLowerCase() === 'e')) {
        togglePlayerMode();
      }
    }

    function onKeyUp(e) {
      if (isTypingInUi(e.target)) return;
      setKeyPressed(e, false);
    }

    window.addEventListener('keydown', onKeyDown, true);
    window.addEventListener('keyup', onKeyUp, true);
    window.addEventListener('blur', clearHeldKeys);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) clearHeldKeys();
    });

    function shortestAngleDiff(from, to) {
      let diff = (to - from) % (Math.PI * 2);
      if (diff > Math.PI) diff -= Math.PI * 2;
      if (diff < -Math.PI) diff += Math.PI * 2;
      return diff;
    }

    function steerIntent(wantLeft, wantRight) {
      if (wantLeft === wantRight) return 0;
      return wantLeft ? -1 : 1;
    }

    // intent: -1 left, 0 none, +1 right. maxRate is this frame's full turn speed.
    // accel is the fraction of maxRate added per held frame (see STEER_FEEL).
    function accelerateSteer(currentRate, intent, maxRate, accel) {
      if (intent === 0 || maxRate <= 0) return 0;
      let rate = currentRate;
      if (rate !== 0 && Math.sign(rate) !== intent) rate = 0;
      const target = intent * maxRate;
      const step = Math.abs(target) * Math.max(0, accel);
      if (rate < target) return Math.min(target, rate + step);
      if (rate > target) return Math.max(target, rate - step);
      return rate;
    }

    function handleInput() {
      if (DEBUG_DRIVE && (player.mode === 'driving' || player.mode === 'biking' ||
          keys.w || keys.a || keys.s || keys.d)) {
        debugDrive('input-route', {
          branch: player.mode === 'walking'
            ? 'walking'
            : (player.mode === 'biking' ? 'biking' : 'driving-fallback')
        });
      }
      if (player.mode === 'walking') {
        handleWalkingInput();
      } else if (player.mode === 'biking') {
        handleBikingInput();
      } else {
        handleDrivingInput();
      }

      if ((player.mode === 'walking' || player.mode === 'biking') && !player.cameraEasing) {
        player.cameraAngle = player.angle;
      } else if (player.mode === 'driving') {
        const speedRatio = Math.min(player.motionSpeed / player.maxSpeed, 1);
        const catchUp = player.cameraEasing
          ? 0.1
          : (0.16 - speedRatio * 0.05) * (player.drifting ? 0.6 : 1);
        const angleDiff = shortestAngleDiff(player.cameraAngle, player.angle);
        player.cameraAngle += angleDiff * catchUp;

        if (player.cameraEasing) {
          if (Math.abs(angleDiff) < 0.012) {
            player.cameraAngle = player.angle;
            player.cameraEasing = false;
          }
        } else {
          const maxLag = (player.drifting ? 26 : 15) * Math.PI / 180;
          const lag = shortestAngleDiff(player.cameraAngle, player.angle);
          if (lag > maxLag) player.cameraAngle = player.angle - maxLag;
          else if (lag < -maxLag) player.cameraAngle = player.angle + maxLag;
        }
      }

      const speedRatio = Math.min(player.motionSpeed / Math.max(player.maxSpeed, BIKE.speed), 1);
      const targetSlope = 0.36 - speedRatio * 0.14;
      player.cameraSlope += (targetSlope - player.cameraSlope) * 0.06;
      player.cameraLookAhead += (speedRatio - player.cameraLookAhead) * 0.055;
      const targetRearPeek = getActiveShootCode() === 'ArrowDown' ? 1 : 0;
      const peekEase = targetRearPeek > player.cameraRearPeek ? 0.085 : 0.055;
      player.cameraRearPeek += (targetRearPeek - player.cameraRearPeek) * peekEase;
    }

    function handleDrivingInput() {
      if (!activeVehicle || activeVehicle.isBike) {
        debugDrive('drive-early-exit', {
          reason: !activeVehicle ? 'no-activeVehicle' : 'activeVehicle-is-bike',
          nextMode: activeVehicle && activeVehicle.isBike ? 'biking' : 'walking'
        });
        player.mode = activeVehicle && activeVehicle.isBike ? 'biking' : 'walking';
        player.drifting = false;
        player.steerRate = 0;
        return;
      }

      const crawl = 0.12;
      const spec = getCarSpec(activeVehicle);
      const damageMultiplier = carHealthSpeedMult(activeVehicle);
      const effectiveMaxSpeed = player.maxSpeed * damageMultiplier;
      const effectiveAccel = player.accel * damageMultiplier;
      const brakeForce = effectiveAccel * 1.8;
      const speedBefore = player.speed;

      if (keys['w']) {
        player.speed = Math.min(player.speed + effectiveAccel, effectiveMaxSpeed);
      } else if (keys['s']) {
        if (player.speed > crawl) {
          player.speed = Math.max(0, player.speed - brakeForce);
        } else if (player.speed > 0) {
          player.speed = 0;
        } else {
          player.speed = Math.max(player.speed - effectiveAccel, -effectiveMaxSpeed * 0.5);
        }
      } else {
        player.speed *= player.friction;
        if (Math.abs(player.speed) < crawl) player.speed = 0;
      }

      debugDrive('drive-frame', {
        carClass: activeVehicle.carClass,
        effectiveAccel,
        effectiveMaxSpeed,
        damageMultiplier,
        speedBefore,
        speedAfterKeys: player.speed,
        appliedW: !!keys.w,
        appliedS: !!keys.s
      });

      const absSpeed = Math.abs(player.speed);
      const speedRatio = Math.min(absSpeed / player.maxSpeed, 1);
      const intent = steerIntent(
        anyCodeHeld('KeyA', 'ArrowLeft'),
        anyCodeHeld('KeyD', 'ArrowRight')
      );
      const steering = intent !== 0;
      const moveSpeed = Math.hypot(player.vx, player.vy);
      const travelAngle = player.speed >= 0 ? player.angle : player.angle + Math.PI;
      const slipAngle = moveSpeed > crawl
        ? Math.abs(shortestAngleDiff(travelAngle, Math.atan2(player.vy, player.vx)))
        : 0;

      const wantDrift = player.speed > crawl && speedRatio >= spec.driftEnter && steering;
      player.drifting = wantDrift || (
        player.drifting &&
        player.speed > crawl &&
        speedRatio >= spec.driftHold &&
        (steering || slipAngle > 0.28)
      );
      if (absSpeed < crawl || speedRatio < 0.35) player.drifting = false;

      if (player.drifting) player.speed *= 0.985;

      if (absSpeed >= crawl) {
        let steerScale = 1.05 - 0.72 * speedRatio;
        if (player.drifting) steerScale += spec.driftSteer;
        const maxSteer = player.turnSpeed * Math.max(0.28, Math.min(1.2, steerScale));
        const reverseSteer = player.speed < 0 ? -1 : 1;
        const driveAccel = spec.steerAccel != null ? spec.steerAccel : STEER_FEEL.driveAccel;
        player.steerRate = accelerateSteer(player.steerRate, intent, maxSteer, driveAccel);
        player.angle += player.steerRate * reverseSteer;
      } else {
        player.steerRate = 0;
      }

      const headingX = Math.cos(player.angle);
      const headingY = Math.sin(player.angle);
      const targetVx = headingX * player.speed;
      const targetVy = headingY * player.speed;
      const grip = player.drifting ? spec.driftGrip : spec.grip + 0.5 * (1 - speedRatio);
      player.vx += (targetVx - player.vx) * grip;
      player.vy += (targetVy - player.vy) * grip;
      if (absSpeed < crawl) {
        player.vx = 0;
        player.vy = 0;
      }

      const slide = trySlideMove(
        player.x,
        player.y,
        player.vx,
        player.vy,
        player.driveRadius,
        canDriveAt
      );

      if (slide.moved) {
        player.x = slide.x;
        player.y = slide.y;
        if (slide.slid) {
          player.speed *= WALL_SCRAPE_FRICTION;
          if (!slide.usedX) player.vx = 0;
          if (!slide.usedY) player.vy = 0;
        }
      } else if (Math.hypot(player.vx, player.vy) > crawl) {
        // Head-on / no free axis — keep bounce + shake (only if we actually tried to move)
        if (DEBUG_DRIVE) {
          debugDrive('drive-blocked', {
            absSpeed,
            driveRadius: player.driveRadius,
            vx: player.vx,
            vy: player.vy
          });
        }
        if (absSpeed > 0.8) addCameraShake(SHAKE.minorWall);
        player.speed = -player.speed * 0.25;
        player.vx = headingX * player.speed;
        player.vy = headingY * player.speed;
        player.drifting = false;
      }
      player.motionSpeed = Math.hypot(player.vx, player.vy);

      const travelNow = player.speed >= 0 ? player.angle : player.angle + Math.PI;
      const skidSlip = player.motionSpeed > crawl
        ? Math.abs(shortestAngleDiff(travelNow, Math.atan2(player.vy, player.vx)))
        : 0;
      if (player.drifting && player.motionSpeed > crawl && skidSlip >= SKID_SLIP_MIN) {
        const sx = player.x - headingX * 12;
        const sy = player.y - headingY * 12;
        skidMarks.push({
          x: sx,
          y: sy,
          angle: player.angle,
          life: SKID_LIFE
        });
        if (skidMarks.length > SKID_MAX) skidMarks.splice(0, skidMarks.length - SKID_MAX);
        if (net.role === 'host' && (simulationTick % 2 === 0)) {
          netBroadcast({ t: 'fx_skid', x: netRound1(sx), y: netRound1(sy), a: netRound3(player.angle) });
        } else if (net.role === 'guest' && (net.frameCounter % 2 === 0)) {
          netSendToHost({ t: 'fx_skid', x: netRound1(sx), y: netRound1(sy), a: netRound3(player.angle) });
        }
      }

      activeVehicle.x = player.x;
      activeVehicle.y = player.y;
      activeVehicle.angle = player.angle;
      activeVehicle.dir = player.angle;
      activeVehicle.speed = player.speed;
    }

    function handleWalkingInput() {
      player.drifting = false;
      player.vx = 0;
      player.vy = 0;
      const intent = steerIntent(
        anyCodeHeld('ArrowLeft'),
        anyCodeHeld('ArrowRight')
      );
      player.steerRate = accelerateSteer(
        player.steerRate,
        intent,
        player.turnSpeed,
        STEER_FEEL.walkAccel
      );
      player.angle += player.steerRate;

      let forward = 0;
      let right = 0;
      player.motionSpeed = 0;
      if (keys['w']) forward = player.walkSpeed;
      if (keys['s']) forward = -player.walkSpeed * 0.7;
      if (keys['d']) right = player.walkSpeed;
      if (keys['a']) right = -player.walkSpeed;

      const moveMag = Math.hypot(forward, right);
      if (moveMag > player.walkSpeed) {
        const scale = player.walkSpeed / moveMag;
        forward *= scale;
        right *= scale;
      }

      if (forward !== 0 || right !== 0) {
        const dx = Math.cos(player.angle) * forward - Math.sin(player.angle) * right;
        const dy = Math.sin(player.angle) * forward + Math.cos(player.angle) * right;
        const slide = trySlideMove(player.x, player.y, dx, dy, player.radius, canWalkAt);

        if (slide.moved) {
          player.x = slide.x;
          player.y = slide.y;
          const movement = Math.hypot(
            slide.usedX ? dx : 0,
            slide.usedY ? dy : 0
          );
          player.walkPhase += movement * 0.22;
          player.motionSpeed = movement;
        }
      }
      player.speed = 0;
    }

    function handleBikingInput() {
      if (!activeVehicle || !activeVehicle.isBike) {
        player.mode = 'walking';
        player.steerRate = 0;
        return;
      }

      player.drifting = false;
      const intent = steerIntent(
        anyCodeHeld('ArrowLeft'),
        anyCodeHeld('ArrowRight')
      );
      player.steerRate = accelerateSteer(
        player.steerRate,
        intent,
        player.turnSpeed,
        STEER_FEEL.walkAccel
      );
      player.angle += player.steerRate;

      let forward = 0;
      let right = 0;
      player.motionSpeed = 0;
      if (keys['w']) forward = BIKE.speed;
      if (keys['s']) forward = -BIKE.speed * 0.7;
      if (keys['d']) right = BIKE.speed;
      if (keys['a']) right = -BIKE.speed;

      const moveMag = Math.hypot(forward, right);
      if (moveMag > BIKE.speed) {
        const scale = BIKE.speed / moveMag;
        forward *= scale;
        right *= scale;
      }

      if (forward !== 0 || right !== 0) {
        const dx = Math.cos(player.angle) * forward - Math.sin(player.angle) * right;
        const dy = Math.sin(player.angle) * forward + Math.cos(player.angle) * right;
        const slide = trySlideMove(player.x, player.y, dx, dy, BIKE.radius, canDriveAt);
        if (slide.moved) {
          player.x = slide.x;
          player.y = slide.y;
          player.motionSpeed = Math.hypot(
            slide.usedX ? dx : 0,
            slide.usedY ? dy : 0
          );
        }
      }

      player.speed = player.motionSpeed;
      player.vx = 0;
      player.vy = 0;
      activeVehicle.x = player.x;
      activeVehicle.y = player.y;
      activeVehicle.angle = player.angle;
      activeVehicle.speed = player.motionSpeed;
    }

    function clearBikeSlot(bike) {
      if (!bike || !bike.isBike || bike.bayId == null) return;
      const bay = bikeBays.find(b => b.id === bike.bayId);
      if (!bay) return;
      const slot = bay.slots[bike.slotIndex];
      if (slot && slot.bikeId === bike.id) slot.bikeId = null;
      bike.bayId = null;
      bike.slotIndex = null;
    }

    function tryParkBikeInNearbyBay(bike) {
      clearBikeSlot(bike);
      let best = null;
      bikeBays.forEach(bay => {
        const dist = Math.hypot(bike.x - bay.cx, bike.y - bay.cy);
        if (dist > BIKE.baySnapDist) return;
        const freeIndex = bay.slots.findIndex(slot => !slot.bikeId);
        if (freeIndex < 0) return;
        if (!best || dist < best.dist) {
          best = { bay, freeIndex, dist };
        }
      });
      if (!best) {
        bike.parked = false;
        return false;
      }
      const slot = best.bay.slots[best.freeIndex];
      bike.x = slot.x;
      bike.y = slot.y;
      bike.angle = slot.angle;
      bike.parked = true;
      bike.speed = 0;
      bike.bayId = best.bay.id;
      bike.slotIndex = best.freeIndex;
      slot.bikeId = bike.id;
      return true;
    }



    function togglePlayerMode() {
      if (wasted) return;
      if (player.mode === 'walking') {
        const nearestVehicle = vehicles
          .map(vehicle => ({
            vehicle,
            distance: Math.hypot(player.x - vehicle.x, player.y - vehicle.y)
          }))
          .filter(candidate => {
            if (isVehicleOccupiedByOther(candidate.vehicle)) return false;
            const maxDist = candidate.vehicle.isBike ? BIKE.enterDist : 55;
            return candidate.distance <= maxDist;
          })
          .sort((a, b) => a.distance - b.distance)[0];
        if (!nearestVehicle) return;

        const hijacked = nearestVehicle.vehicle;
        if (net.role === 'guest') {
          netSendToHost({ t: 'req_enter', vehicleId: hijacked.id });
          return;
        }
        if (hijacked.isBike) {
          clearBikeSlot(hijacked);
          activeVehicle = hijacked;
          activeVehicle.ai = false;
          activeVehicle.parked = false;
          activeVehicle.driverId = net.localId;
          player.mode = 'biking';
          player.x = activeVehicle.x;
          player.y = activeVehicle.y;
          // Keep walk facing / camera — do not snap to bike heading
          player.cameraEasing = false;
          player.cameraAngle = player.angle;
          player.steerRate = 0;
          player.speed = 0;
          player.vx = 0;
          player.vy = 0;
          player.drifting = false;
          activeVehicle.angle = player.angle;
          debugDrive('enter-bike', { dist: nearestVehicle.distance });
          return;
        }

        if (!hijacked.isPoliceCar && !hijacked.parked && Math.abs(hijacked.speed) > 0.35) {
          spawnFleeingDriver(hijacked);
        }

        activeVehicle = hijacked;
        activeVehicle.ai = false;
        activeVehicle.parked = false;
        activeVehicle.driverId = net.localId;
        if (activeVehicle.isPoliceCar) addWanted(1);
        toughenPlayerCar(activeVehicle);
        applyDriveStatsFromCar(activeVehicle);
        player.mode = 'driving';
        player.x = activeVehicle.x;
        player.y = activeVehicle.y;
        player.angle = activeVehicle.angle;
        player.cameraEasing = true;
        player.steerRate = 0;
        player.speed = activeVehicle.speed;
        player.vx = Math.cos(player.angle) * player.speed;
        player.vy = Math.sin(player.angle) * player.speed;
        player.drifting = false;
        debugDrive('enter-car', {
          dist: nearestVehicle.distance,
          carClass: activeVehicle.carClass,
          id: activeVehicle.id
        });
      } else if (player.mode === 'biking') {
        if (!activeVehicle || !activeVehicle.isBike) return;
        const bike = activeVehicle;
        bike.x = player.x;
        bike.y = player.y;
        bike.angle = player.angle;
        bike.speed = 0;
        bike.driverId = null;
        tryParkBikeInNearbyBay(bike);
        player.mode = 'walking';
        player.speed = 0;
        player.vx = 0;
        player.vy = 0;
        player.drifting = false;
        player.motionSpeed = 0;
        player.cameraEasing = false;
        player.cameraAngle = player.angle;
        player.steerRate = 0;
        activeVehicle = null;
        if (net.role === 'guest') {
          netSendToHost({
            t: 'exit_vehicle',
            vehicleId: bike.id,
            x: bike.x,
            y: bike.y,
            angle: bike.angle,
            isBike: true
          });
        }
        debugDrive('exit-bike');
      } else {
        if (!activeVehicle) return;
        const exitPosition = findCarExitPosition(activeVehicle, true);
        if (!exitPosition) return;
        const exiting = activeVehicle;
        player.mode = 'walking';
        player.x = exitPosition.x;
        player.y = exitPosition.y;
        player.speed = 0;
        player.vx = 0;
        player.vy = 0;
        player.drifting = false;
        player.motionSpeed = 0;
        player.cameraEasing = false;
        player.cameraAngle = player.angle;
        player.steerRate = 0;
        exiting.speed = 0;
        exiting.driverId = null;
        exiting.parked = isInParkingBay(exiting.x, exiting.y);
        activeVehicle = null;
        restoreWalkDriveStats();
        if (net.role === 'guest') {
          netSendToHost({
            t: 'exit_vehicle',
            vehicleId: exiting.id,
            x: exiting.x,
            y: exiting.y,
            angle: exiting.angle,
            isBike: false
          });
        }
        debugDrive('exit-car');
      }
    }

    function getCarSpec(vehicleOrClass) {
      const id = typeof vehicleOrClass === 'string'
        ? vehicleOrClass
        : (vehicleOrClass && vehicleOrClass.carClass);
      return CAR_CLASSES[id] || CAR_CLASSES.normal;
    }

    function pickCarClass() {
      const roll = Math.random();
      if (roll < 0.5) return 'normal';
      return roll < 0.75 ? 'van' : 'sports';
    }

    function pickCarColor(classId) {
      const whites = ['#f2f0ea', '#ebe8e1', '#e4e1d9', '#f7f5f0', '#ddd9d1'];
      return whites[Math.floor(Math.random() * whites.length)];
    }

    function assignCarClass(vehicle, classId, playerOwned) {
      const spec = getCarSpec(classId);
      vehicle.carClass = classId;
      vehicle.radius = spec.radius;
      vehicle.maxSpeed = spec.maxSpeed;
      vehicle.accel = spec.accel;
      vehicle.driveRadius = spec.driveRadius;
      vehicle.maxHealth = playerOwned ? spec.playerHealth : spec.npcHealth;
      vehicle.health = vehicle.maxHealth;
      return vehicle;
    }

    function applyDriveStatsFromCar(vehicle) {
      const spec = getCarSpec(vehicle);
      player.maxSpeed = spec.maxSpeed;
      player.accel = spec.accel;
      player.driveRadius = spec.driveRadius;
    }

    function restoreWalkDriveStats() {
      player.maxSpeed = PLAYER_WALK_DRIVE.maxSpeed;
      player.accel = PLAYER_WALK_DRIVE.accel;
      player.driveRadius = PLAYER_WALK_DRIVE.driveRadius;
    }

    function carHealthSpeedMult(vehicle) {
      if (!vehicle || !vehicle.maxHealth) return 1;
      const ratio = Math.max(0, vehicle.health / vehicle.maxHealth);
      return 0.72 + 0.28 * ratio;
    }

    function toughenPlayerCar(vehicle) {
      const spec = getCarSpec(vehicle);
      if (vehicle.maxHealth >= spec.playerHealth) return;
      const ratio = vehicle.maxHealth > 0 ? vehicle.health / vehicle.maxHealth : 1;
      vehicle.maxHealth = spec.playerHealth;
      vehicle.health = Math.max(1, Math.round(ratio * spec.playerHealth));
    }

    function findCarExitPosition(vehicle, requireWalkable) {
      const reach = (vehicle.radius || 13) + 9;
      const angles = [
        vehicle.angle + Math.PI / 2,
        vehicle.angle - Math.PI / 2,
        vehicle.angle + Math.PI
      ];
      const exitPosition = angles
        .map(angle => ({
          x: vehicle.x + Math.cos(angle) * reach,
          y: vehicle.y + Math.sin(angle) * reach
        }))
        .find(position => canWalkAt(position.x, position.y, player.radius));
      if (exitPosition) return exitPosition;
      if (requireWalkable) return null;
      return {
        x: vehicle.x + Math.cos(vehicle.angle + Math.PI / 2) * reach,
        y: vehicle.y + Math.sin(vehicle.angle + Math.PI / 2) * reach
      };
    }

    function putPlayerOnFoot(x, y) {
      player.mode = 'walking';
      player.x = x;
      player.y = y;
      player.speed = 0;
      player.vx = 0;
      player.vy = 0;
      player.drifting = false;
      player.motionSpeed = 0;
      player.cameraEasing = false;
      player.cameraAngle = player.angle;
      player.steerRate = 0;
    }

    function ejectPlayerFromCar(vehicle) {
      const spot = findCarExitPosition(vehicle, false);
      if (vehicle && vehicle.driverId === net.localId) vehicle.driverId = null;
      activeVehicle = null;
      restoreWalkDriveStats();
      putPlayerOnFoot(spot.x, spot.y);
    }

    function hurtPlayer(amount, kind) {
      if (wasted || amount <= 0) return;
      if (kind === 'car' && player.hitCooldown > 0) return;
      if (kind === 'blast' && player.blastCooldown > 0) return;
      if (kind === 'gun' && player.gunHitCooldown > 0) return;
      player.hp = Math.max(0, player.hp - amount);
      if (kind === 'car') player.hitCooldown = 42;
      if (kind === 'blast') player.blastCooldown = 18;
      if (kind === 'gun') {
        player.gunHitCooldown = 10;
        addCameraShake(SHAKE.tinyGunHit);
      }
      if (player.hp <= 0) triggerWasted();
    }

    function pickSafePlayerSpawn() {
      const baseX = START_BLOCK * TILE_SIZE + TILE_SIZE / 2;
      const baseY = START_BLOCK * TILE_SIZE - 12;
      for (let attempt = 0; attempt < 40; attempt++) {
        const radius = attempt < 10 ? 24 + attempt * 18 : 60 + Math.random() * 260;
        const ang = Math.random() * Math.PI * 2;
        const x = baseX + Math.cos(ang) * radius;
        const y = baseY + Math.sin(ang) * radius;
