        if (isOnPlayableMap(x, y) && canWalkAt(x, y, player.radius + 2)) {
          return { x, y, angle: 34 * (Math.PI / 180) };
        }
      }
      if (pedestrianTiles.length) {
        for (let attempt = 0; attempt < 25; attempt++) {
          const tile = pedestrianTiles[Math.floor(Math.random() * pedestrianTiles.length)];
          const x = (tile.c + 0.5) * TILE_SIZE;
          const y = (tile.r + 0.5) * TILE_SIZE;
          if (canWalkAt(x, y, player.radius + 2)) {
            return { x, y, angle: 0 };
          }
        }
      }
      return { x: baseX, y: baseY, angle: 34 * (Math.PI / 180) };
    }

    function respawnLocalPlayer() {
      net.respawnTimeout = null;
      const spot = pickSafePlayerSpawn();
      wasted = false;
      player.hp = PLAYER_MAX_HP;
      player.hitCooldown = 30;
      player.blastCooldown = 30;
      player.gunHitCooldown = 20;
      gun.ammo = COMBAT.magSize;
      gun.reloadTimer = 0;
      gun.reloadMax = 0;
      gun.fireCooldown = 0;
      activeVehicle = null;
      restoreWalkDriveStats();
      player.angle = spot.angle;
      putPlayerOnFoot(spot.x, spot.y);
      setWantedLevel(0);
      wantedCoolTimer = 0;
      document.getElementById('wasted-overlay').style.display = 'none';
      if (net.role === 'guest') {
        netSendToHost({ t: 'respawn', x: spot.x, y: spot.y, angle: spot.angle });
      }
    }

    function triggerWasted() {
      if (wasted) return;
      wasted = true;
      player.hp = 0;
      if (net.role !== 'solo' && activeVehicle) {
        const drop = activeVehicle;
        drop.driverId = null;
        drop.speed = 0;
        if (drop.isBike) tryParkBikeInNearbyBay(drop);
        else drop.parked = isInParkingBay(drop.x, drop.y);
        activeVehicle = null;
        restoreWalkDriveStats();
        player.mode = 'walking';
        if (net.role === 'guest') {
          netSendToHost({
            t: 'exit_vehicle',
            vehicleId: drop.id,
            x: drop.x,
            y: drop.y,
            angle: drop.angle,
            isBike: !!drop.isBike
          });
        }
      }
      document.getElementById('wasted-overlay').style.display = 'flex';
      if (net.role === 'solo') {
        setTimeout(() => location.reload(), 2600);
      } else {
        if (net.respawnTimeout) clearTimeout(net.respawnTimeout);
        net.respawnTimeout = setTimeout(respawnLocalPlayer, 2600);
      }
    }

    function addWanted(amount) {
      if (amount <= 0) return;
      const next = Math.min(WANTED.maxStars, wantedLevel + amount);
      if (next === wantedLevel) return;
      wantedLevel = next;
      wantedCoolTimer = 0;
      updateWantedStarsUi();
    }

    function addWantedForPlayer(playerId, amount) {
      if (amount <= 0) return;
      if (!playerId || playerId === 'local' || playerId === net.localId) {
        addWanted(amount);
        return;
      }
      if (net.role !== 'host') return;
      const rp = net.players.get(playerId);
      if (!rp || rp.wasted) return;
      const next = Math.min(WANTED.maxStars, (rp.wantedLevel || 0) + amount);
      if (next === rp.wantedLevel) return;
      rp.wantedLevel = next;
      rp.wantedCoolTimer = 0;
      netSendToPeer(playerId, { t: 'wanted', level: rp.wantedLevel });
      if (typeof renderMpPlayersList === 'function') renderMpPlayersList();
    }

    function getWantedTargets() {
      const targets = [];
      if (!wasted && wantedLevel > 0) {
        targets.push({
          id: net.localId,
          x: player.x,
          y: player.y,
          mode: player.mode,
          vehicleId: activeVehicle ? activeVehicle.id : null,
          wantedLevel,
          isLocal: true
        });
      }
      if (net.role === 'host') {
        net.players.forEach(rp => {
          if (!rp.wasted && rp.wantedLevel > 0) {
            targets.push({
              id: rp.id,
              x: rp.x,
              y: rp.y,
              mode: rp.mode,
              vehicleId: rp.vehicleId,
              wantedLevel: rp.wantedLevel,
              isLocal: false,
              rp
            });
          }
        });
      }
      return targets;
    }

    function getNearestWantedTarget(x, y) {
      const targets = getWantedTargets();
      let best = null;
      let bestDist = Infinity;
      for (let i = 0; i < targets.length; i++) {
        const d = Math.hypot(targets[i].x - x, targets[i].y - y);
        if (d < bestDist) {
          bestDist = d;
          best = targets[i];
        }
      }
      return best;
    }

    function getMaxWantedLevel() {
      let max = wasted ? 0 : wantedLevel;
      if (net.role === 'host') {
        net.players.forEach(rp => {
          if (!rp.wasted && rp.wantedLevel > max) max = rp.wantedLevel;
        });
      }
      return max;
    }

    function setWantedLevel(level) {
      wantedLevel = Math.max(0, Math.min(WANTED.maxStars, level));
      updateWantedStarsUi();
    }

    function updateWantedStarsUi() {
      document.querySelectorAll('#wanted-stars .star').forEach(star => {
        const index = Number(star.dataset.star);
        star.classList.toggle('lit', index <= wantedLevel);
      });
      if (net.role !== 'solo' && typeof renderMpPlayersList === 'function') {
        renderMpPlayersList();
      }
    }

    function isOnPlayableMap(x, y) {
      return x >= 0 && y >= 0 &&
        x < MAP_SIZE * TILE_SIZE &&
        y < MAP_SIZE * TILE_SIZE;
    }

    function policeIsNearbyAt(cop, x, y) {
      if (!cop || !cop.isPolice) return false;
      if (!isOnPlayableMap(cop.x, cop.y)) return false;
      return Math.hypot(cop.x - x, cop.y - y) <= WANTED.nearDist;
    }

    function policeIsNearby(cop) {
      return policeIsNearbyAt(cop, player.x, player.y);
    }

    function anyNearbyPoliceAt(x, y, excludeVehicleId) {
      for (let i = 0; i < pedestrians.length; i++) {
        if (policeIsNearbyAt(pedestrians[i], x, y)) return true;
      }
      for (let i = 0; i < vehicles.length; i++) {
        const car = vehicles[i];
        if (!car.isPoliceCar || (excludeVehicleId && car.id === excludeVehicleId)) continue;
        if (!isOnPlayableMap(car.x, car.y)) continue;
        if (Math.hypot(car.x - x, car.y - y) <= WANTED.nearDist) return true;
      }
      return false;
    }

    function anyNearbyPolice() {
      return anyNearbyPoliceAt(player.x, player.y, activeVehicle && activeVehicle.id);
    }

    function countPoliceCars() {
      let n = 0;
      for (let i = 0; i < vehicles.length; i++) {
        if (vehicles[i].isPoliceCar) n++;
      }
      return n;
    }

    function targetPoliceCarCount() {
      return getMaxWantedLevel() >= WANTED.policeCarsHighAt
        ? WANTED.policeCarsHigh
        : WANTED.policeCarsBase;
    }

    function updatePoliceCarHuntState() {
      const wasHunting = policeCarsHunting;
      const maxWanted = getMaxWantedLevel();
      if (maxWanted >= WANTED.policeChaseFrom && getWantedTargets().length > 0) policeCarsHunting = true;
      if (maxWanted <= 0 || getWantedTargets().length === 0) policeCarsHunting = false;
      if (wasHunting && !policeCarsHunting) {
        vehicles.forEach(vehicle => {
          if (vehicle.isPoliceCar && vehicle.ai) snapPoliceCarToRoam(vehicle);
        });
      }
    }

    function maintainPoliceCars() {
      const target = targetPoliceCarCount();
      let count = countPoliceCars();
      while (count < target) {
        const car = createPoliceCar();
        if (!car) break;
        vehicles.push(car);
        count++;
      }
      if (count <= target) return;
      const extras = vehicles
        .filter(v => v.isPoliceCar && v !== activeVehicle && !v.driverId)
        .sort((a, b) =>
          Math.hypot(b.x - player.x, b.y - player.y) -
          Math.hypot(a.x - player.x, a.y - player.y)
        );
      while (count > target && extras.length) {
        const drop = extras.shift();
        const idx = vehicles.indexOf(drop);
        if (idx !== -1) {
          vehicles.splice(idx, 1);
          count--;
        }
      }
    }

    function snapPoliceCarToRoam(vehicle) {
      const angle = vehicle.angle;
      const dirIndex = ((Math.round(angle / (Math.PI / 2)) % 4) + 4) % 4;
      vehicle.dirIndex = dirIndex;
      vehicle.dir = dirIndex * (Math.PI / 2);
      vehicle.angle = vehicle.dir;
      vehicle.axis = dirIndex % 2 === 0 ? 'horizontal' : 'vertical';
      const tile = vehicle.axis === 'horizontal'
        ? Math.floor(vehicle.y / TILE_SIZE)
        : Math.floor(vehicle.x / TILE_SIZE);
      vehicle.roadBase = Math.floor(tile / ROAD_SPACING) * ROAD_SPACING;
      vehicle.turn = null;
      vehicle.turnIntent = null;
      vehicle.baseSpeed = WANTED.policeRoamSpeed;
      vehicle.speed = Math.min(vehicle.speed, WANTED.policeRoamSpeed);
      const lane = getLeftLaneCenter(vehicle.roadBase, vehicle.dirIndex);
      if (vehicle.axis === 'horizontal') vehicle.y = lane;
      else vehicle.x = lane;
    }

    function updatePoliceCarChase(vehicle) {
      const target = getNearestWantedTarget(vehicle.x, vehicle.y);
      if (!target) {
        snapPoliceCarToRoam(vehicle);
        return;
      }
      const dx = target.x - vehicle.x;
      const dy = target.y - vehicle.y;
      const dist = Math.hypot(dx, dy);
      const desired = Math.atan2(dy, dx);
      let angleDiff = desired - vehicle.angle;
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      const turnRate = dist < 90 ? 0.08 : 0.05;
      vehicle.angle += Math.max(-turnRate, Math.min(turnRate, angleDiff));
      vehicle.dir = vehicle.angle;

      const damageMultiplier = carHealthSpeedMult(vehicle);
      const targetSpeed = WANTED.policeChaseSpeed * damageMultiplier;
      vehicle.speed += (targetSpeed - vehicle.speed) * 0.08;
      if (dist < 55) vehicle.speed = Math.min(vehicle.speed, targetSpeed);

      const nx = vehicle.x + Math.cos(vehicle.angle) * vehicle.speed;
      const ny = vehicle.y + Math.sin(vehicle.angle) * vehicle.speed;
      const radius = vehicle.driveRadius || vehicle.radius;
      if (canDriveAt(nx, ny, radius)) {
        vehicle.x = nx;
        vehicle.y = ny;
      } else {
        const left = vehicle.angle - 0.55;
        const right = vehicle.angle + 0.55;
        const lx = vehicle.x + Math.cos(left) * vehicle.speed * 0.7;
        const ly = vehicle.y + Math.sin(left) * vehicle.speed * 0.7;
        const rx = vehicle.x + Math.cos(right) * vehicle.speed * 0.7;
        const ry = vehicle.y + Math.sin(right) * vehicle.speed * 0.7;
        if (canDriveAt(lx, ly, radius)) {
          vehicle.angle = left;
          vehicle.x = lx;
          vehicle.y = ly;
        } else if (canDriveAt(rx, ry, radius)) {
          vehicle.angle = right;
          vehicle.x = rx;
          vehicle.y = ry;
        } else {
          vehicle.angle += Math.PI * 0.5;
          vehicle.speed *= 0.35;
        }
        vehicle.dir = vehicle.angle;
      }
    }

    function countPolice() {
      let n = 0;
      for (let i = 0; i < pedestrians.length; i++) {
        if (pedestrians[i].isPolice) n++;
      }
      return n;
    }

    function maxPoliceForWanted() {
      return WANTED.maxByStars[getMaxWantedLevel()] || 0;
    }

    function bulletHitsSolid(x, y) {
      const c = Math.floor(x / TILE_SIZE);
      const r = Math.floor(y / TILE_SIZE);
      if (r < 0 || c < 0 || r >= MAP_SIZE || c >= MAP_SIZE) return true;
      const type = map[r][c];
      return type >= 2 && type <= 4;
    }

    function spawnMuzzleFlash(x, y, angle) {
      muzzleFlashes.push({
        x, y, angle,
        life: COMBAT.muzzleLife,
        maxLife: COMBAT.muzzleLife
      });
    }

    function fireBullet(owner, x, y, angle, speed, shooterId = net.localId) {
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;
      bullets.push({
        owner,
        shooterId: owner === 'player' ? shooterId : null,
        x: x + Math.cos(angle) * 10,
        y: y + Math.sin(angle) * 10,
        vx,
        vy,
        life: owner === 'player' ? COMBAT.playerBulletLife : COMBAT.bulletLife,
        radius: COMBAT.bulletRadius
      });
      let isDrivingShooter = player.mode === 'driving';
      if (owner === 'player' && shooterId && shooterId !== net.localId) {
        const rp = net.players.get(shooterId);
        isDrivingShooter = !!(rp && rp.mode === 'driving');
      }
      const muzzleDist = owner === 'player'
        ? (isDrivingShooter ? 24 : 16)
        : 12;
      const mx = x + Math.cos(angle) * muzzleDist;
      const my = y + Math.sin(angle) * muzzleDist;
      spawnMuzzleFlash(mx, my, angle);
      if (net.role === 'host') {
        const excludeId = owner === 'player' && shooterId !== net.localId ? shooterId : null;
        netBroadcast({ t: 'fx_muzzle', x: mx, y: my, angle }, excludeId);
      }
    }

    function startReload() {
      gun.reloadMax = COMBAT.reloadFrames;
      gun.reloadTimer = COMBAT.reloadFrames;
    }

    function tryPlayerShoot() {
      if (wasted) return;
      if (gun.reloadTimer > 0) {
        gun.reloadTimer--;
        if (gun.reloadTimer === 0) {
          gun.ammo = COMBAT.magSize;
          gun.reloadMax = 0;
        }
        return;
      }
      if (gun.fireCooldown > 0) gun.fireCooldown--;
      const shootCode = getActiveShootCode();
      if (!shootCode) return;
      if (gun.fireCooldown > 0) return;
      if (gun.ammo <= 0) {
        startReload();
        return;
      }
      const shootAngle = shootCode === 'ArrowDown' ? player.angle + Math.PI : player.angle;
      if (net.role === 'guest') {
        const muzzleDist = player.mode === 'driving' ? 24 : 16;
        spawnMuzzleFlash(
          player.x + Math.cos(shootAngle) * muzzleDist,
          player.y + Math.sin(shootAngle) * muzzleDist,
          shootAngle
        );
        netSendToHost({ t: 'shoot', x: player.x, y: player.y, angle: shootAngle });
      } else {
        fireBullet('player', player.x, player.y, shootAngle, COMBAT.bulletSpeed, net.localId);
      }
      addCameraShake(SHAKE.minorFire);
      gun.ammo--;
      gun.fireCooldown = COMBAT.fireInterval;
      if (gun.ammo <= 0) startReload();
    }

    function makePedFleeFrom(x, y, ped) {
      if (!ped || ped.isPolice) return;
      ped.fleeing = true;
      ped.fleeTimer = 160 + Math.floor(Math.random() * 80);
      ped.speed = 1.35 + Math.random() * 0.35;
      ped.angle = Math.atan2(ped.y - y, ped.x - x) + (Math.random() - 0.5) * 0.5;
      ped.idleTimer = 0;
    }

    function fleePedsNearShot(x, y) {
      pedestrians.forEach(ped => {
        if (ped.isPolice) return;
        if (Math.hypot(ped.x - x, ped.y - y) <= COMBAT.fleeRadius) {
          makePedFleeFrom(x, y, ped);
        }
      });
    }

    function killPedestrian(ped, byPlayer) {
      if (!ped) return;
      const idx = pedestrians.indexOf(ped);
      if (idx === -1) return;
      pedestrians.splice(idx, 1);
      if (!byPlayer) return;
      addWantedForPlayer(typeof byPlayer === 'string' ? byPlayer : net.localId, 1);
    }

    function damagePedestrian(ped, amount, byPlayer) {
      if (!ped) return;
      ped.health = (ped.health != null ? ped.health : 1) - amount;
      if (byPlayer) {
        let fx = player.x;
        let fy = player.y;
        if (typeof byPlayer === 'string' && byPlayer !== net.localId) {
          const rp = net.players.get(byPlayer);
          if (rp) { fx = rp.x; fy = rp.y; }
        }
        makePedFleeFrom(fx, fy, ped);
      }
      if (ped.health <= 0) killPedestrian(ped, byPlayer);
    }

    const RUNOVER_MIN_SPEED = 1.15;

    function vehicleRunoverSpeed(vehicle) {
      if (vehicle === activeVehicle) {
        return Math.max(player.motionSpeed, Math.abs(player.speed));
      }
      if (net.role === 'host' && vehicle.driverId && vehicle.driverId !== net.localId) {
        const rp = net.players.get(vehicle.driverId);
        if (rp) return Math.max(rp.motionSpeed || 0, Math.abs(rp.speed || 0));
      }
      return Math.abs(vehicle.speed);
    }

    function handleVehiclePedHits() {
      for (let v = 0; v < vehicles.length; v++) {
        const vehicle = vehicles[v];
        if (!vehicle || vehicle.dead) continue;
        const speed = vehicleRunoverSpeed(vehicle);
        if (speed < RUNOVER_MIN_SPEED) continue;
        const hitRadius = (vehicle.radius || 13) * 0.85;
        const driverId = vehicle === activeVehicle
          ? net.localId
          : (vehicle.driverId || null);
        for (let p = pedestrians.length - 1; p >= 0; p--) {
          const ped = pedestrians[p];
          if (Math.hypot(ped.x - vehicle.x, ped.y - vehicle.y) <= hitRadius + ped.radius) {
            killPedestrian(ped, driverId || false);
            if (driverId === net.localId) addCameraShake(SHAKE.mediumRunover);
            else if (driverId && net.role === 'host') {
              netSendToPeer(driverId, { t: 'shake', amount: SHAKE.mediumRunover });
            }
          }
        }
      }
    }

    function hurtGuestPlayer(rp, amount, kind, attackerId, shoveX, shoveY) {
      if (!rp || rp.wasted || amount <= 0) return;
      if (kind === 'car' && rp.hitCooldown > 0) return;
      if (kind === 'blast' && rp.blastCooldown > 0) return;
      if (kind === 'gun' && rp.gunHitCooldown > 0) return;
      rp.hp = Math.max(0, rp.hp - amount);
      if (kind === 'car') rp.hitCooldown = 42;
      if (kind === 'blast') rp.blastCooldown = 18;
      if (kind === 'gun') rp.gunHitCooldown = 10;
      const msg = { t: 'hit', amount, kind, hp: rp.hp };
      if (shoveX != null && shoveY != null) {
        msg.shoveX = shoveX;
        msg.shoveY = shoveY;
      }
      netSendToPeer(rp.id, msg);
      if (rp.hp <= 0) {
        rp.wasted = true;
        rp.wantedLevel = 0;
        rp.wantedCoolTimer = 0;
        if (rp.vehicleId) {
          const v = vehicles.find(item => item.id === rp.vehicleId);
          if (v && v.driverId === rp.id) {
            v.driverId = null;
            v.speed = 0;
            if (v.isBike) tryParkBikeInNearbyBay(v);
            else v.parked = isInParkingBay(v.x, v.y);
          }
          rp.vehicleId = null;
          rp.mode = 'walking';
        }
        if (attackerId && attackerId !== rp.id) {
          addWantedForPlayer(attackerId, 1);
        }
      }
    }

    function ejectGuestFromCar(rp, vehicle) {
      if (!rp) return;
      const spot = findCarExitPosition(vehicle, false);
      if (vehicle && vehicle.driverId === rp.id) vehicle.driverId = null;
      rp.vehicleId = null;
      rp.mode = 'walking';
      rp.x = spot.x;
      rp.y = spot.y;
      rp.speed = 0;
      rp.vx = 0;
      rp.vy = 0;
      netSendToPeer(rp.id, { t: 'eject', vehicleId: vehicle.id, x: spot.x, y: spot.y });
    }

    function damageVehicleFromBullet(vehicle, amount, byPlayer) {
      if (!vehicle || vehicle.dead) return;
      const attackerId = typeof byPlayer === 'string'
        ? byPlayer
        : (byPlayer ? net.localId : null);
      if (vehicle.isBike) {
        if (vehicle === activeVehicle) {
          const dmg = attackerId ? COMBAT.playerGunDamage : COMBAT.policeGunDamagePed;
          const wasAlive = !wasted;
          hurtPlayer(dmg, 'gun');
          if (wasAlive && wasted && attackerId && attackerId !== net.localId) {
            addWantedForPlayer(attackerId, 1);
          }
        } else if (net.role === 'host' && vehicle.driverId && net.players.has(vehicle.driverId)) {
          const rp = net.players.get(vehicle.driverId);
          const dmg = attackerId ? COMBAT.playerGunDamage : COMBAT.policeGunDamagePed;
          hurtGuestPlayer(rp, dmg, 'gun', attackerId);
        }
        return;
      }
      vehicle.health = Math.max(0, vehicle.health - amount);
      if (vehicle === activeVehicle) {
        addCameraShake(SHAKE.tinyGunHit);
      } else if (net.role === 'host' && vehicle.driverId && vehicle.driverId !== net.localId) {
        netSendToPeer(vehicle.driverId, { t: 'shake', amount: SHAKE.tinyGunHit });
      }
      if (vehicle.health > 0) return;
      runExplosions([vehicle], byPlayer);
    }

    function updateWanted() {
      if (wantedLevel > 0) {
        if (anyNearbyPolice()) {
          wantedCoolTimer = 0;
        } else {
          wantedCoolTimer++;
          if (wantedCoolTimer >= WANTED.coolFrames) {
            wantedCoolTimer = 0;
            setWantedLevel(wantedLevel - 1);
          }
        }
      } else {
        wantedCoolTimer = 0;
      }

      if (net.role === 'host') {
        net.players.forEach(rp => {
          if (rp.wasted || !rp.wantedLevel || rp.wantedLevel <= 0) {
            rp.wantedCoolTimer = 0;
            return;
          }
          if (anyNearbyPoliceAt(rp.x, rp.y, rp.vehicleId)) {
            rp.wantedCoolTimer = 0;
            return;
          }
          rp.wantedCoolTimer = (rp.wantedCoolTimer || 0) + 1;
          if (rp.wantedCoolTimer >= WANTED.coolFrames) {
            rp.wantedCoolTimer = 0;
            rp.wantedLevel = Math.max(0, rp.wantedLevel - 1);
            netSendToPeer(rp.id, { t: 'wanted', level: rp.wantedLevel });
          }
        });
      }
    }

    function pickPoliceSpawnPoint(anchor) {
      const origin = anchor || player;
      const attempts = 40;
      for (let i = 0; i < attempts; i++) {
        const ang = Math.random() * Math.PI * 2;
        const dist = WANTED.spawnMinDist +
          Math.random() * (WANTED.spawnMaxDist - WANTED.spawnMinDist);
        const x = origin.x + Math.cos(ang) * dist;
        const y = origin.y + Math.sin(ang) * dist;
        if (!isOnPlayableMap(x, y)) continue;
        if (!canWalkAt(x, y, 3)) continue;
        if (Math.hypot(x - origin.x, y - origin.y) < WANTED.spawnMinDist * 0.9) continue;
        return { x, y };
      }
      return null;
    }

    function spawnPoliceOfficer() {
      const targets = getWantedTargets();
      if (!targets.length || getMaxWantedLevel() <= 0) return;
      if (countPolice() >= maxPoliceForWanted()) return;
      const anchor = targets[Math.floor(Math.random() * targets.length)];
      const spot = pickPoliceSpawnPoint(anchor);
      if (!spot) return;
      const angle = Math.atan2(anchor.y - spot.y, anchor.x - spot.x);
      pedestrians.push({
        id: `police-${simulationTick}-${Math.floor(Math.random() * 999)}`,
        x: spot.x,
        y: spot.y,
        angle,
        speed: WANTED.policeSpeed,
        radius: 3,
        walkPhase: 0,
        coat: POLICE_LOOK.coat,
        skin: skinTones[Math.floor(Math.random() * skinTones.length)],
        idleTimer: 0,
        fleeing: false,
        fleeTimer: 0,
        isPolice: true,
        health: WANTED.policeHp,
        maxHealth: WANTED.policeHp,
        shootCooldown: 20 + Math.floor(Math.random() * 20)
      });
    }

    function updatePoliceSpawning() {
      if (getMaxWantedLevel() <= 0 || getWantedTargets().length === 0) {
        policeSpawnCooldown = 0;
        return;
      }
      if (policeSpawnCooldown > 0) {
        policeSpawnCooldown--;
        return;
      }
      if (countPolice() < maxPoliceForWanted()) {
        spawnPoliceOfficer();
        policeSpawnCooldown = WANTED.spawnInterval;
      }
    }

    function updatePolicePedestrian(pedestrian) {
      const target = getNearestWantedTarget(pedestrian.x, pedestrian.y);
      if (!target) {
        if (!pedestrian.dismissing) {
          pedestrian.dismissing = true;
          pedestrian.fleeTimer = 100;
          pedestrian.speed = 1.45;
          pedestrian.angle = Math.atan2(
            pedestrian.y - player.y,
            pedestrian.x - player.x
          );
        }
        pedestrian.fleeTimer--;
        if (pedestrian.fleeTimer <= 0 || !isOnPlayableMap(pedestrian.x, pedestrian.y)) {
          return true;
        }
        const nextX = pedestrian.x + Math.cos(pedestrian.angle) * pedestrian.speed;
        const nextY = pedestrian.y + Math.sin(pedestrian.angle) * pedestrian.speed;
        if (canWalkAt(nextX, nextY, pedestrian.radius)) {
          pedestrian.x = nextX;
          pedestrian.y = nextY;
          pedestrian.walkPhase += pedestrian.speed * 0.28;
        } else {
          pedestrian.angle += Math.PI / 2;
        }
        return false;
      }

      pedestrian.dismissing = false;
      const dx = target.x - pedestrian.x;
      const dy = target.y - pedestrian.y;
      const dist = Math.hypot(dx, dy);
      const desired = Math.atan2(dy, dx);
      let angleDiff = desired - pedestrian.angle;
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      pedestrian.angle += Math.max(-0.12, Math.min(0.12, angleDiff));

      if (dist > 42) {
        const nextX = pedestrian.x + Math.cos(pedestrian.angle) * pedestrian.speed;
        const nextY = pedestrian.y + Math.sin(pedestrian.angle) * pedestrian.speed;
        if (canWalkAt(nextX, nextY, pedestrian.radius)) {
          pedestrian.x = nextX;
          pedestrian.y = nextY;
          pedestrian.walkPhase += pedestrian.speed * 0.28;
        } else {
          pedestrian.angle += (Math.random() > 0.5 ? 1 : -1) * Math.PI / 2;
        }
      }

      if (pedestrian.shootCooldown > 0) pedestrian.shootCooldown--;
      const facingDot = Math.cos(pedestrian.angle) * (dx / Math.max(dist, 0.01)) +
        Math.sin(pedestrian.angle) * (dy / Math.max(dist, 0.01));
      if (
        dist <= WANTED.policeShootRange &&
        facingDot >= WANTED.policeAimDot &&
        pedestrian.shootCooldown <= 0 &&
        isOnPlayableMap(pedestrian.x, pedestrian.y)
      ) {
        fireBullet('police', pedestrian.x, pedestrian.y, pedestrian.angle, COMBAT.bulletSpeed * 0.92, null);
        pedestrian.shootCooldown = WANTED.policeShootInterval;
      }
      return false;
    }

    function updatePolice() {
      for (let i = pedestrians.length - 1; i >= 0; i--) {
        const ped = pedestrians[i];
        if (!ped.isPolice) continue;
        if (updatePolicePedestrian(ped)) pedestrians.splice(i, 1);
      }
    }

    function applyBulletHit(bullet, targetKind, target) {
      const shooterId = bullet.shooterId || net.localId;
      if (bullet.owner === 'player') {
        if (targetKind === 'ped') {
          damagePedestrian(target, 1, shooterId);
          fleePedsNearShot(bullet.x, bullet.y);
        } else if (targetKind === 'car') {
          damageVehicleFromBullet(target, COMBAT.carDamage, shooterId);
          fleePedsNearShot(bullet.x, bullet.y);
        } else if (targetKind === 'localPlayer') {
          const wasAlive = !wasted;
          if (player.mode === 'walking' || (activeVehicle && activeVehicle.isBike)) {
            hurtPlayer(COMBAT.playerGunDamage, 'gun');
          } else if (activeVehicle) {
            damageVehicleFromBullet(activeVehicle, COMBAT.carDamage, shooterId);
          }
          if (wasAlive && wasted && shooterId && shooterId !== net.localId) {
            addWantedForPlayer(shooterId, 1);
          }
          fleePedsNearShot(bullet.x, bullet.y);
        } else if (targetKind === 'remotePlayer' && target) {
          const veh = target.vehicleId ? vehicles.find(v => v.id === target.vehicleId) : null;
          if (target.mode === 'walking' || (veh && veh.isBike) || !veh) {
            hurtGuestPlayer(target, COMBAT.playerGunDamage, 'gun', shooterId);
          } else {
            damageVehicleFromBullet(veh, COMBAT.carDamage, shooterId);
          }
          fleePedsNearShot(bullet.x, bullet.y);
        }
      } else if (bullet.owner === 'police') {
        if (targetKind === 'player') {
          if (player.mode === 'walking') {
            hurtPlayer(COMBAT.policeGunDamagePed, 'gun');
          } else if (activeVehicle) {
            if (activeVehicle.isBike) {
              hurtPlayer(COMBAT.policeGunDamagePed, 'gun');
            } else {
              damageVehicleFromBullet(activeVehicle, COMBAT.policeGunDamageCar, false);
              addCameraShake(SHAKE.tinyGunHit);
            }
          }
        } else if (targetKind === 'remotePlayer' && target) {
          const veh = target.vehicleId ? vehicles.find(v => v.id === target.vehicleId) : null;
          if (target.mode === 'walking' || (veh && veh.isBike) || !veh) {
            hurtGuestPlayer(target, COMBAT.policeGunDamagePed, 'gun', null);
          } else {
            damageVehicleFromBullet(veh, COMBAT.policeGunDamageCar, false);
          }
        }
      }
    }

    function updateBullets() {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        bullet.x += bullet.vx;
        bullet.y += bullet.vy;
        bullet.life--;

        let hit = false;
        if (bullet.life <= 0 || bulletHitsSolid(bullet.x, bullet.y) || !isOnPlayableMap(bullet.x, bullet.y)) {
          hit = true;
        }

        if (!hit && bullet.owner === 'player') {
          const shooterId = bullet.shooterId || net.localId;
          for (let p = 0; p < pedestrians.length; p++) {
            const ped = pedestrians[p];
            if (Math.hypot(ped.x - bullet.x, ped.y - bullet.y) <= bullet.radius + ped.radius + 2) {
              applyBulletHit(bullet, 'ped', ped);
              hit = true;
              break;
            }
          }
          if (!hit) {
            for (let v = 0; v < vehicles.length; v++) {
              const vehicle = vehicles[v];
              if (vehicle.dead || isVehicleDrivenBy(vehicle, shooterId)) continue;
              if (Math.hypot(vehicle.x - bullet.x, vehicle.y - bullet.y) <=
                  bullet.radius + (vehicle.radius || 13) * 0.7) {
                applyBulletHit(bullet, 'car', vehicle);
                hit = true;
                break;
              }
            }
          }
          if (!hit && net.role === 'host') {
            if (shooterId !== net.localId && !wasted && player.mode !== 'driving') {
              const pRad = player.radius + 2;
              if (Math.hypot(player.x - bullet.x, player.y - bullet.y) <= bullet.radius + pRad) {
                applyBulletHit(bullet, 'localPlayer', null);
                hit = true;
              }
            }
            if (!hit) {
              for (const rp of net.players.values()) {
                if (rp.id === shooterId || rp.wasted || rp.mode === 'driving') continue;
                if (Math.hypot(rp.x - bullet.x, rp.y - bullet.y) <= bullet.radius + player.radius + 2) {
                  applyBulletHit(bullet, 'remotePlayer', rp);
                  hit = true;
                  break;
                }
              }
            }
          }
        }

        if (!hit && bullet.owner === 'police') {
          if (!wasted) {
            const playerRad = player.mode === 'driving'
              ? (player.driveRadius || 10)
              : player.radius;
            if (Math.hypot(player.x - bullet.x, player.y - bullet.y) <= bullet.radius + playerRad) {
              applyBulletHit(bullet, 'player', null);
              hit = true;
            }
          }
          if (!hit && net.role === 'host') {
            for (const rp of net.players.values()) {
              if (rp.wasted) continue;
              const rpRad = rp.mode === 'driving' ? 10 : player.radius;
              if (Math.hypot(rp.x - bullet.x, rp.y - bullet.y) <= bullet.radius + rpRad) {
                applyBulletHit(bullet, 'remotePlayer', rp);
                hit = true;
                break;
              }
            }
          }
        }

        if (hit) bullets.splice(i, 1);
      }

      for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
        muzzleFlashes[i].life--;
        if (muzzleFlashes[i].life <= 0) muzzleFlashes.splice(i, 1);
      }
    }

    function drawCombatFx() {
      ctx.save();
      ctx.imageSmoothingEnabled = false;

      const pix = (x, y, size, color) => {
        ctx.fillStyle = color;
        ctx.fillRect(Math.round(x) - (size >> 1), Math.round(y) - (size >> 1), size, size);
      };

      bullets.forEach(bullet => {
        const hot = bullet.owner === 'police' ? '#ffe08a' : '#fff6c8';
        const core = bullet.owner === 'police' ? '#ffc94a' : '#ffffff';
        const steps = 6;
        for (let i = steps; i >= 0; i--) {
          const t = i / steps;
          const pos = project(
            bullet.x - bullet.vx * t * 3.4,
            bullet.y - bullet.vy * t * 3.4,
            8 - t * 1.2
          );
          const size = i === 0 ? 4 : (i <= 2 ? 3 : 2);
          pix(pos.x, pos.y, size, i === 0 ? core : hot);
        }
      });

      muzzleFlashes.forEach(flash => {
        const fade = flash.life / flash.maxLife;
        const base = project(flash.x, flash.y, 9);
        const tip = project(
          flash.x + Math.cos(flash.angle) * 9,
          flash.y + Math.sin(flash.angle) * 9,
          11
        );
        const bx = Math.round(base.x);
        const by = Math.round(base.y);
        const tx = Math.round(tip.x);
        const ty = Math.round(tip.y);
        const outer = `rgba(255, 170, 60, ${0.85 * fade})`;
        const mid = `rgba(255, 210, 90, ${0.9 * fade})`;
        const inner = `rgba(255, 245, 200, ${0.95 * fade})`;

        // Larger blocky plus / diamond muzzle
        pix(bx, by, 7, inner);
        pix(bx - 7, by, 5, mid);
        pix(bx + 7, by, 5, mid);
        pix(bx, by - 7, 5, mid);
        pix(bx, by + 7, 5, mid);
        pix(bx - 12, by, 4, outer);
        pix(bx + 12, by, 4, outer);
        pix(bx, by - 12, 4, outer);
        pix(bx, by + 12, 4, outer);
        pix(bx - 5, by - 5, 4, outer);
        pix(bx + 5, by - 5, 4, outer);
        pix(bx - 5, by + 5, 4, outer);
        pix(bx + 5, by + 5, 4, outer);
        pix(tx, ty, 5, mid);
        pix(tx + Math.sign(tx - bx || 1) * 5, ty + Math.sign(ty - by || 1) * 3, 4, outer);
        pix(tx + Math.sign(tx - bx || 1) * 9, ty + Math.sign(ty - by || 1) * 5, 3, outer);
        if (fade > 0.45) {
          pix(bx - 3, by - 3, 3, inner);
          pix(bx + 3, by - 3, 3, inner);
          pix(bx - 3, by + 3, 3, inner);
          pix(bx + 3, by + 3, 3, inner);
        }
      });

      ctx.restore();
    }

    function drawReloadBar() {
      if (gun.reloadTimer <= 0 || gun.reloadMax <= 0 || wasted) return;
      const progress = 1 - gun.reloadTimer / gun.reloadMax;
      const anchor = project(player.x, player.y, player.mode === 'driving' ? 18 : 26);
      const barW = 42;
      const barH = 5;
      const x = Math.round(anchor.x + 18);
      const y = Math.round(anchor.y - 8);
      const pulse = 0.85 + Math.sin(simulationTick * 0.35) * 0.15;

      ctx.save();
      ctx.fillStyle = 'rgba(20, 16, 12, 0.72)';
      ctx.fillRect(x - 1, y - 1, barW + 2, barH + 2);
      ctx.strokeStyle = 'rgba(183, 167, 142, 0.85)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x - 1.5, y - 1.5, barW + 3, barH + 3);
      ctx.fillStyle = `rgba(212, 181, 110, ${pulse})`;
      ctx.fillRect(x, y, Math.max(1, barW * progress), barH);
      ctx.fillStyle = 'rgba(238, 229, 212, 0.9)';
      ctx.font = '10px "Courier New", Courier, monospace';
      ctx.fillText('RELOAD', x, y - 4);
      ctx.restore();
    }

    function vehicleWorldVel(vehicle) {
      if (vehicle === activeVehicle) {
        return { vx: player.vx, vy: player.vy };
      }
      if (net.role === 'host' && vehicle.driverId && vehicle.driverId !== net.localId) {
        const rp = net.players.get(vehicle.driverId);
        if (rp) return { vx: rp.vx || 0, vy: rp.vy || 0 };
      }
      return {
        vx: Math.cos(vehicle.angle) * vehicle.speed,
        vy: Math.sin(vehicle.angle) * vehicle.speed
      };
    }

    function emitCarSmoke(vehicle) {
      if (carSmoke.length >= 70) return;
      const hoodFwd = getCarLayout(vehicle.carClass).hoodFwd;
      const hoodX = vehicle.x + Math.cos(vehicle.angle) * hoodFwd;
      const hoodY = vehicle.y + Math.sin(vehicle.angle) * hoodFwd;
      carSmoke.push({
        x: hoodX + (Math.random() - 0.5) * 5,
        y: hoodY + (Math.random() - 0.5) * 5,
        z: 9 + Math.random() * 3,
        vx: (Math.random() - 0.5) * 0.28,
        vy: (Math.random() - 0.5) * 0.28,
        vz: 0.32 + Math.random() * 0.22,
        life: 26 + Math.floor(Math.random() * 14),
        maxLife: 40
      });
    }

    function spawnExplosionFx(x, y) {
      wreckFx.push({
        type: 'flash',
        x, y, z: 10,
        life: 11,
        maxLife: 11
      });
      for (let i = 0; i < 16 && wreckFx.length < 70; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 1.1 + Math.random() * 2.6;
        wreckFx.push({
          type: 'boom',
          x, y,
          z: 6 + Math.random() * 4,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          vz: 0.7 + Math.random() * 1.7,
          life: 14 + Math.floor(Math.random() * 10),
          maxLife: 24
        });
      }
    }

    function explodeVehicle(vehicle, allowChain, fromPlayer) {
      if (!vehicle || vehicle.dead || vehicle.isBike) return [];
      vehicle.dead = true;
      vehicle.health = 0;
      const attackerId = typeof fromPlayer === 'string'
        ? fromPlayer
        : (fromPlayer ? net.localId : null);
      if (vehicle === activeVehicle) {
        ejectPlayerFromCar(vehicle);
      } else if (net.role === 'host' && vehicle.driverId && net.players.has(vehicle.driverId)) {
        ejectGuestFromCar(net.players.get(vehicle.driverId), vehicle);
      }
      spawnExplosionFx(vehicle.x, vehicle.y);
      if (net.role === 'host') {
        netBroadcast({ t: 'fx_boom', x: vehicle.x, y: vehicle.y });
      }
      if (attackerId) addWantedForPlayer(attackerId, 1);
      const chained = [];
      const radius = 82;
      if (allowChain) {
        vehicles.slice().forEach(other => {
          if (other === vehicle || other.dead) return;
          const dist = Math.hypot(other.x - vehicle.x, other.y - vehicle.y);
          if (dist >= radius) return;
          const dmg = Math.max(6, Math.round(28 * (1 - dist / radius)));
          other.health = Math.max(0, other.health - dmg);
          if (other.health <= 0) chained.push(other);
        });
      }
      const playerDist = Math.hypot(player.x - vehicle.x, player.y - vehicle.y);
      if (playerDist < radius) {
        const wasAlive = !wasted;
        hurtPlayer(Math.round(52 * (1 - playerDist / radius)), 'blast');
        if (wasAlive && wasted && attackerId && attackerId !== net.localId) {
          addWantedForPlayer(attackerId, 1);
        }
      }
      if (playerDist < SHAKE.blastNear) {
        const falloff = 1 - playerDist / SHAKE.blastNear;
        addCameraShake(SHAKE.bigBlast * (0.4 + 0.6 * falloff));
      }
      if (net.role === 'host') {
        net.players.forEach(rp => {
          if (rp.wasted) return;
          const rpDist = Math.hypot(rp.x - vehicle.x, rp.y - vehicle.y);
          if (rpDist < radius) {
            hurtGuestPlayer(rp, Math.round(52 * (1 - rpDist / radius)), 'blast', attackerId);
          }
        });
      }
      const idx = vehicles.indexOf(vehicle);
      if (idx !== -1) vehicles.splice(idx, 1);
      return chained;
    }

    function runExplosions(initial, fromPlayer) {
      const firstWave = initial.filter(vehicle => vehicle && !vehicle.dead);
      if (!firstWave.length) return;
      const chained = [];
      firstWave.forEach(vehicle => {
        explodeVehicle(vehicle, true, fromPlayer).forEach(other => chained.push(other));
      });
      chained.forEach(vehicle => explodeVehicle(vehicle, false, fromPlayer));
    }

    function updateWreckFx() {
      for (let i = carSmoke.length - 1; i >= 0; i--) {
        const puff = carSmoke[i];
        puff.x += puff.vx;
        puff.y += puff.vy;
        puff.z += puff.vz;
        puff.life--;
        if (puff.life <= 0) carSmoke.splice(i, 1);
      }
      for (let i = wreckFx.length - 1; i >= 0; i--) {
        const bit = wreckFx[i];
        if (bit.type === 'boom') {
          bit.x += bit.vx;
          bit.y += bit.vy;
          bit.z += bit.vz;
          bit.vz *= 0.92;
        }
        bit.life--;
        if (bit.life <= 0) wreckFx.splice(i, 1);
      }
    }

    function drawWreckFx() {
      carSmoke.forEach(puff => {
        const fade = puff.life / puff.maxLife;
        const pos = project(puff.x, puff.y, puff.z);
        ctx.fillStyle = `rgba(62, 58, 52, ${0.2 * fade})`;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 3.5 + (1 - fade) * 9, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      wreckFx.forEach(bit => {
        const fade = bit.life / bit.maxLife;
        const pos = project(bit.x, bit.y, bit.z);
        if (bit.type === 'flash') {
          ctx.fillStyle = `rgba(255, 176, 70, ${0.5 * fade})`;
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, 16 + (1 - fade) * 26, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `rgba(255, 240, 180, ${0.35 * fade})`;
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, 8 + (1 - fade) * 10, 0, Math.PI * 2);
          ctx.fill();
        } else {
          const tail = project(
            bit.x - bit.vx * 2.2,
            bit.y - bit.vy * 2.2,
            bit.z - bit.vz * 2.2
          );
          ctx.strokeStyle = `rgba(255, 210, 120, ${fade * 0.9})`;
          ctx.lineWidth = 1.6;
          drawProjectedLine(tail, pos);
          ctx.fillStyle = `rgba(255, 250, 220, ${fade})`;
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, 1.3 + fade, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      ctx.restore();
    }

    function handlePlayerCarHits() {
      if (player.hitCooldown > 0) player.hitCooldown--;
      if (player.blastCooldown > 0) player.blastCooldown--;
      if (player.gunHitCooldown > 0) player.gunHitCooldown--;
      if (!wasted && player.mode === 'walking' && player.hitCooldown === 0) {
        for (let i = 0; i < vehicles.length; i++) {
          const vehicle = vehicles[i];
          const dist = Math.hypot(player.x - vehicle.x, player.y - vehicle.y);
          if (dist > player.radius + vehicle.radius) continue;
          const carSpeed = vehicleRunoverSpeed(vehicle);
          const minHitSpeed = (vehicle.isPoliceCar && policeCarsHunting) ? 0.75 : 1.15;
          if (carSpeed < minHitSpeed) continue;
          const hit = Math.round(16 + carSpeed * 8 + (vehicle.isPoliceCar ? 8 : 0));
          const wasAlive = !wasted;
          hurtPlayer(hit, 'car');
          if (wasAlive && wasted && vehicle.driverId && vehicle.driverId !== net.localId) {
            addWantedForPlayer(vehicle.driverId, 1);
          }
          const nx = (player.x - vehicle.x) / Math.max(dist, 0.01);
          const ny = (player.y - vehicle.y) / Math.max(dist, 0.01);
          const shoveX = player.x + nx * 10;
          const shoveY = player.y + ny * 10;
          if (canWalkAt(shoveX, shoveY, player.radius)) {
            player.x = shoveX;
            player.y = shoveY;
          }
          break;
        }
      }

      if (net.role === 'host') {
        net.players.forEach(rp => {
          if (rp.hitCooldown > 0) rp.hitCooldown--;
          if (rp.blastCooldown > 0) rp.blastCooldown--;
          if (rp.gunHitCooldown > 0) rp.gunHitCooldown--;
          if (rp.wasted || rp.mode !== 'walking' || rp.hitCooldown > 0) return;
          for (let i = 0; i < vehicles.length; i++) {
            const vehicle = vehicles[i];
            if (vehicle.driverId === rp.id) continue;
            const dist = Math.hypot(rp.x - vehicle.x, rp.y - vehicle.y);
            if (dist > player.radius + vehicle.radius) continue;
            const carSpeed = vehicleRunoverSpeed(vehicle);
            const minHitSpeed = (vehicle.isPoliceCar && policeCarsHunting) ? 0.75 : 1.15;
            if (carSpeed < minHitSpeed) continue;
            const hit = Math.round(16 + carSpeed * 8 + (vehicle.isPoliceCar ? 8 : 0));
            const nx = (rp.x - vehicle.x) / Math.max(dist, 0.01);
            const ny = (rp.y - vehicle.y) / Math.max(dist, 0.01);
            const shoveX = rp.x + nx * 10;
            const shoveY = rp.y + ny * 10;
            const canShove = canWalkAt(shoveX, shoveY, player.radius);
            if (canShove) {
              rp.x = shoveX;
              rp.y = shoveY;
            }
            const driverId = vehicle === activeVehicle ? net.localId : (vehicle.driverId || null);
            hurtGuestPlayer(rp, hit, 'car', driverId, canShove ? shoveX : null, canShove ? shoveY : null);
            break;
          }
        });
      }
    }

    function spawnFleeingDriver(vehicle) {
      const side = 22;
      const rightX = -Math.sin(vehicle.angle);
      const rightY = Math.cos(vehicle.angle);
      let spawnX = vehicle.x + rightX * side;
      let spawnY = vehicle.y + rightY * side;
      [22, 28, 34, 40].some(distance => {
        spawnX = vehicle.x + rightX * distance;
        spawnY = vehicle.y + rightY * distance;
        return canWalkAt(spawnX, spawnY, 3);
      });

      pedestrians.push({
        id: `fleeing-${simulationTick}`,
        x: spawnX,
        y: spawnY,
        angle: Math.atan2(rightY, rightX) + (Math.random() - 0.5) * 0.4,
        speed: 1.45,
        radius: 3,
        walkPhase: 0,
        coat: pedestrianColors[Math.floor(Math.random() * pedestrianColors.length)],
        skin: skinTones[Math.floor(Math.random() * skinTones.length)],
        idleTimer: 0,
        fleeing: true,
        fleeTimer: 220 + Math.floor(Math.random() * 80),
        health: 1,
        isPolice: false
      });
    }

    function hitsCabinet(x, y, radius) {
      for (let i = 0; i < cabinets.length; i++) {
        const cab = cabinets[i];
        if (x + radius > cab.x && x - radius < cab.x + cab.w &&
          y + radius > cab.y && y - radius < cab.y + cab.h) {
          return true;
        }
      }
      return false;
    }

    function isInParkingBay(x, y) {
      for (let i = 0; i < parkingBays.length; i++) {
        const bay = parkingBays[i];
        if (x >= bay.x && x <= bay.x + bay.w &&
          y >= bay.y && y <= bay.y + bay.h) {
          return true;
        }
      }
      return false;
    }

    function trySlideMove(x, y, dx, dy, radius, canFn) {
      // No displacement requested — staying put is not a collision failure.
      // (Driving zeros vx/vy below crawl; treating that as "blocked" caused a
      // bounce loop that kept speed near 0 and made WASD feel dead.)
      if (dx === 0 && dy === 0) {
        return { x, y, slid: false, moved: true, usedX: false, usedY: false };
      }
      if (canFn(x + dx, y + dy, radius)) {
        return { x: x + dx, y: y + dy, slid: false, moved: true, usedX: true, usedY: true };
      }

      const canX = dx !== 0 && canFn(x + dx, y, radius);
      const canY = dy !== 0 && canFn(x, y + dy, radius);
      const preferX = Math.abs(dx) >= Math.abs(dy);

      if (preferX) {
        if (canX) return { x: x + dx, y, slid: true, moved: true, usedX: true, usedY: false };
        if (canY) return { x, y: y + dy, slid: true, moved: true, usedX: false, usedY: true };
      } else {
        if (canY) return { x, y: y + dy, slid: true, moved: true, usedX: false, usedY: true };
        if (canX) return { x: x + dx, y, slid: true, moved: true, usedX: true, usedY: false };
      }

      return { x, y, slid: false, moved: false, usedX: false, usedY: false };
    }

    const WALL_SCRAPE_FRICTION = 0.97;

    function canDriveAt(x, y, radius) {
      if (hitsCabinet(x, y, radius)) return false;
      const samples = [
        [x - radius, y - radius],
        [x + radius, y - radius],
        [x + radius, y + radius],
        [x - radius, y + radius]
      ];

      return samples.every(([sx, sy]) => {
        const tileX = Math.floor(sx / TILE_SIZE);
        const tileY = Math.floor(sy / TILE_SIZE);
        if (tileX < 0 || tileX >= MAP_SIZE || tileY < 0 || tileY >= MAP_SIZE) {
          return false;
        }
        return map[tileY][tileX] <= 1 ||
          map[tileY][tileX] === PAVEMENT_TILE ||
          isInParkingBay(sx, sy);
      });
    }

    function canWalkAt(x, y, radius) {
      if (hitsCabinet(x, y, radius)) return false;
      const samples = [
        [x - radius, y - radius],
        [x + radius, y - radius],
        [x + radius, y + radius],
        [x - radius, y + radius]
      ];

      return samples.every(([sx, sy]) => {
        const tileX = Math.floor(sx / TILE_SIZE);
        const tileY = Math.floor(sy / TILE_SIZE);
        if (tileX < 0 || tileX >= MAP_SIZE || tileY < 0 || tileY >= MAP_SIZE) {
          return false;
        }

        if (map[tileY][tileX] <= 1 || map[tileY][tileX] === PAVEMENT_TILE) {
          return true;
        }

        const firstBuildingTile = ROAD_WIDTH + 1;
        const anchorTileX = tileX -
          ((tileX % ROAD_SPACING - firstBuildingTile) % BUILDING_FOOTPRINT_TILES);
        const anchorTileY = tileY -
          ((tileY % ROAD_SPACING - firstBuildingTile) % BUILDING_FOOTPRINT_TILES);
        const footprintSize = TILE_SIZE * BUILDING_FOOTPRINT_TILES;
        const localX = sx - anchorTileX * TILE_SIZE;
        const localY = sy - anchorTileY * TILE_SIZE;
        const insideBuilding = localX >= BUILDING_INSET &&
          localX <= footprintSize - BUILDING_INSET &&
          localY >= BUILDING_INSET &&
          localY <= footprintSize - BUILDING_INSET;
        return !insideBuilding;
      });
    }

    function canPedestrianUseSurface(x, y, radius) {
      if (hitsCabinet(x, y, radius)) return false;
      const samples = [
        [x - radius, y - radius],
        [x + radius, y - radius],
        [x + radius, y + radius],
        [x - radius, y + radius]
      ];
      return samples.every(([sx, sy]) => {
        const tileX = Math.floor(sx / TILE_SIZE);
        const tileY = Math.floor(sy / TILE_SIZE);
        if (tileX < 0 || tileX >= MAP_SIZE || tileY < 0 || tileY >= MAP_SIZE) {
          return false;
        }
        const type = map[tileY][tileX];
        return type === PAVEMENT_TILE || type === 0;
      });
    }

    // --- ISOMETRIC PROJECTION ENGINE ---
    // Camera trig / screen basis refreshed once per frame (see refreshCameraProjection).
    const camProj = {
      cos: 1,
      sin: 0,
      originX: 0,
      originY: 0,
      zoom: 1.12,
      zoomRatio: 1.12 / 0.82,
      screenCX: 0,
      screenCYBase: 0,
      slopeTerm: 0
    };

    function refreshCameraProjection() {
      const cameraRotation = -player.cameraAngle - shakeSample.angle - Math.PI * 0.75;
      camProj.cos = Math.cos(cameraRotation);
      camProj.sin = Math.sin(cameraRotation);
      camProj.originX = player.x;
      camProj.originY = player.y;
      camProj.zoom = isMobile ? 0.96 : 1.12;
      camProj.zoomRatio = camProj.zoom / 0.82;
      camProj.screenCX = screenWidth / 2;
      const lookAheadShift = player.cameraLookAhead * 0.14 * (1 - player.cameraRearPeek * 0.7);
      const rearPeekShift = player.cameraRearPeek * 0.15;
      camProj.screenCYBase = screenHeight * (0.58 + lookAheadShift - rearPeekShift);
      camProj.slopeTerm = player.cameraSlope * camProj.zoomRatio;
    }

    function project(wx, wy, wz) {
      const relX = wx - camProj.originX;
      const relY = wy - camProj.originY;
      const rotX = relX * camProj.cos - relY * camProj.sin;
      const rotY = relX * camProj.sin + relY * camProj.cos;
      return {
        x: camProj.screenCX + (rotX - rotY) * camProj.zoom,
        y: camProj.screenCYBase + (rotX + rotY) * camProj.slopeTerm - wz * camProj.zoomRatio,
        depth: rotX + rotY
      };
    }

    function projectDepth(wx, wy) {
      const relX = wx - camProj.originX;
      const relY = wy - camProj.originY;
      const rotX = relX * camProj.cos - relY * camProj.sin;
      const rotY = relX * camProj.sin + relY * camProj.cos;
      return rotX + rotY;
    }

    function updateEntities() {
      simulationTick++;
      vehicles.forEach(vehicle => {
        vehicle.collisionCooldown = Math.max(0, vehicle.collisionCooldown - 1);
        if (vehicle.maxHealth && vehicle.health / vehicle.maxHealth < 0.3 && Math.random() < 0.38) {
          emitCarSmoke(vehicle);
        }
      });
      intersections.forEach(intersection => {
        if (intersection.occupant &&
          !vehicles.some(vehicle => vehicle.id === intersection.occupant && vehicle.turn)) {
          intersection.occupant = null;
        }
      });

      vehicles.forEach(vehicle => {
        if (vehicle === activeVehicle || vehicle.driverId || vehicle.ai || vehicle.parked || vehicle.isBike) return;
        if (Math.abs(vehicle.speed) <= 0.04) {
          vehicle.speed = 0;
          vehicle.parked = isInParkingBay(vehicle.x, vehicle.y);
          return;
        }
        const nx = vehicle.x + Math.cos(vehicle.angle) * vehicle.speed;
        const ny = vehicle.y + Math.sin(vehicle.angle) * vehicle.speed;
        if (canDriveAt(nx, ny, vehicle.radius)) {
          vehicle.x = nx;
          vehicle.y = ny;
        } else {
          vehicle.speed *= -0.2;
        }
        vehicle.speed *= 0.94;
      });

      vehicles.filter(vehicle => vehicle.ai).forEach(vehicle => {
        if (vehicle.isPoliceCar && policeCarsHunting) {
          vehicle.turn = null;
          vehicle.turnIntent = null;
          updatePoliceCarChase(vehicle);
          return;
        }

        if (vehicle.turn) {
          updateVehicleTurn(vehicle);
          return;
        }

        const direction = directionVector(vehicle.dirIndex);
        const damageMultiplier = carHealthSpeedMult(vehicle);
        let targetSpeed = vehicle.baseSpeed * damageMultiplier;
        const intersection = findIntersectionAhead(vehicle, direction);

        if (intersection && intersection.distance < TILE_SIZE * 4) {
          if (vehicle.lastIntersection !== intersection.item.id && !vehicle.turnIntent) {
            const turnRoll = Math.random();
            vehicle.turnIntent = turnRoll < 0.2
              ? 'left'
              : (turnRoll < 0.4 ? 'right' : 'straight');
          }

          const signalAxis = getSignalAxis(intersection.item);
          const hasGreen = signalAxis === vehicle.axis;
          const turnBlocked = vehicle.turnIntent !== 'straight' &&
            intersection.item.occupant &&
            intersection.item.occupant !== vehicle.id;
          const stopDistance = ROAD_WIDTH * TILE_SIZE / 2 + 20;

          if (!hasGreen || turnBlocked) {
            const brakingDistance = Math.max(0, intersection.distance - stopDistance);
            targetSpeed = Math.min(
              targetSpeed,
              vehicle.baseSpeed * Math.min(1, brakingDistance / 90)
            );
          } else if (vehicle.turnIntent !== 'straight' && intersection.distance < 8) {
            startVehicleTurn(vehicle, intersection.item);
            return;
          }

        } else {
          vehicle.lastIntersection = null;
          vehicle.turnIntent = null;
        }

        const leadDistance = findLeadVehicleDistance(vehicle, direction);
        if (leadDistance < 105) {
          targetSpeed = Math.min(
            targetSpeed,
            vehicle.baseSpeed * Math.max(0, (leadDistance - 30) / 75)
          );
        }

        vehicle.targetSpeed = targetSpeed;
        vehicle.speed += (targetSpeed - vehicle.speed) * 0.08;
        const nx = vehicle.x + direction.x * vehicle.speed;
        const ny = vehicle.y + direction.y * vehicle.speed;
        const margin = TILE_SIZE * 0.4;
        const worldLimit = MAP_SIZE * TILE_SIZE - margin;
        const insideCity = nx >= margin && nx <= worldLimit &&
          ny >= margin && ny <= worldLimit;

        if (insideCity) {
          vehicle.x = nx;
          vehicle.y = ny;
          const lane = getLeftLaneCenter(vehicle.roadBase, vehicle.dirIndex);
          if (vehicle.axis === 'horizontal') {
            vehicle.y += (lane - vehicle.y) * 0.035;
          } else {
            vehicle.x += (lane - vehicle.x) * 0.035;
          }
        } else {
          vehicle.dirIndex = (vehicle.dirIndex + 2) % 4;
          vehicle.dir = vehicle.dirIndex * (Math.PI / 2);
          vehicle.angle = vehicle.dir;
          const lane = getLeftLaneCenter(vehicle.roadBase, vehicle.dirIndex);

          if (vehicle.axis === 'horizontal') {
            vehicle.y = lane;
            vehicle.x = Math.max(margin, Math.min(worldLimit, vehicle.x));
          } else {
            vehicle.x = lane;
            vehicle.y = Math.max(margin, Math.min(worldLimit, vehicle.y));
          }
        }
        vehicle.angle = vehicle.dir;
      });
      handleVehicleCollisions();
    }

    function updatePedestrians() {
      pedestrians.forEach(pedestrian => {
        if (pedestrian.isPolice) return;

        if (pedestrian.fleeing) {
          pedestrian.fleeTimer--;
          if (pedestrian.fleeTimer <= 0) {
            pedestrian.fleeing = false;
            pedestrian.speed = 0.55 + Math.random() * 0.45;
          } else {
            const nextX = pedestrian.x + Math.cos(pedestrian.angle) * pedestrian.speed;
            const nextY = pedestrian.y + Math.sin(pedestrian.angle) * pedestrian.speed;
            if (canWalkAt(nextX, nextY, pedestrian.radius)) {
              pedestrian.x = nextX;
              pedestrian.y = nextY;
              pedestrian.walkPhase += pedestrian.speed * 0.28;
            } else {
              const turns = [Math.PI / 2, -Math.PI / 2, Math.PI / 4, -Math.PI / 4, Math.PI];
              const validTurn = turns.find(turn => canWalkAt(
                pedestrian.x + Math.cos(pedestrian.angle + turn) * pedestrian.speed * 4,
                pedestrian.y + Math.sin(pedestrian.angle + turn) * pedestrian.speed * 4,
                pedestrian.radius
              ));
              pedestrian.angle += validTurn ?? Math.PI;
            }
            return;
          }
        }

        if (pedestrian.idleTimer > 0) {
          pedestrian.idleTimer--;
          return;
        }

        const nearbyVehicle = vehicles.find(vehicle =>
          Math.hypot(vehicle.x - pedestrian.x, vehicle.y - pedestrian.y) < 34
        );
        if (nearbyVehicle) {
          pedestrian.angle = Math.atan2(
            pedestrian.y - nearbyVehicle.y,
            pedestrian.x - nearbyVehicle.x
          );
          pedestrian.idleTimer = 12;
          return;
        }

        if (Math.random() < 0.003) {
          pedestrian.idleTimer = 30 + Math.floor(Math.random() * 90);
          return;
        }

        const nextX = pedestrian.x + Math.cos(pedestrian.angle) * pedestrian.speed;
        const nextY = pedestrian.y + Math.sin(pedestrian.angle) * pedestrian.speed;
        if (canPedestrianUseSurface(nextX, nextY, pedestrian.radius)) {
          pedestrian.x = nextX;
          pedestrian.y = nextY;
          pedestrian.walkPhase += pedestrian.speed * 0.28;
          return;
        }

        const turns = Math.random() > 0.5
          ? [Math.PI / 2, -Math.PI / 2, Math.PI]
          : [-Math.PI / 2, Math.PI / 2, Math.PI];
        const validTurn = turns
          .map(turn => pedestrian.angle + turn)
          .find(angle => canPedestrianUseSurface(
            pedestrian.x + Math.cos(angle) * pedestrian.speed * 4,
            pedestrian.y + Math.sin(angle) * pedestrian.speed * 4,
            pedestrian.radius
          ));
        pedestrian.angle = validTurn ?? pedestrian.angle + Math.PI;
      });
    }

    function findIntersectionAhead(vehicle, direction) {
      let nearest = null;
      intersections.forEach(intersection => {
        const dx = intersection.x - vehicle.x;
        const dy = intersection.y - vehicle.y;
        const distance = dx * direction.x + dy * direction.y;
        const lateral = Math.abs(-direction.y * dx + direction.x * dy);
        if (lateral <= ROAD_WIDTH * TILE_SIZE / 2 + 8 &&
          distance >= 0 &&
          (!nearest || distance < nearest.distance)) {
          nearest = { item: intersection, distance };
        }
      });
      return nearest;
    }

    function findLeadVehicleDistance(vehicle, direction) {
      let nearest = Infinity;
      vehicles.forEach(other => {
        if (other === vehicle || other.parked || other.isBike) return;
        const dx = other.x - vehicle.x;
        const dy = other.y - vehicle.y;
        const forward = dx * direction.x + dy * direction.y;
        const lateral = Math.abs(-direction.y * dx + direction.x * dy);
        if (forward > 0 && lateral < vehicle.radius + other.radius - 2 && forward < nearest) {
          nearest = forward;
        }
      });
      return nearest;
    }

    function startVehicleTurn(vehicle, intersection) {
      const delta = vehicle.turnIntent === 'left' ? -1 : 1;
      const newDirIndex = (vehicle.dirIndex + delta + 4) % 4;
      const newDirection = directionVector(newDirIndex);
      const turnReach = ROAD_WIDTH * TILE_SIZE * 0.6;
      let endX = intersection.x + newDirection.x * turnReach;
      let endY = intersection.y + newDirection.y * turnReach;

      if (newDirIndex === 0 || newDirIndex === 2) {
        endY = getLeftLaneCenter(intersection.roadY, newDirIndex);
      } else {
        endX = getLeftLaneCenter(intersection.roadX, newDirIndex);
      }

      intersection.occupant = vehicle.id;
      vehicle.turn = {
        startX: vehicle.x,
        startY: vehicle.y,
        controlX: intersection.x,
        controlY: intersection.y,
        endX,
        endY,
        progress: 0,
        intersection,
        newDirIndex
      };
    }

    function updateVehicleTurn(vehicle) {
      const turn = vehicle.turn;
      turn.progress = Math.min(1, turn.progress + Math.max(0.018, vehicle.speed / 150));
      const t = turn.progress;
      const inv = 1 - t;
      vehicle.x = inv * inv * turn.startX +
        2 * inv * t * turn.controlX +
        t * t * turn.endX;
      vehicle.y = inv * inv * turn.startY +
        2 * inv * t * turn.controlY +
        t * t * turn.endY;

      const tangentX = 2 * inv * (turn.controlX - turn.startX) +
        2 * t * (turn.endX - turn.controlX);
      const tangentY = 2 * inv * (turn.controlY - turn.startY) +
        2 * t * (turn.endY - turn.controlY);
      vehicle.angle = Math.atan2(tangentY, tangentX);
      vehicle.dir = vehicle.angle;
      vehicle.speed += (vehicle.baseSpeed * 0.7 - vehicle.speed) * 0.08;

      if (turn.progress >= 1) {
        vehicle.dirIndex = turn.newDirIndex;
        vehicle.dir = vehicle.dirIndex * (Math.PI / 2);
        vehicle.angle = vehicle.dir;
        vehicle.axis = vehicle.dirIndex % 2 === 0 ? 'horizontal' : 'vertical';
        vehicle.roadBase = vehicle.axis === 'horizontal'
          ? turn.intersection.roadY
          : turn.intersection.roadX;
        vehicle.lastIntersection = turn.intersection.id;
        vehicle.turnIntent = null;
        turn.intersection.occupant = null;
        vehicle.turn = null;
      }
    }

    // Spatial hash for car–car collisions (skips bikes). Cell >= max diameter (van ~32).
    const VEHICLE_GRID_CELL = 56;
    const vehicleGrid = new Map();
    const vehicleGridBucketPool = [];
    let vehicleGridBucketsUsed = 0;

    function acquireVehicleGridBucket() {
      let bucket = vehicleGridBucketPool[vehicleGridBucketsUsed];
      if (!bucket) {
        bucket = [];
        vehicleGridBucketPool.push(bucket);
      } else {
        bucket.length = 0;
      }
      vehicleGridBucketsUsed++;
      return bucket;
    }

    function buildVehicleCollisionGrid() {
      vehicleGrid.clear();
      vehicleGridBucketsUsed = 0;
      for (let i = 0; i < vehicles.length; i++) {
        const vehicle = vehicles[i];
        if (!vehicle || vehicle.isBike || vehicle.dead) continue;
        const cx = Math.floor(vehicle.x / VEHICLE_GRID_CELL);
        const cy = Math.floor(vehicle.y / VEHICLE_GRID_CELL);
        const key = cx + ',' + cy;
        let bucket = vehicleGrid.get(key);
        if (!bucket) {
          bucket = acquireVehicleGridBucket();
          vehicleGrid.set(key, bucket);
        }
        bucket.push(i);
      }
    }

    function handleVehicleCollisions() {
      const pendingExplode = [];
      let playerCausedCrash = false;
      buildVehicleCollisionGrid();

      for (let i = 0; i < vehicles.length; i++) {
        const first = vehicles[i];
        if (!first || first.isBike || first.dead) continue;

        const cx = Math.floor(first.x / VEHICLE_GRID_CELL);
        const cy = Math.floor(first.y / VEHICLE_GRID_CELL);

        for (let ox = -1; ox <= 1; ox++) {
          for (let oy = -1; oy <= 1; oy++) {
            const bucket = vehicleGrid.get((cx + ox) + ',' + (cy + oy));
            if (!bucket) continue;

            for (let b = 0; b < bucket.length; b++) {
              const j = bucket[b];
              if (j <= i) continue;

              const second = vehicles[j];
              if (!second || second.isBike || second.dead) continue;

              const dx = second.x - first.x;
              const dy = second.y - first.y;
              const distance = Math.hypot(dx, dy);
              const minimumDistance = first.radius + second.radius;
              if (distance >= minimumDistance) continue;

              const safeDistance = Math.max(distance, 0.01);
              const normalX = distance < 0.01 ? Math.cos(first.angle) : dx / safeDistance;
              const normalY = distance < 0.01 ? Math.sin(first.angle) : dy / safeDistance;
              const overlap = minimumDistance - safeDistance;
              const vel1 = vehicleWorldVel(first);
              const vel2 = vehicleWorldVel(second);
              const relVx = vel2.vx - vel1.vx;
              const relVy = vel2.vy - vel1.vy;
              const closing = Math.max(0, -(relVx * normalX + relVy * normalY));
              const impactSpeed = Math.hypot(relVx, relVy);
              const kick = Math.min(10, closing * 0.7 + impactSpeed * 0.18);
              const w1 = getCarSpec(first).shove;
              const w2 = getCarSpec(second).shove;
              const weightSum = w1 + w2;
              const sep = overlap + kick * 0.84;
              const push1 = sep * (w2 / weightSum);
              const push2 = sep * (w1 / weightSum);

              first.x -= normalX * push1;
              first.y -= normalY * push1;
              second.x += normalX * push2;
              second.y += normalY * push2;

              const knockOut = overlap + kick;
              if (first.parked && first !== activeVehicle && !first.driverId && knockOut > 1.15) {
                first.parked = false;
                first.angle = Math.atan2(-normalY, -normalX);
                first.speed = Math.min(3.2, kick * 0.5 * w2);
              }
              if (second.parked && second !== activeVehicle && !second.driverId && knockOut > 1.15) {
                second.parked = false;
                second.angle = Math.atan2(normalY, normalX);
                second.speed = Math.min(3.2, kick * 0.5 * w1);
              }

              if (first.collisionCooldown === 0 && second.collisionCooldown === 0) {
                if (impactSpeed > 0.5) {
                  const localInCrash = first === activeVehicle || second === activeVehicle;
                  const crashDriver = localInCrash
                    ? net.localId
                    : (first.driverId || second.driverId || null);
                  if (localInCrash) addCameraShake(SHAKE.mediumCrash);
                  const dmg = Math.round(Math.max(0, impactSpeed - 0.35) * 5.2);
                  if (dmg > 0) {
                    first.health = Math.max(0, first.health - dmg);
                    second.health = Math.max(0, second.health - dmg);
                    if (first.health <= 0) {
                      pendingExplode.push(first);
                      if (crashDriver) playerCausedCrash = crashDriver;
                    }
                    if (second.health <= 0) {
                      pendingExplode.push(second);
                      if (crashDriver) playerCausedCrash = crashDriver;
                    }
                  }
                  first.speed *= -0.28;
                  second.speed *= -0.28;
                  if (first === activeVehicle) {
                    player.speed = first.speed;
                    player.vx = Math.cos(player.angle) * player.speed;
                    player.vy = Math.sin(player.angle) * player.speed;
                    player.drifting = false;
                  } else if (net.role === 'host' && first.driverId && first.driverId !== net.localId) {
                    const rp = net.players.get(first.driverId);
                    if (rp) {
                      rp.speed = first.speed;
                      netSendToPeer(rp.id, {
                        t: 'car_bump',
                        vehicleId: first.id,
                        x: first.x,
                        y: first.y,
                        speed: first.speed,
                        shake: SHAKE.mediumCrash
                      });
                    }
                  }
                  if (second === activeVehicle) {
                    player.speed = second.speed;
                    player.vx = Math.cos(player.angle) * player.speed;
                    player.vy = Math.sin(player.angle) * player.speed;
                    player.drifting = false;
                  } else if (net.role === 'host' && second.driverId && second.driverId !== net.localId) {
                    const rp = net.players.get(second.driverId);
                    if (rp) {
                      rp.speed = second.speed;
                      netSendToPeer(rp.id, {
                        t: 'car_bump',
                        vehicleId: second.id,
                        x: second.x,
                        y: second.y,
                        speed: second.speed,
                        shake: SHAKE.mediumCrash
                      });
                    }
                  }
                }
                first.collisionCooldown = 18;
                second.collisionCooldown = 18;
              }
            }
          }
        }
      }

      runExplosions(pendingExplode, playerCausedCrash);

      if (activeVehicle) {
        player.x = activeVehicle.x;
        player.y = activeVehicle.y;
        player.speed = activeVehicle.speed;
      }
    }

    // --- RENDER PIPELINE ---
    // Pooled queues — mutate slots instead of allocating tile/item objects each frame.
    const groundPool = [];
    const groundQueue = [];
    const renderPool = [];
    const renderQueue = [];

    function acquireGroundTile(r, c, tileType, wx, wy, depth) {
      const i = groundQueue.length;
      let tile = groundPool[i];
      if (!tile) {
        tile = { r, c, tileType, wx, wy, depth };
        groundPool[i] = tile;
      } else {
        tile.r = r;
        tile.c = c;
        tile.tileType = tileType;
        tile.wx = wx;
        tile.wy = wy;
        tile.depth = depth;
      }
      groundQueue.push(tile);
      return tile;
    }

    function acquireRenderItem() {
      const i = renderQueue.length;
      let item = renderPool[i];
      if (!item) {
        item = {
          type: '',
          r: 0,
          c: 0,
          tileType: 0,
          wx: 0,
          wy: 0,
          depth: 0,
          vehicle: null,
          pedestrian: null,
          intersection: null,
          cabinet: null
        };
        renderPool[i] = item;
      }
      renderQueue.push(item);
      return item;
    }

    function render() {
      refreshCameraProjection();

      ctx.fillStyle = PALETTE.background;
      ctx.fillRect(0, 0, screenWidth, screenHeight);

      ctx.save();
      ctx.translate(shakeSample.x, shakeSample.y);

      groundQueue.length = 0;
      renderQueue.length = 0;

      // Determine visible grid bounds around player
      const viewRadius = 14;
      const pTileX = Math.floor(player.x / TILE_SIZE);
      const pTileY = Math.floor(player.y / TILE_SIZE);

      const startX = Math.max(0, pTileX - viewRadius);
      const endX = Math.min(MAP_SIZE, pTileX + viewRadius);
      const startY = Math.max(0, pTileY - viewRadius);
      const endY = Math.min(MAP_SIZE, pTileY + viewRadius);

      // Collect grid tiles
      for (let r = startY; r < endY; r++) {
        for (let c = startX; c < endX; c++) {
          const type = map[r][c];
          const wx = c * TILE_SIZE;
          const wy = r * TILE_SIZE;
          const depth = projectDepth(wx + TILE_SIZE / 2, wy + TILE_SIZE / 2);
          acquireGroundTile(r, c, type, wx, wy, depth);

          if (type >= 2 && type <= 4 && isBuildingAnchor(r, c)) {
            const item = acquireRenderItem();
            item.type = 'building';
            item.r = r;
            item.c = c;
            item.tileType = type;
            item.wx = wx;
            item.wy = wy;
            item.depth = projectDepth(wx + TILE_SIZE, wy + TILE_SIZE);
            item.vehicle = null;
            item.pedestrian = null;
            item.intersection = null;
            item.cabinet = null;
          }
        }
      }

      for (let i = 0; i < intersections.length; i++) {
        const intersection = intersections[i];
        const tileX = intersection.x / TILE_SIZE;
        const tileY = intersection.y / TILE_SIZE;
        if (tileX < startX || tileX > endX || tileY < startY || tileY > endY) continue;
        const item = acquireRenderItem();
        item.type = 'trafficLight';
        item.intersection = intersection;
        item.depth = projectDepth(intersection.x, intersection.y);
        item.vehicle = null;
        item.pedestrian = null;
        item.cabinet = null;
      }

      // All traffic, parked cars and the controlled vehicle share one queue.
      for (let i = 0; i < vehicles.length; i++) {
        const vehicle = vehicles[i];
        const item = acquireRenderItem();
        item.type = 'vehicle';
        item.vehicle = vehicle;
        item.depth = projectDepth(vehicle.x, vehicle.y);
        item.pedestrian = null;
        item.intersection = null;
        item.cabinet = null;
      }

      for (let i = 0; i < cabinets.length; i++) {
        const cabinet = cabinets[i];
        const cx = cabinet.x + cabinet.w / 2;
        const cy = cabinet.y + cabinet.h / 2;
        const tileX = cx / TILE_SIZE;
        const tileY = cy / TILE_SIZE;
        if (tileX < startX || tileX > endX || tileY < startY || tileY > endY) continue;
        const item = acquireRenderItem();
        item.type = 'cabinet';
        item.cabinet = cabinet;
        item.depth = projectDepth(cx, cy);
        item.vehicle = null;
        item.pedestrian = null;
        item.intersection = null;
      }

      if (player.mode === 'walking') {
        const item = acquireRenderItem();
        item.type = 'pedestrian';
        item.depth = projectDepth(player.x, player.y);
        item.vehicle = null;
        item.pedestrian = null;
        item.intersection = null;
        item.cabinet = null;
      }

      for (let i = 0; i < pedestrians.length; i++) {
        const pedestrian = pedestrians[i];
        const tileX = pedestrian.x / TILE_SIZE;
        const tileY = pedestrian.y / TILE_SIZE;
        if (tileX < startX || tileX > endX || tileY < startY || tileY > endY) continue;
        const item = acquireRenderItem();
        item.type = 'npcPedestrian';
        item.pedestrian = pedestrian;
        item.depth = projectDepth(pedestrian.x, pedestrian.y);
        item.vehicle = null;
        item.intersection = null;
        item.cabinet = null;
      }

      if (net.players.size > 0) {
        net.players.forEach(rp => {
          if (rp.wasted || rp.mode !== 'walking') return;
          const tileX = rp.x / TILE_SIZE;
          const tileY = rp.y / TILE_SIZE;
          if (tileX < startX || tileX > endX || tileY < startY || tileY > endY) return;
          const item = acquireRenderItem();
          item.type = 'remotePlayer';
          item.pedestrian = rp;
          item.depth = projectDepth(rp.x, rp.y);
          item.vehicle = null;
          item.intersection = null;
          item.cabinet = null;
        });
      }

      // Ground is always painted before vehicles, preventing roads from
      // covering cars. Raised objects still share normal depth sorting.
      groundQueue.sort((a, b) => a.depth - b.depth);
      for (let i = 0; i < groundQueue.length; i++) {
        drawTile(groundQueue[i], true);
      }
      drawParkingBays();
      drawBikeBays();
      drawSkidMarks();
      ctx.beginPath();
      for (let i = 0; i < groundQueue.length; i++) {
        const tile = groundQueue[i];
        if (tile.tileType >= 2 && tile.tileType <= 4 && isBuildingAnchor(tile.r, tile.c)) {
          appendBuildingShadowPath(tile);
        }
      }
      for (let i = 0; i < renderQueue.length; i++) {
        const item = renderQueue[i];
        if (item.type === 'trafficLight') {
          appendTrafficLightShadowPath(item.intersection);
        }
      }
      ctx.fillStyle = PALETTE.shadow;
      ctx.fill();

      // Painter's Algorithm Depth Sort (Back to Front)
      renderQueue.sort((a, b) => a.depth - b.depth);

      // Draw raised objects and vehicles.
      for (let i = 0; i < renderQueue.length; i++) {
        const item = renderQueue[i];
        if (item.type === 'building') drawTile(item, false);
        else if (item.type === 'vehicle') {
          if (item.vehicle.isBike) {
            let hasRider = item.vehicle === activeVehicle;
            let riderCoat = net.localCoat;
            let riderSkin = playerSkin;
            if (!hasRider && item.vehicle.driverId) {
              const rp = net.players.get(item.vehicle.driverId);
              if (rp && !rp.wasted) {
                hasRider = true;
                riderCoat = rp.coat || '#3d7a8c';
                riderSkin = rp.skin || playerSkin;
              }
            }
            drawLimeBike(item.vehicle, hasRider, riderCoat, riderSkin);
          } else {
            drawVehicle(item.vehicle, item.vehicle === activeVehicle || !!item.vehicle.driverId);
          }
        } else if (item.type === 'pedestrian') {
          drawPedestrian(
            player.x,
            player.y,
            player.angle,
            player.walkPhase,
            net.localCoat,
            playerSkin
          );
        } else if (item.type === 'remotePlayer') {
          drawPedestrian(
            item.pedestrian.x,
            item.pedestrian.y,
            item.pedestrian.angle,
            item.pedestrian.walkPhase || 0,
            item.pedestrian.coat || '#3d7a8c',
            item.pedestrian.skin || playerSkin,
            false
          );
        } else if (item.type === 'npcPedestrian') {
          drawPedestrian(
            item.pedestrian.x,
            item.pedestrian.y,
            item.pedestrian.angle,
            item.pedestrian.walkPhase,
            item.pedestrian.coat,
            item.pedestrian.skin,
            item.pedestrian.isPolice
          );
        } else if (item.type === 'trafficLight') {
          drawTrafficLights(item.intersection);
        } else if (item.type === 'cabinet') {
          drawCabinet(item.cabinet);
        }
      }

      drawWreckFx();
      drawCombatFx();
      drawRemotePlayerLabels();
      drawReloadBar();
      drawAtmosphere();
      drawMinimap();

      if (activeVehicle && activeVehicle.health / activeVehicle.maxHealth < 0.45) {
        ctx.strokeStyle = `rgba(169, 63, 52, ${
          0.22 + Math.sin(simulationTick * 0.15) * 0.12
        })`;
        ctx.lineWidth = 8;
        ctx.strokeRect(4, 4, screenWidth - 8, screenHeight - 8);
      }
      ctx.restore();
    }

    function appendBuildingShadowPath(tile) {
      const h = BUILDING_HEIGHTS[tile.tileType];
      const bx = tile.wx + BUILDING_INSET;
      const by = tile.wy + BUILDING_INSET;
      const size = TILE_SIZE * BUILDING_FOOTPRINT_TILES - BUILDING_INSET * 2;
      const offsetX = -h * 1.65;
      const offsetY = -h * 1.23;
      const base = [
        project(bx, by, 0),
