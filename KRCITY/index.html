    function drawVehicle(vehicle, isPlayer = false) {
      const wx = vehicle.x;
      const wy = vehicle.y;
      const angle = vehicle.angle;
      const color = vehicle.color;
      const layout = getCarLayout(vehicle.carClass);
      const toWorld = (side, forward, z) => ({
        x: wx + Math.cos(angle) * forward - Math.sin(angle) * side,
        y: wy + Math.sin(angle) * forward + Math.cos(angle) * side,
        z
      });

      const shadowCorners = [
        toWorld(-layout.shadowW, -layout.shadowL, 0),
        toWorld(layout.shadowW, -layout.shadowL, 0),
        toWorld(layout.shadowW, layout.shadowL, 0),
        toWorld(-layout.shadowW, layout.shadowL, 0)
      ].map(point => project(point.x - 5, point.y - 4, 0));
      ctx.fillStyle = 'rgba(48, 40, 31, 0.24)';
      fillQuad(
        shadowCorners[0],
        shadowCorners[1],
        shadowCorners[2],
        shadowCorners[3]
      );

      const drawBox = (halfWidth, halfLength, centerForward, bottom, top, boxColor, sideOffset = 0) => {
        const localCorners = [
          [-halfWidth + sideOffset, centerForward - halfLength],
          [halfWidth + sideOffset, centerForward - halfLength],
          [halfWidth + sideOffset, centerForward + halfLength],
          [-halfWidth + sideOffset, centerForward + halfLength]
        ];
        const worldCorners = localCorners.map(([side, forward]) => toWorld(side, forward, 0));
        const bottomPoints = worldCorners.map(point => project(point.x, point.y, bottom));
        const topPoints = worldCorners.map(point => project(point.x, point.y, top));
        const walls = worldCorners.map((point, index) => {
          const next = worldCorners[(index + 1) % 4];
          return {
            index,
            depth: project((point.x + next.x) / 2, (point.y + next.y) / 2, bottom).depth
          };
        });

        walls.sort((a, b) => a.depth - b.depth);
        walls.forEach((wall, order) => {
          const next = (wall.index + 1) % 4;
          ctx.fillStyle = shadeColor(boxColor, order < 2 ? -34 : -20);
          fillQuad(
            bottomPoints[wall.index],
            bottomPoints[next],
            topPoints[next],
            topPoints[wall.index]
          );
        });

        ctx.fillStyle = shadeColor(boxColor, 18);
        fillQuad(topPoints[0], topPoints[1], topPoints[2], topPoints[3]);
        ctx.strokeStyle = 'rgba(45, 37, 29, 0.58)';
        ctx.lineWidth = 1;
        strokeQuad(topPoints[0], topPoints[1], topPoints[2], topPoints[3]);
      };

      const body = layout.body;
      const cabin = layout.cabin;
      const wheels = layout.wheels;
      const nose = body.fwd + body.l;
      const tail = body.fwd - body.l;

      const leftFlank = toWorld(-wheels.side, 0, wheels.z1 * 0.5);
      const rightFlank = toWorld(wheels.side, 0, wheels.z1 * 0.5);
      const leftDepth = project(leftFlank.x, leftFlank.y, leftFlank.z).depth;
      const rightDepth = project(rightFlank.x, rightFlank.y, rightFlank.z).depth;
      const nearSideSign = leftDepth >= rightDepth ? -1 : 1;

      const wheelSpots = [
        [wheels.side, wheels.front],
        [-wheels.side, wheels.front],
        [wheels.side, wheels.rear],
        [-wheels.side, wheels.rear]
      ].map(([side, fwd]) => ({ side, fwd, near: Math.sign(side) === nearSideSign }));

      const drawWheel = (spot, withHub) => {
        drawBox(wheels.hw, wheels.hl, spot.fwd, 0, wheels.z1, '#1c1a17', spot.side);
        if (!withHub) return;
        const hubSide = spot.side + nearSideSign * (wheels.hw * 0.55);
        const hubZ0 = wheels.z1 * 0.34;
        const hubZ1 = wheels.z1 * 0.76;
        drawBox(0.32, 0.55, spot.fwd, hubZ0, hubZ1, '#7a7670', hubSide);
        drawBox(0.16, 0.28, spot.fwd, hubZ0 + 0.12, hubZ1 - 0.12, '#9a9590', hubSide);
      };

      wheelSpots.filter(spot => !spot.near).forEach(spot => drawWheel(spot, false));

      const head = layout.headLight;
      const tailLamp = layout.tailLight;
      const frontDepth = project(toWorld(0, nose, head.z0).x, toWorld(0, nose, head.z0).y, head.z0).depth;
      const rearDepth = project(toWorld(0, tail, head.z0).x, toWorld(0, tail, head.z0).y, head.z0).depth;
      const viewingFront = frontDepth >= rearDepth;

      const drawHeadlights = () => {
        const headColor = isPlayer ? '#fff6c8' : '#e6d6a0';
        const headInner = isPlayer ? '#fffef0' : '#f3ead0';
        [-head.spread, head.spread].forEach(side => {
          drawBox(head.w, head.l, nose + head.l * 0.35, head.z0, head.z1, headColor, side);
          drawBox(head.w * 0.45, head.l * 0.45, nose + head.l * 0.55, head.z0 + 0.35, head.z1 - 0.2, headInner, side);
        });
      };
      const drawTaillights = () => {
        [-tailLamp.spread, tailLamp.spread].forEach(side => {
          drawBox(tailLamp.w, tailLamp.l, tail - tailLamp.l * 0.35, tailLamp.z0, tailLamp.z1, '#a83f35', side);
          drawBox(
            tailLamp.w * 0.4, tailLamp.l * 0.4, tail - tailLamp.l * 0.5,
            tailLamp.z0 + 0.4, tailLamp.z1 - 0.35, '#d46555', side
          );
        });
      };

      drawBox(body.w, body.l, body.fwd, body.z0, body.z1, color);
      if (viewingFront) {
        drawBox(
          layout.bumper.w, layout.bumper.l, nose + layout.bumper.l * 0.15,
          layout.bumper.z0, layout.bumper.z1, shadeHex(color, -48)
        );
      } else {
        drawBox(
          layout.bumper.w, layout.bumper.l, tail - layout.bumper.l * 0.15,
          layout.bumper.z0, layout.bumper.z1, shadeHex(color, -48)
        );
      }
      drawBox(cabin.w, cabin.l, cabin.fwd, cabin.z0, cabin.z1, layout.cabinColor);
      if (layout.spoiler) {
        const spoiler = layout.spoiler;
        drawBox(spoiler.w, spoiler.l, spoiler.fwd, spoiler.z0, spoiler.z1, shadeHex(color, -32));
      }

      if (layout.stripes) {
        const stripe = '#efe6c8';
        [-1.55, 1.55].forEach(side => {
          drawBox(0.42, body.l * 0.9, body.fwd, body.z1, body.z1 + 0.42, stripe, side);
          drawBox(0.36, cabin.l * 0.82, cabin.fwd, cabin.z1, cabin.z1 + 0.38, stripe, side);
        });
      }

      if (vehicle.isPoliceCar) {
        [-1, 1].forEach(sideSign => {
          const side = sideSign * (body.w + 0.2);
          const panels = [
            { fwd: 6, color: '#f5d031' },
            { fwd: 2.5, color: '#1f4f9c' },
            { fwd: -1, color: '#f5d031' },
            { fwd: -4.5, color: '#1f4f9c' },
            { fwd: -8, color: '#f5d031' }
          ];
          panels.forEach(panel => {
            drawBox(0.55, 1.35, panel.fwd, body.z0 + 1.2, body.z1 - 0.4, panel.color, side);
          });
        });

        const hunting = policeCarsHunting || vehicle === activeVehicle;
        const phase = Math.floor(simulationTick / 5) % 2;
        const blueHot = !hunting || phase === 0;
        const yellowHot = !hunting || phase === 1;
        const blueColor = blueHot ? '#7ec2ff' : '#1a3f7a';
        const yellowColor = yellowHot ? '#ffe14a' : '#7a5a10';

        drawBox(3.2, 1.1, cabin.fwd, cabin.z1, cabin.z1 + 1.6, '#1a1f28', 0);
        drawBox(1.1, 0.7, cabin.fwd - 0.9, cabin.z1 + 0.2, cabin.z1 + 1.45, blueColor, 0);
        drawBox(1.1, 0.7, cabin.fwd + 0.9, cabin.z1 + 0.2, cabin.z1 + 1.45, yellowColor, 0);

        // Emergency light aura (blue / yellow tint)
        const glowWorld = toWorld(0, cabin.fwd, cabin.z1 + 1.4);
        const glow = project(glowWorld.x, glowWorld.y, glowWorld.z);
        const leftGlow = project(
          toWorld(-3.2, cabin.fwd, cabin.z1 + 1.3).x,
          toWorld(-3.2, cabin.fwd, cabin.z1 + 1.3).y,
          cabin.z1 + 1.3
        );
        const rightGlow = project(
          toWorld(3.2, cabin.fwd, cabin.z1 + 1.3).x,
          toWorld(3.2, cabin.fwd, cabin.z1 + 1.3).y,
          cabin.z1 + 1.3
        );
        const aura = hunting ? 0.38 : 0.16;
        const radius = hunting ? 26 : 14;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        if (blueHot) {
          ctx.fillStyle = `rgba(70, 140, 255, ${aura})`;
          ctx.beginPath();
          ctx.arc(leftGlow.x, leftGlow.y, radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `rgba(140, 190, 255, ${aura * 0.7})`;
          ctx.beginPath();
          ctx.arc(leftGlow.x, leftGlow.y, radius * 0.45, 0, Math.PI * 2);
          ctx.fill();
        }
        if (yellowHot) {
          ctx.fillStyle = `rgba(255, 200, 50, ${aura})`;
          ctx.beginPath();
          ctx.arc(rightGlow.x, rightGlow.y, radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `rgba(255, 230, 140, ${aura * 0.7})`;
          ctx.beginPath();
          ctx.arc(rightGlow.x, rightGlow.y, radius * 0.45, 0, Math.PI * 2);
          ctx.fill();
        }
        if (hunting) {
          ctx.fillStyle = phase === 0
            ? `rgba(80, 150, 255, ${aura * 0.35})`
            : `rgba(255, 195, 60, ${aura * 0.35})`;
          ctx.beginPath();
          ctx.arc(glow.x, glow.y, radius * 1.35, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      if (viewingFront) drawHeadlights();
      else drawTaillights();

      const glassForward = viewingFront ? layout.glassFwdFront : layout.glassFwdRear;
      const glassA = toWorld(-layout.glassW, glassForward, layout.glassZ0);
      const glassB = toWorld(layout.glassW, glassForward, layout.glassZ0);
      const glassC = toWorld(layout.glassW, glassForward, layout.glassZ1);
      const glassD = toWorld(-layout.glassW, glassForward, layout.glassZ1);
      ctx.fillStyle = layout.glassColor;
      fillQuad(
        project(glassA.x, glassA.y, glassA.z),
        project(glassB.x, glassB.y, glassB.z),
        project(glassC.x, glassC.y, glassC.z),
        project(glassD.x, glassD.y, glassD.z)
      );

      const sideF0 = cabin.fwd - cabin.l * 0.72;
      const sideF1 = cabin.fwd + cabin.l * 0.72;
      const sideZ0 = cabin.z0 + 0.7;
      const sideZ1 = cabin.z1 - 0.7;
      const leftSide = -(cabin.w + 0.04);
      const rightSide = cabin.w + 0.04;
      const nearSide = nearSideSign < 0 ? leftSide : rightSide;
      const sa = toWorld(nearSide, sideF0, sideZ0);
      const sb = toWorld(nearSide, sideF1, sideZ0);
      const sc = toWorld(nearSide, sideF1, sideZ1);
      const sd = toWorld(nearSide, sideF0, sideZ1);
      ctx.fillStyle = layout.glassColor;
      fillQuad(
        project(sa.x, sa.y, sa.z),
        project(sb.x, sb.y, sb.z),
        project(sc.x, sc.y, sc.z),
        project(sd.x, sd.y, sd.z)
      );

      wheelSpots.filter(spot => spot.near).forEach(spot => drawWheel(spot, true));

      const missing = vehicle.maxHealth > 0
        ? 1 - vehicle.health / vehicle.maxHealth
        : 0;
      if (missing > 0.08) {
        const crackCount = Math.min(7, 1 + Math.floor(missing * 7));
        ctx.strokeStyle = `rgba(22, 18, 14, ${0.32 + missing * 0.5})`;
        ctx.lineWidth = 1.35;
        for (let i = 0; i < crackCount; i++) {
          const seed = scratchSeed(vehicle.id, i);
          const side = (seed - 0.5) * layout.crackSpan;
          const fwd = -layout.body.l + ((seed * 17 + i * 3) % (layout.body.l * 1.6));
          const a = toWorld(side, fwd, layout.crackZ);
          const b = toWorld(side + (seed > 0.5 ? 4 : -4), fwd + 5 + seed * 3, layout.crackZ);
          drawProjectedLine(
            project(a.x, a.y, a.z),
            project(b.x, b.y, b.z)
          );
        }
      }
    }

    function scratchSeed(id, i) {
      let hash = i * 9973;
      const text = String(id || 'car');
      for (let n = 0; n < text.length; n++) {
        hash = (hash * 33 + text.charCodeAt(n)) | 0;
      }
      return (Math.abs(hash) % 1000) / 1000;
    }

    function shadeHex(hex, amount) {
      const value = parseInt(hex.slice(1), 16);
      const red = Math.max(0, Math.min(255, (value >> 16) + amount));
      const green = Math.max(0, Math.min(255, ((value >> 8) & 255) + amount));
      const blue = Math.max(0, Math.min(255, (value & 255) + amount));
      return `#${[red, green, blue].map(c => c.toString(16).padStart(2, '0')).join('')}`;
    }

    function shadeColor(hex, amount) {
      const value = parseInt(hex.slice(1), 16);
      const red = Math.max(0, Math.min(255, (value >> 16) + amount));
      const green = Math.max(0, Math.min(255, ((value >> 8) & 255) + amount));
      const blue = Math.max(0, Math.min(255, (value & 255) + amount));
      return `rgb(${red}, ${green}, ${blue})`;
    }

    function drawPedestrian(wx, wy, angle, walkPhase, coatColor, skinColor, isPolice) {
      const stride = Math.sin(walkPhase) * 3;
      const worldPoint = (side, forward, z) => ({
        x: wx + Math.cos(angle) * forward - Math.sin(angle) * side,
        y: wy + Math.sin(angle) * forward + Math.cos(angle) * side,
        z
      });
      const projectedPoint = (side, forward, z) => {
        const point = worldPoint(side, forward, z);
        return project(point.x, point.y, point.z);
      };

      const ground = project(wx, wy, 0);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.beginPath();
      ctx.ellipse(ground.x, ground.y, isPolice ? 7 : 6, isPolice ? 3.4 : 3, 0, 0, Math.PI * 2);
      ctx.fill();

      const hip = projectedPoint(0, 0, 9);
      const shoulders = projectedPoint(0, 0, 18);
      const leftFoot = projectedPoint(-2, stride, 1);
      const rightFoot = projectedPoint(2, -stride, 1);

      ctx.strokeStyle = isPolice ? '#0c1018' : '#403d37';
      ctx.lineWidth = isPolice ? 3.5 : 3;
      drawProjectedLine(hip, leftFoot);
      drawProjectedLine(hip, rightFoot);

      if (isPolice) {
        // Classic dark-blue tunic body
        ctx.strokeStyle = POLICE_LOOK.coatEdge;
        ctx.lineWidth = 9;
        drawProjectedLine(hip, shoulders);
        ctx.strokeStyle = POLICE_LOOK.coat;
        ctx.lineWidth = 7;
        drawProjectedLine(hip, shoulders);

        // Dark belt
        const beltA = projectedPoint(-2.5, 0, 11);
        const beltB = projectedPoint(2.5, 0, 11);
        ctx.strokeStyle = '#0a0c12';
        ctx.lineWidth = 2.2;
        drawProjectedLine(beltA, beltB);

        // Gold chest accents (buttons / braid hint)
        const chestL = projectedPoint(-2.2, 0.5, 14.5);
        const chestR = projectedPoint(2.2, 0.5, 14.5);
        ctx.strokeStyle = POLICE_LOOK.accent;
        ctx.lineWidth = 1.6;
        drawProjectedLine(chestL, chestR);
        const chestL2 = projectedPoint(-1.8, 0.5, 16);
        const chestR2 = projectedPoint(1.8, 0.5, 16);
        drawProjectedLine(chestL2, chestR2);

        // White collar peek under helmet
        const collar = projectedPoint(0, 0, 19.5);
        ctx.fillStyle = POLICE_LOOK.collar;
        ctx.beginPath();
        ctx.arc(collar.x, collar.y, 2.2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.strokeStyle = coatColor;
        ctx.lineWidth = 6;
        drawProjectedLine(hip, shoulders);
      }

      const armSwing = stride * 0.7;
      if (isPolice) {
        ctx.strokeStyle = POLICE_LOOK.coat;
        ctx.lineWidth = 3.2;
        drawProjectedLine(shoulders, projectedPoint(-4.5, -armSwing, 12));
        drawProjectedLine(shoulders, projectedPoint(4.5, armSwing, 12));
        ctx.strokeStyle = skinColor;
        ctx.lineWidth = 2;
        drawProjectedLine(
          projectedPoint(-4.5, -armSwing, 12),
          projectedPoint(-5, -armSwing * 1.1, 10)
        );
        drawProjectedLine(
          projectedPoint(4.5, armSwing, 12),
          projectedPoint(5, armSwing * 1.1, 10)
        );
      } else {
        ctx.strokeStyle = skinColor;
        ctx.lineWidth = 2;
        drawProjectedLine(shoulders, projectedPoint(-4, -armSwing, 11));
        drawProjectedLine(shoulders, projectedPoint(4, armSwing, 11));
      }

      const head = projectedPoint(0, 0, 23);
      ctx.fillStyle = skinColor;
      ctx.beginPath();
      ctx.arc(head.x, head.y, 3.8, 0, Math.PI * 2);
      ctx.fill();

      if (isPolice) {
        // Custodian helmet — taller dome + brim
        const brimL = projectedPoint(-5.2, 1.2, 24.2);
        const brimR = projectedPoint(5.2, 1.2, 24.2);
        ctx.strokeStyle = POLICE_LOOK.hat;
        ctx.lineWidth = 3.4;
        drawProjectedLine(brimL, brimR);

        const dome = projectedPoint(0, 0, 27.5);
        ctx.fillStyle = POLICE_LOOK.hat;
        ctx.beginPath();
        ctx.ellipse(dome.x, dome.y, 5.2, 3.4, 0, 0, Math.PI * 2);
        ctx.fill();

        // Bold Sillitoe check band
        const bandL = projectedPoint(-4.4, 0.6, 25.4);
        const bandR = projectedPoint(4.4, 0.6, 25.4);
        ctx.lineWidth = 2.4;
        for (let i = 0; i < 7; i++) {
          const t0 = i / 7;
          const t1 = (i + 0.62) / 7;
          const ax = bandL.x + (bandR.x - bandL.x) * t0;
          const ay = bandL.y + (bandR.y - bandL.y) * t0;
          const bx = bandL.x + (bandR.x - bandL.x) * t1;
          const by = bandL.y + (bandR.y - bandL.y) * t1;
          ctx.strokeStyle = i % 2 === 0 ? POLICE_LOOK.checkLight : POLICE_LOOK.checkDark;
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.lineTo(bx, by);
          ctx.stroke();
        }
      }

      const facing = projectedPoint(0, 5, 22);
      ctx.strokeStyle = isPolice ? '#ffffff' : '#ead8ae';
      ctx.lineWidth = 1.5;
      drawProjectedLine(head, facing);
    }

    // --- ANIMATED MINIMAP ---
    const MINIMAP_SIZE = 160;
    const MINIMAP_VIEW_TILES = 34;

    function drawMinimap() {
      const size = MINIMAP_SIZE;
      const center = size / 2;
      const radius = center - 1;
      const viewWorld = MINIMAP_VIEW_TILES * TILE_SIZE;
      const scale = size / viewWorld;
      const ca = Math.cos(player.angle);
      const sa = Math.sin(player.angle);

      // Player-forward is up; world -Y is north.
      const worldToMini = (wx, wy) => {
        const dx = wx - player.x;
        const dy = wy - player.y;
        const localForward = dx * ca + dy * sa;
        const localRight = -dx * sa + dy * ca;
        return {
          x: center + localRight * scale,
          y: center - localForward * scale
        };
      };

      miniCtx.clearRect(0, 0, size, size);
      miniCtx.save();
      miniCtx.beginPath();
      miniCtx.arc(center, center, radius, 0, Math.PI * 2);
      miniCtx.clip();

      miniCtx.fillStyle = 'rgba(43, 38, 31, 0.96)';
      miniCtx.fillRect(0, 0, size, size);

      const pTileX = Math.floor(player.x / TILE_SIZE);
      const pTileY = Math.floor(player.y / TILE_SIZE);
      const tileRadius = Math.ceil(MINIMAP_VIEW_TILES / 2) + 2;
      const startC = Math.max(0, pTileX - tileRadius);
      const endC = Math.min(MAP_SIZE - 1, pTileX + tileRadius);
      const startR = Math.max(0, pTileY - tileRadius);
      const endR = Math.min(MAP_SIZE - 1, pTileY + tileRadius);

      for (let r = startR; r <= endR; r++) {
        for (let c = startC; c <= endC; c++) {
          const type = map[r][c];
          const pos = worldToMini(c * TILE_SIZE, r * TILE_SIZE);
          const posTR = worldToMini((c + 1) * TILE_SIZE, r * TILE_SIZE);
          const posBR = worldToMini((c + 1) * TILE_SIZE, (r + 1) * TILE_SIZE);
          const posBL = worldToMini(c * TILE_SIZE, (r + 1) * TILE_SIZE);
          miniCtx.fillStyle = type === 1
            ? '#29251f'
            : (type === PAVEMENT_TILE ? '#b9ad97' : (type > 1 ? '#9b8068' : '#355936'));
          miniCtx.beginPath();
          miniCtx.moveTo(pos.x, pos.y);
          miniCtx.lineTo(posTR.x, posTR.y);
          miniCtx.lineTo(posBR.x, posBR.y);
          miniCtx.lineTo(posBL.x, posBL.y);
          miniCtx.closePath();
          miniCtx.fill();
        }
      }

      vehicles.forEach(vehicle => {
        const pos = worldToMini(vehicle.x, vehicle.y);
        if (Math.hypot(pos.x - center, pos.y - center) > radius + 4) return;
        if (vehicle.isPoliceCar) {
          miniCtx.fillStyle = '#d23a32';
          miniCtx.fillRect(pos.x - 1.5, pos.y - 1.5, 3.5, 3.5);
        } else if (vehicle.isBike) {
          miniCtx.fillStyle = BIKE.minimap;
          miniCtx.fillRect(pos.x - 0.5, pos.y - 0.5, 2, 2);
        } else {
          miniCtx.fillStyle = vehicle.color;
          miniCtx.fillRect(pos.x - 1.5, pos.y - 1.5, 3, 3);
        }
      });

      pedestrians.forEach(pedestrian => {
        const pos = worldToMini(pedestrian.x, pedestrian.y);
        if (Math.hypot(pos.x - center, pos.y - center) > radius + 4) return;
        if (pedestrian.isPolice) {
          miniCtx.fillStyle = '#d23a32';
          miniCtx.fillRect(pos.x - 1, pos.y - 1, 2.5, 2.5);
        } else {
          miniCtx.fillStyle = 'rgba(200, 198, 192, 0.55)';
          miniCtx.fillRect(pos.x, pos.y, 1.5, 1.5);
        }
      });

      if (net.players.size > 0) {
        net.players.forEach(rp => {
          if (rp.wasted) return;
          const pos = worldToMini(rp.x, rp.y);
          const dx = pos.x - center;
          const dy = pos.y - center;
          const dist = Math.hypot(dx, dy);
          let mx = pos.x;
          let my = pos.y;
          const maxR = radius - 4;
          const clamped = dist > maxR;
          if (clamped) {
            mx = center + (dx / dist) * maxR;
            my = center + (dy / dist) * maxR;
          }
          miniCtx.fillStyle = rp.coat || '#5bc0eb';
          miniCtx.strokeStyle = '#181410';
          miniCtx.lineWidth = 1.5;
          miniCtx.beginPath();
          miniCtx.arc(mx, my, clamped ? 3 : 3.5, 0, Math.PI * 2);
          miniCtx.fill();
          miniCtx.stroke();
        });
      }

      // Player stays centered; heading always points up.
      miniCtx.fillStyle = '#d2a84f';
      miniCtx.beginPath();
      miniCtx.arc(center, center, 3.5, 0, Math.PI * 2);
      miniCtx.fill();
      miniCtx.strokeStyle = '#d2a84f';
      miniCtx.lineWidth = 2;
      miniCtx.beginPath();
      miniCtx.moveTo(center, center);
      miniCtx.lineTo(center, center - 8);
      miniCtx.stroke();

      miniCtx.restore();

      miniCtx.strokeStyle = '#b7a78e';
      miniCtx.lineWidth = 2;
      miniCtx.beginPath();
      miniCtx.arc(center, center, radius, 0, Math.PI * 2);
      miniCtx.stroke();

      // N on circumference toward world north (-Y)
      const nRight = -ca;
      const nUp = sa;
      const nLen = Math.hypot(nRight, nUp) || 1;
      const nX = center + (nRight / nLen) * (radius - 11);
      const nY = center + (nUp / nLen) * (radius - 11);
      miniCtx.fillStyle = 'rgba(20, 16, 12, 0.55)';
      miniCtx.beginPath();
      miniCtx.arc(nX, nY, 9, 0, Math.PI * 2);
      miniCtx.fill();
      miniCtx.fillStyle = '#f3eee3';
      miniCtx.font = 'bold 14px "Courier New", Courier, monospace';
      miniCtx.textAlign = 'center';
      miniCtx.textBaseline = 'middle';
      miniCtx.fillText('N', nX, nY + 0.5);
      miniCtx.textAlign = 'start';
      miniCtx.textBaseline = 'alphabetic';
    }

    function updateHud() {
      document.getElementById('hp-label').textContent = String(Math.max(0, Math.ceil(player.hp)));
      const carRow = document.getElementById('car-hp-row');
      if (activeVehicle && !activeVehicle.isBike) {
        carRow.style.display = 'block';
        document.getElementById('car-class-label').textContent = getCarSpec(activeVehicle).label;
        document.getElementById('car-hp-label').textContent =
          `${Math.max(0, Math.ceil(activeVehicle.health))} / ${activeVehicle.maxHealth}`;
      } else {
        carRow.style.display = 'none';
      }
      if (isMobile && typeof updateMobileHudAndControls === 'function') {
        updateMobileHudAndControls();
      }
    }

    // --- MULTIPLAYER NETWORKING (P2P WebRTC / PeerJS, Level 2) ---
    function netRound1(n) {
      return Math.round((n || 0) * 10) / 10;
    }

    function netRound3(n) {
      return Math.round((n || 0) * 1000) / 1000;
    }

    function netSendToPeer(peerId, msg) {
      const conn = net.conns.get(peerId);
      if (conn && conn.open) {
        try { conn.send(msg); } catch (_) {}
      }
    }

    function netBroadcast(msg, excludePeerId = null) {
      net.conns.forEach((conn, peerId) => {
        if (peerId === excludePeerId || !conn.open) return;
        try { conn.send(msg); } catch (_) {}
      });
    }

    function netSendToHost(msg) {
      if (net.hostConn && net.hostConn.open) {
        try { net.hostConn.send(msg); } catch (_) {}
      }
    }

    function generateRoomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 4; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
      }
      return code;
    }

    function modeToCode(mode) {
      if (mode === 'driving') return 1;
      if (mode === 'biking') return 2;
      return 0;
    }

    function codeToMode(code) {
      if (code === 1) return 'driving';
      if (code === 2) return 'biking';
      return 'walking';
    }

    function buildRoster() {
      const list = [{
        id: net.localId,
        name: net.localName,
        coat: net.localCoat,
        skin: playerSkin,
        isHost: true
      }];
      net.players.forEach(rp => {
        list.push({
          id: rp.id,
          name: rp.name,
          coat: rp.coat,
          skin: rp.skin,
          isHost: false
        });
      });
      return list;
    }

    function buildSnapshot() {
      const pList = [[
        net.localId,
        netRound1(player.x),
        netRound1(player.y),
        netRound3(player.angle),
        modeToCode(player.mode),
        netRound1(player.walkPhase),
        activeVehicle ? activeVehicle.id : null,
        Math.round(player.hp),
        wasted ? 1 : 0,
        wantedLevel
      ]];
      net.players.forEach(rp => {
        pList.push([
          rp.id,
          netRound1(rp.x),
          netRound1(rp.y),
          netRound3(rp.angle),
          modeToCode(rp.mode),
          netRound1(rp.walkPhase || 0),
          rp.vehicleId || null,
          Math.round(rp.hp),
          rp.wasted ? 1 : 0,
          rp.wantedLevel || 0
        ]);
      });

      const vList = [];
      for (let i = 0; i < vehicles.length; i++) {
        const v = vehicles[i];
        if (!v || v.dead) continue;
        const flags = (v.isBike ? 1 : 0) | (v.isPoliceCar ? 2 : 0) | (v.parked ? 4 : 0);
        vList.push([
          v.id,
          netRound1(v.x),
          netRound1(v.y),
          netRound3(v.angle),
          netRound1(v.speed),
          Math.round(v.health || 0),
          Math.round(v.maxHealth || 0),
          v.carClass || 'normal',
          v.color || '#f2f0ea',
          flags,
          v.driverId || null
        ]);
      }

      const dList = [];
      for (let i = 0; i < pedestrians.length; i++) {
        const ped = pedestrians[i];
        dList.push([
          ped.id,
          netRound1(ped.x),
          netRound1(ped.y),
          netRound3(ped.angle),
          netRound1(ped.walkPhase || 0),
          ped.coat,
          ped.skin,
          ped.isPolice ? 1 : 0
        ]);
      }

      const bList = [];
      for (let i = 0; i < bullets.length; i++) {
        const b = bullets[i];
        bList.push([
          netRound1(b.x),
          netRound1(b.y),
          netRound1(b.vx),
          netRound1(b.vy),
          b.owner === 'police' ? 1 : 0
        ]);
      }

      return {
        t: 'snap',
        tick: simulationTick,
        p: pList,
        v: vList,
        d: dList,
        b: bList
      };
    }

    function buildWelcomePacket(peerId, assignedCoat, spawn) {
      return {
        t: 'welcome',
        yourId: peerId,
        yourCoat: assignedCoat,
        spawn,
        billboards: billboards.map(b => ({
          r: b.r, c: b.c, wallIndex: b.wallIndex,
          u0: b.u0, u1: b.u1, z0: b.z0, z1: b.z1,
          ax: b.ax, ay: b.ay, bx: b.bx, by: b.by,
          ox: b.ox, oy: b.oy
        })),
        parkingBays: parkingBays.map(b => ({
          x: b.x, y: b.y, w: b.w, h: b.h,
          angle: b.angle, side: b.side, cx: b.cx, cy: b.cy,
          occupied: b.occupied
        })),
        bikeBays: bikeBays.map(b => ({
          id: b.id, x: b.x, y: b.y, w: b.w, h: b.h,
          angle: b.angle, side: b.side, bikeAngle: b.bikeAngle,
          cx: b.cx, cy: b.cy,
          slots: b.slots.map(s => ({ x: s.x, y: s.y, angle: s.angle, bikeId: s.bikeId }))
        })),
        cabinets: cabinets.map(c => ({
          x: c.x, y: c.y, w: c.w, h: c.h, height: c.height, side: c.side
        })),
        roster: buildRoster(),
        snap: buildSnapshot()
      };
    }

    function applyRosterList(roster) {
      if (!Array.isArray(roster)) return;
      const seen = new Set();
      roster.forEach(entry => {
        if (!entry || entry.id === net.localId) return;
        seen.add(entry.id);
        let rp = net.players.get(entry.id);
        if (!rp) {
          rp = {
            id: entry.id,
            name: entry.name || 'Player',
            coat: entry.coat || '#3d7a8c',
            skin: entry.skin || skinTones[0],
            isHost: !!entry.isHost,
            x: player.x,
            y: player.y,
            angle: 0,
            netTargetX: player.x,
            netTargetY: player.y,
            netTargetAngle: 0,
            walkPhase: 0,
            netTargetWalkPhase: 0,
            mode: 'walking',
            vehicleId: null,
            hp: PLAYER_MAX_HP,
            wasted: false,
            wantedLevel: 0
          };
          net.players.set(entry.id, rp);
        } else {
          rp.name = entry.name || rp.name;
          rp.coat = entry.coat || rp.coat;
          rp.skin = entry.skin || rp.skin;
          rp.isHost = !!entry.isHost;
        }
      });
      Array.from(net.players.keys()).forEach(id => {
        if (!seen.has(id)) net.players.delete(id);
      });
      renderMpPlayersList();
    }

    function applyGuestSnapshot(snap, immediate) {
      if (!snap) return;
      if (typeof snap.tick === 'number') {
        if (immediate || Math.abs(snap.tick - simulationTick) > 6) {
          simulationTick = snap.tick;
        }
      }

      // 1. Vehicles
      if (Array.isArray(snap.v)) {
        const vehById = new Map();
        for (let i = 0; i < vehicles.length; i++) {
          vehById.set(vehicles[i].id, vehicles[i]);
        }
        const nextVehicles = [];
        for (let i = 0; i < snap.v.length; i++) {
          const row = snap.v[i];
          const [id, x, y, angle, speed, health, maxHealth, carClass, color, flags, driverId] = row;
          const isBike = !!(flags & 1);
          const isPoliceCar = !!(flags & 2);
          const parked = !!(flags & 4);
          let v = vehById.get(id);
          if (!v) {
            v = {
              id,
              type: isBike ? 'bike' : 'car',
              isBike,
              isPoliceCar,
              x, y, angle, dir: angle,
              speed,
              color,
              ai: false,
              parked,
              collisionCooldown: 0,
              driverId: driverId || null,
              netTargetX: x,
              netTargetY: y,
              netTargetAngle: angle
            };
            if (isBike) {
              v.radius = BIKE.radius;
              v.driveRadius = BIKE.radius;
              v.maxHealth = maxHealth || 40;
              v.health = health != null ? health : 40;
            } else {
              assignCarClass(v, carClass || 'normal', false);
              v.maxHealth = maxHealth || v.maxHealth;
              v.health = health != null ? health : v.health;
            }
          } else {
            v.isBike = isBike;
            v.isPoliceCar = isPoliceCar;
            v.parked = parked;
            v.color = color;
            v.health = health;
            v.maxHealth = maxHealth || v.maxHealth;
            v.driverId = driverId || null;
            if (!isBike && v.carClass !== carClass) {
              assignCarClass(v, carClass || 'normal', false);
              v.health = health;
              v.maxHealth = maxHealth || v.maxHealth;
            }
            if (v !== activeVehicle) {
              v.speed = speed;
              v.netTargetX = x;
              v.netTargetY = y;
              v.netTargetAngle = angle;
              if (immediate) {
                v.x = x;
                v.y = y;
                v.angle = angle;
                v.dir = angle;
              }
            }
          }
          nextVehicles.push(v);
        }
        vehicles.length = 0;
        for (let i = 0; i < nextVehicles.length; i++) vehicles.push(nextVehicles[i]);
        if (activeVehicle && !vehicles.includes(activeVehicle)) {
          ejectPlayerFromCar(activeVehicle);
        }
      }

      // 2. Pedestrians
      if (Array.isArray(snap.d)) {
        const pedById = new Map();
        for (let i = 0; i < pedestrians.length; i++) {
          pedById.set(pedestrians[i].id, pedestrians[i]);
        }
        const nextPeds = [];
        for (let i = 0; i < snap.d.length; i++) {
          const [id, x, y, angle, walkPhase, coat, skin, isPolice] = snap.d[i];
          let ped = pedById.get(id);
          if (!ped) {
            ped = {
              id, x, y, angle, walkPhase,
              radius: 3,
              coat, skin,
              isPolice: !!isPolice,
              netTargetX: x,
              netTargetY: y,
              netTargetAngle: angle,
              netTargetWalkPhase: walkPhase
            };
          } else {
            ped.coat = coat;
            ped.skin = skin;
            ped.isPolice = !!isPolice;
            ped.netTargetX = x;
            ped.netTargetY = y;
            ped.netTargetAngle = angle;
            ped.netTargetWalkPhase = walkPhase;
            if (immediate) {
              ped.x = x;
              ped.y = y;
              ped.angle = angle;
              ped.walkPhase = walkPhase;
            }
          }
          nextPeds.push(ped);
        }
        pedestrians.length = 0;
        for (let i = 0; i < nextPeds.length; i++) pedestrians.push(nextPeds[i]);
      }

      // 3. Players
      if (Array.isArray(snap.p)) {
        let starsChanged = false;
        for (let i = 0; i < snap.p.length; i++) {
          const [id, x, y, angle, modeCode, walkPhase, vehicleId, hp, isWasted, stars] = snap.p[i];
          if (id === net.localId) {
            if (stars !== wantedLevel) {
              setWantedLevel(stars);
              starsChanged = true;
            }
            continue;
          }
          let rp = net.players.get(id);
          if (!rp) {
            rp = {
              id,
              name: 'Player',
              coat: '#3d7a8c',
              skin: skinTones[0],
              isHost: false,
              x, y, angle,
              walkPhase,
              netTargetX: x,
              netTargetY: y,
              netTargetAngle: angle,
              netTargetWalkPhase: walkPhase,
              mode: codeToMode(modeCode),
              vehicleId: vehicleId || null,
              hp,
              wasted: !!isWasted,
              wantedLevel: stars || 0
            };
            net.players.set(id, rp);
            starsChanged = true;
          } else {
            if (rp.wantedLevel !== (stars || 0)) starsChanged = true;
            rp.mode = codeToMode(modeCode);
            rp.vehicleId = vehicleId || null;
            rp.hp = hp;
            rp.wasted = !!isWasted;
            rp.wantedLevel = stars || 0;
            rp.netTargetX = x;
            rp.netTargetY = y;
            rp.netTargetAngle = angle;
            rp.netTargetWalkPhase = walkPhase;
            if (immediate) {
              rp.x = x;
              rp.y = y;
              rp.angle = angle;
              rp.walkPhase = walkPhase;
            }
          }
        }
        if (starsChanged) renderMpPlayersList();
      }

      // 4. Bullets
      if (Array.isArray(snap.b)) {
        bullets.length = 0;
        for (let i = 0; i < snap.b.length; i++) {
          const [x, y, vx, vy, ownerCode] = snap.b[i];
          bullets.push({
            owner: ownerCode === 1 ? 'police' : 'player',
            x, y, vx, vy,
            life: 24,
            radius: COMBAT.bulletRadius
          });
        }
      }
    }

    function handleHostMessage(conn, msg) {
      if (!msg || typeof msg !== 'object') return;
      const peerId = conn.peer;

      if (msg.t === 'hello') {
        const spawn = pickSafePlayerSpawn();
        const assignedCoat = MP_COAT_PALETTE[net.coatIndex % MP_COAT_PALETTE.length];
        net.coatIndex++;
        const cleanName = String(msg.name || 'Player').trim().slice(0, 14) || 'Player';
        const rp = {
          id: peerId,
          name: cleanName,
          coat: assignedCoat,
          skin: skinTones.includes(msg.skin) ? msg.skin : skinTones[0],
          isHost: false,
          x: spawn.x,
          y: spawn.y,
          angle: spawn.angle,
          vx: 0,
          vy: 0,
          speed: 0,
          motionSpeed: 0,
          mode: 'walking',
          walkPhase: 0,
          vehicleId: null,
          hp: PLAYER_MAX_HP,
          wasted: false,
          hitCooldown: 0,
          blastCooldown: 0,
          gunHitCooldown: 0,
          wantedLevel: 0,
          wantedCoolTimer: 0
        };
        net.players.set(peerId, rp);
        netSendToPeer(peerId, buildWelcomePacket(peerId, assignedCoat, spawn));
        netBroadcast({ t: 'roster', roster: buildRoster() }, peerId);
        renderMpPlayersList();
        setMpStatus(`${cleanName} joined the city`);
        return;
      }

      const rp = net.players.get(peerId);
      if (!rp) return;

      if (msg.t === 'state') {
        if (rp.wasted) return;
        rp.x = Number(msg.x) || rp.x;
        rp.y = Number(msg.y) || rp.y;
        rp.angle = Number(msg.a) || 0;
        rp.vx = Number(msg.vx) || 0;
        rp.vy = Number(msg.vy) || 0;
        rp.speed = Number(msg.sp) || 0;
        rp.motionSpeed = Number(msg.ms) || 0;
        rp.walkPhase = Number(msg.wp) || 0;
        if (rp.vehicleId) {
          const v = vehicles.find(item => item.id === rp.vehicleId);
          if (v && !v.dead && v.driverId === peerId) {
            v.x = rp.x;
            v.y = rp.y;
            v.angle = rp.angle;
            v.dir = rp.angle;
            v.speed = rp.speed;
          }
        }
      } else if (msg.t === 'req_enter') {
        if (rp.wasted || rp.vehicleId) return;
        const v = vehicles.find(item => item.id === msg.vehicleId);
        if (!v || v.dead || v.driverId) return;
        const maxDist = v.isBike ? BIKE.enterDist + 40 : 95;
        if (Math.hypot(rp.x - v.x, rp.y - v.y) > maxDist) return;

        if (v.isBike) {
          clearBikeSlot(v);
          v.ai = false;
          v.parked = false;
          v.driverId = peerId;
          rp.vehicleId = v.id;
          rp.mode = 'biking';
          rp.x = v.x;
          rp.y = v.y;
          netSendToPeer(peerId, {
            t: 'enter_ok',
            vehicleId: v.id,
            isBike: true,
            x: v.x,
            y: v.y,
            angle: v.angle,
            speed: 0,
            health: v.health,
            maxHealth: v.maxHealth
          });
        } else {
          if (!v.isPoliceCar && !v.parked && Math.abs(v.speed) > 0.35) {
            spawnFleeingDriver(v);
          }
          v.ai = false;
          v.parked = false;
          v.driverId = peerId;
          if (v.isPoliceCar) addWantedForPlayer(peerId, 1);
          toughenPlayerCar(v);
          rp.vehicleId = v.id;
          rp.mode = 'driving';
          rp.x = v.x;
          rp.y = v.y;
          rp.angle = v.angle;
          rp.speed = v.speed;
          netSendToPeer(peerId, {
            t: 'enter_ok',
            vehicleId: v.id,
            isBike: false,
            carClass: v.carClass,
            x: v.x,
            y: v.y,
            angle: v.angle,
            speed: v.speed,
            health: v.health,
            maxHealth: v.maxHealth
          });
        }
      } else if (msg.t === 'exit_vehicle') {
        const v = vehicles.find(item => item.id === msg.vehicleId);
        if (v && v.driverId === peerId) {
          v.driverId = null;
          if (typeof msg.x === 'number' && typeof msg.y === 'number') {
            v.x = msg.x;
            v.y = msg.y;
          }
          if (typeof msg.angle === 'number') {
            v.angle = msg.angle;
            v.dir = msg.angle;
          }
          v.speed = 0;
          if (v.isBike) tryParkBikeInNearbyBay(v);
          else v.parked = isInParkingBay(v.x, v.y);
        }
        rp.vehicleId = null;
        rp.mode = 'walking';
        rp.speed = 0;
        rp.vx = 0;
        rp.vy = 0;
      } else if (msg.t === 'shoot') {
        if (rp.wasted) return;
        fireBullet('player', Number(msg.x) || rp.x, Number(msg.y) || rp.y, Number(msg.angle) || rp.angle, COMBAT.bulletSpeed, peerId);
      } else if (msg.t === 'respawn') {
        rp.wasted = false;
        rp.hp = PLAYER_MAX_HP;
        rp.wantedLevel = 0;
        rp.wantedCoolTimer = 0;
        rp.hitCooldown = 30;
        rp.blastCooldown = 30;
        rp.gunHitCooldown = 20;
        rp.vehicleId = null;
        rp.mode = 'walking';
        rp.x = Number(msg.x) || rp.x;
        rp.y = Number(msg.y) || rp.y;
        rp.angle = Number(msg.angle) || 0;
        rp.speed = 0;
        rp.vx = 0;
        rp.vy = 0;
        renderMpPlayersList();
      } else if (msg.t === 'fx_skid') {
        skidMarks.push({ x: msg.x, y: msg.y, angle: msg.a, life: SKID_LIFE });
        if (skidMarks.length > SKID_MAX) skidMarks.splice(0, skidMarks.length - SKID_MAX);
        netBroadcast(msg, peerId);
      } else if (msg.t === 'rename') {
        rp.name = String(msg.name || 'Player').trim().slice(0, 14) || 'Player';
        netBroadcast({ t: 'roster', roster: buildRoster() });
        renderMpPlayersList();
      }
    }

    function handleGuestMessage(msg) {
      if (!msg || typeof msg !== 'object') return;
      if (msg.t === 'welcome') {
        net.localCoat = msg.yourCoat || '#3d7a8c';
        if (Array.isArray(msg.billboards)) {
          billboards.length = 0;
          msg.billboards.forEach(b => billboards.push({
            ...b,
            sparkWait: 240 + Math.floor(Math.random() * 420),
            burstGlow: 0,
            sparks: []
          }));
        }
        if (Array.isArray(msg.parkingBays)) {
          parkingBays.length = 0;
          msg.parkingBays.forEach(b => parkingBays.push({ ...b }));
        }
        if (Array.isArray(msg.bikeBays)) {
          bikeBays.length = 0;
          msg.bikeBays.forEach(b => bikeBays.push({
            ...b,
            slots: b.slots.map(s => ({ ...s }))
          }));
        }
        if (Array.isArray(msg.cabinets)) {
          cabinets.length = 0;
          msg.cabinets.forEach(c => cabinets.push({ ...c }));
        }
        activeVehicle = null;
        restoreWalkDriveStats();
        wasted = false;
        player.hp = PLAYER_MAX_HP;
        gun.ammo = COMBAT.magSize;
        gun.reloadTimer = 0;
        gun.reloadMax = 0;
        setWantedLevel(0);
        document.getElementById('wasted-overlay').style.display = 'none';
        if (msg.spawn) {
          player.angle = msg.spawn.angle || 0;
          putPlayerOnFoot(msg.spawn.x, msg.spawn.y);
        }
        applyRosterList(msg.roster);
        applyGuestSnapshot(msg.snap, true);
        updateMpUiState();
        setMpStatus(`Connected to room ${net.roomCode}`);
      } else if (msg.t === 'roster') {
        applyRosterList(msg.roster);
      } else if (msg.t === 'snap') {
        applyGuestSnapshot(msg, false);
      } else if (msg.t === 'enter_ok') {
        const v = vehicles.find(item => item.id === msg.vehicleId);
        if (!v) return;
        v.driverId = net.localId;
        v.parked = false;
        v.ai = false;
        v.health = msg.health != null ? msg.health : v.health;
        v.maxHealth = msg.maxHealth || v.maxHealth;
        if (msg.isBike) {
          clearBikeSlot(v);
          activeVehicle = v;
          player.mode = 'biking';
          player.x = v.x;
          player.y = v.y;
          player.cameraEasing = false;
          player.cameraAngle = player.angle;
          player.steerRate = 0;
          player.speed = 0;
          player.vx = 0;
          player.vy = 0;
          player.drifting = false;
          v.angle = player.angle;
        } else {
          if (msg.carClass && v.carClass !== msg.carClass) {
            assignCarClass(v, msg.carClass, true);
            v.health = msg.health != null ? msg.health : v.health;
            v.maxHealth = msg.maxHealth || v.maxHealth;
          }
          activeVehicle = v;
          applyDriveStatsFromCar(activeVehicle);
          player.mode = 'driving';
          player.x = msg.x != null ? msg.x : v.x;
          player.y = msg.y != null ? msg.y : v.y;
          player.angle = msg.angle != null ? msg.angle : v.angle;
          player.cameraEasing = true;
          player.steerRate = 0;
          player.speed = msg.speed || 0;
          player.vx = Math.cos(player.angle) * player.speed;
          player.vy = Math.sin(player.angle) * player.speed;
          player.drifting = false;
        }
      } else if (msg.t === 'eject') {
        if (activeVehicle && (!msg.vehicleId || activeVehicle.id === msg.vehicleId)) {
          activeVehicle.driverId = null;
          activeVehicle = null;
          restoreWalkDriveStats();
          putPlayerOnFoot(msg.x, msg.y);
        }
      } else if (msg.t === 'hit') {
        if (typeof msg.hp === 'number') player.hp = Math.max(0, msg.hp);
        else player.hp = Math.max(0, player.hp - (msg.amount || 0));
        if (msg.kind === 'gun') addCameraShake(SHAKE.tinyGunHit);
        else if (msg.kind === 'car') addCameraShake(SHAKE.mediumCrash);
        if (player.mode === 'walking' && msg.shoveX != null && msg.shoveY != null) {
          if (canWalkAt(msg.shoveX, msg.shoveY, player.radius)) {
            player.x = msg.shoveX;
            player.y = msg.shoveY;
          }
        }
        if (player.hp <= 0) triggerWasted();
      } else if (msg.t === 'car_bump') {
        if (activeVehicle && activeVehicle.id === msg.vehicleId) {
          player.speed = msg.speed;
          player.vx = Math.cos(player.angle) * player.speed;
          player.vy = Math.sin(player.angle) * player.speed;
          player.drifting = false;
          if (typeof msg.x === 'number' && typeof msg.y === 'number') {
            player.x += (msg.x - player.x) * 0.5;
            player.y += (msg.y - player.y) * 0.5;
            activeVehicle.x = player.x;
            activeVehicle.y = player.y;
          }
          addCameraShake(msg.shake || SHAKE.mediumCrash);
        }
      } else if (msg.t === 'shake') {
        addCameraShake(msg.amount || SHAKE.tinyGunHit);
      } else if (msg.t === 'wanted') {
        setWantedLevel(msg.level || 0);
        renderMpPlayersList();
      } else if (msg.t === 'fx_boom') {
        spawnExplosionFx(msg.x, msg.y);
        const dist = Math.hypot(player.x - msg.x, player.y - msg.y);
        if (dist < SHAKE.blastNear) {
          const falloff = 1 - dist / SHAKE.blastNear;
          addCameraShake(SHAKE.bigBlast * (0.4 + 0.6 * falloff));
        }
      } else if (msg.t === 'fx_muzzle') {
        spawnMuzzleFlash(msg.x, msg.y, msg.angle);
      } else if (msg.t === 'fx_skid') {
        skidMarks.push({ x: msg.x, y: msg.y, angle: msg.a, life: SKID_LIFE });
        if (skidMarks.length > SKID_MAX) skidMarks.splice(0, skidMarks.length - SKID_MAX);
      }
    }

    function netHostTick() {
      net.frameCounter++;
      if (net.frameCounter % 3 === 0 && net.conns.size > 0) {
        netBroadcast(buildSnapshot());
      }
    }

    function netGuestTick() {
      net.frameCounter++;
      simulationTick++;

      // Send local player state at ~30Hz
      if (net.frameCounter % 2 === 0 && !wasted) {
        netSendToHost({
          t: 'state',
          x: netRound1(player.x),
          y: netRound1(player.y),
          a: netRound3(player.angle),
          vx: netRound1(player.vx),
          vy: netRound1(player.vy),
          sp: netRound1(player.speed),
          ms: netRound1(player.motionSpeed),
          wp: netRound1(player.walkPhase)
        });
      }

      // Smoothly interpolate all non-local vehicles
      const lerp = 0.35;
      for (let i = 0; i < vehicles.length; i++) {
        const v = vehicles[i];
        if (!v || v === activeVehicle) {
          if (v && v.maxHealth && v.health / v.maxHealth < 0.3 && Math.random() < 0.38) {
            emitCarSmoke(v);
          }
          continue;
        }
        if (v.netTargetX != null) {
          const dx = v.netTargetX - v.x;
          const dy = v.netTargetY - v.y;
          if (dx * dx + dy * dy > 180 * 180) {
            v.x = v.netTargetX;
            v.y = v.netTargetY;
            v.angle = v.netTargetAngle;
          } else {
            v.x += dx * lerp;
            v.y += dy * lerp;
            v.angle += shortestAngleDiff(v.angle, v.netTargetAngle) * lerp;
          }
          v.dir = v.angle;
        }
        if (v.maxHealth && v.health / v.maxHealth < 0.3 && Math.random() < 0.38) {
          emitCarSmoke(v);
        }
      }

      // Smoothly interpolate pedestrians
      for (let i = 0; i < pedestrians.length; i++) {
        const ped = pedestrians[i];
        if (ped.netTargetX == null) continue;
        const dx = ped.netTargetX - ped.x;
        const dy = ped.netTargetY - ped.y;
        if (dx * dx + dy * dy > 140 * 140) {
          ped.x = ped.netTargetX;
          ped.y = ped.netTargetY;
          ped.angle = ped.netTargetAngle;
          ped.walkPhase = ped.netTargetWalkPhase;
        } else {
          ped.x += dx * lerp;
          ped.y += dy * lerp;
          ped.angle += shortestAngleDiff(ped.angle, ped.netTargetAngle) * lerp;
          ped.walkPhase += (ped.netTargetWalkPhase - ped.walkPhase) * lerp;
        }
      }

      // Smoothly interpolate remote players (bind to vehicle when riding)
      net.players.forEach(rp => {
        if (rp.vehicleId) {
          const v = vehicles.find(item => item.id === rp.vehicleId);
          if (v) {
            rp.x = v.x;
            rp.y = v.y;
            rp.angle = v.angle;
            return;
          }
        }
        if (rp.netTargetX == null) return;
        const dx = rp.netTargetX - rp.x;
        const dy = rp.netTargetY - rp.y;
        if (dx * dx + dy * dy > 180 * 180) {
          rp.x = rp.netTargetX;
          rp.y = rp.netTargetY;
          rp.angle = rp.netTargetAngle;
          rp.walkPhase = rp.netTargetWalkPhase || 0;
        } else {
          rp.x += dx * lerp;
          rp.y += dy * lerp;
          rp.angle += shortestAngleDiff(rp.angle, rp.netTargetAngle) * lerp;
          rp.walkPhase += ((rp.netTargetWalkPhase || 0) - (rp.walkPhase || 0)) * lerp;
        }
      });

      // Advance client-side bullet visuals & FX between snapshots
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        if (b.life <= 0 || bulletHitsSolid(b.x, b.y) || !isOnPlayableMap(b.x, b.y)) {
          bullets.splice(i, 1);
        }
      }
      for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
        muzzleFlashes[i].life--;
        if (muzzleFlashes[i].life <= 0) muzzleFlashes.splice(i, 1);
      }
      updateSkidMarks();
      updateBillboardEffects();
      updateWreckFx();
    }

    function drawRemotePlayerLabels() {
      if (net.players.size === 0) return;
      ctx.save();
      ctx.font = 'bold 11px "Courier New", Courier, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      net.players.forEach(rp => {
        if (rp.wasted) return;
        const z = rp.mode === 'driving' ? 24 : 28;
        const pos = project(rp.x, rp.y, z);
        if (pos.x < -60 || pos.x > screenWidth + 60 || pos.y < -40 || pos.y > screenHeight + 40) {
          return;
        }
        const label = rp.name || 'Player';
        const w = ctx.measureText(label).width + 12;
        const x = Math.round(pos.x);
        const y = Math.round(pos.y - 6);
        ctx.fillStyle = 'rgba(24, 20, 16, 0.72)';
        ctx.fillRect(x - w / 2, y - 14, w, 15);
        ctx.strokeStyle = rp.coat || '#b7a78e';
        ctx.lineWidth = 1;
        ctx.strokeRect(x - w / 2 + 0.5, y - 13.5, w - 1, 14);
        ctx.fillStyle = '#f3eee3';
        ctx.fillText(label, x, y - 1);

        if (rp.hp < PLAYER_MAX_HP) {
          const bw = 34;
          const bh = 3;
          const ratio = Math.max(0, Math.min(1, rp.hp / PLAYER_MAX_HP));
          ctx.fillStyle = 'rgba(20, 16, 12, 0.8)';
          ctx.fillRect(x - bw / 2, y + 3, bw, bh);
          ctx.fillStyle = ratio > 0.35 ? '#d4b56e' : '#c8573f';
          ctx.fillRect(x - bw / 2, y + 3, Math.round(bw * ratio), bh);
        }
      });
      ctx.restore();
    }

    const mpLeaveBtn = document.getElementById('mp-leave-btn');

    const mpStatusEl = document.getElementById('mp-status');

    function setMpStatus(text, isErr = false) {
      mpStatusEl.textContent = text;
      mpStatusEl.classList.toggle('err', !!isErr);
    }

    function updateMpUiState() {
      const inRoom = net.role === 'host' || net.role === 'guest';
      mpIdleControls.style.display = inRoom ? 'none' : 'block';
      mpActiveControls.style.display = inRoom ? 'block' : 'none';
      mpRoomCodeEl.textContent = net.roomCode || '----';
      if (net.role === 'host') {
        mpBadge.textContent = `Host (${net.players.size + 1})`;
      } else if (net.role === 'guest') {
        mpBadge.textContent = `Live (${net.players.size + 1})`;
      } else {
        mpBadge.textContent = 'Solo';
      }
      renderMpPlayersList();
    }

    function renderMpPlayersList() {
      if (net.role === 'solo') {
        mpPlayersEl.innerHTML = '';
        return;
      }
      mpBadge.textContent = `${net.role === 'host' ? 'Host' : 'Live'} (${net.players.size + 1})`;
      const entries = [{
        name: net.localName + ' (you)',
        coat: net.localCoat,
        stars: wantedLevel,
        isHost: net.role === 'host'
      }];
      net.players.forEach(rp => {
        entries.push({
          name: rp.name + (rp.isHost ? ' [H]' : ''),
          coat: rp.coat || '#3d7a8c',
          stars: rp.wantedLevel || 0,
          isHost: !!rp.isHost
        });
      });
      mpPlayersEl.innerHTML = '';
      entries.forEach(item => {
        const row = document.createElement('div');
        row.className = 'mp-player-item';
        const left = document.createElement('span');
        left.className = 'mp-player-left';
        const dot = document.createElement('span');
        dot.className = 'mp-dot';
        dot.style.backgroundColor = item.coat;
        const nameEl = document.createElement('span');
        nameEl.className = 'mp-player-name';
        nameEl.textContent = item.name;
        left.appendChild(dot);
        left.appendChild(nameEl);
        row.appendChild(left);
        if (item.stars > 0) {
          const starsEl = document.createElement('span');
          starsEl.className = 'mp-stars';
          starsEl.textContent = '★'.repeat(Math.min(5, item.stars));
          row.appendChild(starsEl);
        }
        mpPlayersEl.appendChild(row);
      });
    }

    function netLeaveRoom(statusMsg) {
      const wasGuest = net.role === 'guest';
      if (net.respawnTimeout) {
        clearTimeout(net.respawnTimeout);
        net.respawnTimeout = null;
      }
      net.conns.forEach(conn => { try { conn.close(); } catch (_) {} });
      net.conns.clear();
      if (net.hostConn) {
        try { net.hostConn.close(); } catch (_) {}
        net.hostConn = null;
      }
      if (net.peer) {
        try { net.peer.destroy(); } catch (_) {}
        net.peer = null;
      }
      net.players.clear();
      net.role = 'solo';
      net.roomCode = '';
      net.localId = 'local';
      net.localCoat = '#a94336';
      net.coatIndex = 1;
      vehicles.forEach(v => {
        if (v !== activeVehicle) {
          v.driverId = null;
          if (wasGuest && !v.isBike && !v.parked && v.id !== 'starter') {
            v.ai = true;
            if (v.dirIndex == null) {
              snapPoliceCarToRoam(v);
              if (!v.isPoliceCar) {
                const spec = getCarSpec(v);
                v.baseSpeed = spec.cruiseMin + Math.random() * spec.cruiseSpan;
              }
            }
          }
        } else {
          v.driverId = null;
        }
      });
      mpHostBtn.disabled = false;
      mpJoinBtn.disabled = false;
      updateMpUiState();
      setMpStatus(statusMsg || 'Returned to solo city');
    }

    function netStartHost(attempt = 0) {
      if (typeof Peer === 'undefined') {
        setMpStatus('PeerJS failed to load — check connection', true);
        return;
      }
      if (net.role !== 'solo') netLeaveRoom();
      if (typeof setMobilePaused === 'function') setMobilePaused(false);
      const code = generateRoomCode();
      const peerId = net.peerPrefix + code.toLowerCase();
      mpHostBtn.disabled = true;
      mpJoinBtn.disabled = true;
      setMpStatus(`Opening room ${code}...`);

      const peer = new Peer(peerId, { debug: 0 });
      net.peer = peer;

      peer.on('open', id => {
        net.role = 'host';
        net.localId = id;
        net.localCoat = '#a94336';
        net.roomCode = code;
        net.coatIndex = 1;
        if (activeVehicle) activeVehicle.driverId = id;
        mpHostBtn.disabled = false;
        mpJoinBtn.disabled = false;
        updateMpUiState();
        setMpStatus(`Hosting ${code} · Share code or link`);
        try {
          const url = new URL(location.href);
          url.searchParams.set('room', code);
          history.replaceState(null, '', url.toString());
        } catch (_) {}
      });

      peer.on('connection', conn => {
        conn.on('open', () => {
          net.conns.set(conn.peer, conn);
        });
        conn.on('data', msg => handleHostMessage(conn, msg));
        const onDrop = () => {
          net.conns.delete(conn.peer);
          const rp = net.players.get(conn.peer);
          if (rp) {
            if (rp.vehicleId) {
              const v = vehicles.find(item => item.id === rp.vehicleId);
              if (v && v.driverId === conn.peer) {
                v.driverId = null;
                v.speed = 0;
                if (v.isBike) tryParkBikeInNearbyBay(v);
                else v.parked = isInParkingBay(v.x, v.y);
              }
            }
            const leftName = rp.name;
            net.players.delete(conn.peer);
            netBroadcast({ t: 'roster', roster: buildRoster() });
            renderMpPlayersList();
            setMpStatus(`${leftName} left the city`);
          }
        };
        conn.on('close', onDrop);
        conn.on('error', onDrop);
      });

      peer.on('error', err => {
        if (err && err.type === 'unavailable-id' && attempt < 3) {
          try { peer.destroy(); } catch (_) {}
          net.peer = null;
          netStartHost(attempt + 1);
          return;
        }
        netLeaveRoom(`Host error: ${err && err.type ? err.type : 'connection failed'}`);
        setMpStatus(`Host error: ${err && err.type ? err.type : 'connection failed'}`, true);
      });
    }

    function netStartJoin(rawCode) {
      if (typeof Peer === 'undefined') {
        setMpStatus('PeerJS failed to load — check connection', true);
        return;
      }
      const code = String(rawCode || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (code.length < 3) {
        setMpStatus('Enter a valid room code', true);
        return;
      }
      if (net.role !== 'solo') netLeaveRoom();
      if (typeof setMobilePaused === 'function') setMobilePaused(false);
      mpHostBtn.disabled = true;
      mpJoinBtn.disabled = true;
      setMpStatus(`Connecting to ${code}...`);

      const peer = new Peer({ debug: 0 });
      net.peer = peer;
      let joined = false;

      const connectTimer = setTimeout(() => {
        if (!joined && net.peer === peer) {
          netLeaveRoom(`Could not reach room ${code}`);
          setMpStatus(`Timed out joining ${code}`, true);
        }
      }, 10000);

      peer.on('open', id => {
        net.localId = id;
        const conn = peer.connect(net.peerPrefix + code.toLowerCase(), { reliable: true });
        net.hostConn = conn;
        conn.on('open', () => {
          joined = true;
          clearTimeout(connectTimer);
          net.role = 'guest';
          net.roomCode = code;
          mpHostBtn.disabled = false;
          mpJoinBtn.disabled = false;
          conn.send({ t: 'hello', name: net.localName, skin: playerSkin });
          updateMpUiState();
          setMpStatus(`Syncing city ${code}...`);
        });
        conn.on('data', msg => handleGuestMessage(msg));
        conn.on('close', () => {
          clearTimeout(connectTimer);
          if (net.role === 'guest') {
            netLeaveRoom('Host disconnected — back in solo city');
          }
        });
        conn.on('error', () => {
          clearTimeout(connectTimer);
          if (net.role === 'guest') {
            netLeaveRoom('Connection lost — back in solo city');
          }
        });
      });

      peer.on('error', err => {
        clearTimeout(connectTimer);
        const reason = err && err.type === 'peer-unavailable'
          ? `Room ${code} not found`
          : `Join error: ${err && err.type ? err.type : 'failed'}`;
        netLeaveRoom(reason);
        setMpStatus(reason, true);
      });
    }

    function initMpUi() {
      let savedName = '';
      try { savedName = localStorage.getItem('krcity2_name') || ''; } catch (_) {}
      net.localName = savedName.trim().slice(0, 14) || `Driver-${Math.floor(10 + Math.random() * 89)}`;
      mpNameInput.value = net.localName;

      mpNameInput.addEventListener('focus', clearHeldKeys);
      mpCodeInput.addEventListener('focus', clearHeldKeys);

      mpNameInput.addEventListener('change', () => {
        const clean = mpNameInput.value.trim().slice(0, 14) || 'Player';
        mpNameInput.value = clean;
        net.localName = clean;
        try { localStorage.setItem('krcity2_name', clean); } catch (_) {}
        if (net.role === 'host') {
          netBroadcast({ t: 'roster', roster: buildRoster() });
          renderMpPlayersList();
        } else if (net.role === 'guest') {
          netSendToHost({ t: 'rename', name: clean });
          renderMpPlayersList();
        }
      });

      mpHeader.addEventListener('click', () => {
        const collapsed = mpPanel.classList.toggle('collapsed');
        mpToggle.textContent = collapsed ? '+' : '−';
      });

      mpHostBtn.addEventListener('click', () => {
        mpHostBtn.blur();
        netStartHost(0);
      });

      mpJoinBtn.addEventListener('click', () => {
        mpJoinBtn.blur();
        netStartJoin(mpCodeInput.value);
      });

      mpCodeInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          mpCodeInput.blur();
          netStartJoin(mpCodeInput.value);
        }
      });

      mpCopyBtn.addEventListener('click', () => {
        mpCopyBtn.blur();
        const url = new URL(location.href);
        url.searchParams.set('room', net.roomCode);
        const link = url.toString();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link)
            .then(() => setMpStatus('Invite link copied!'))
            .catch(() => setMpStatus(`Share code: ${net.roomCode}`));
        } else {
          setMpStatus(`Share code: ${net.roomCode}`);
        }
      });

      mpLeaveBtn.addEventListener('click', () => {
        mpLeaveBtn.blur();
        try {
          const url = new URL(location.href);
          url.searchParams.delete('room');
          history.replaceState(null, '', url.toString());
        } catch (_) {}
        netLeaveRoom('Left room — solo city');
      });

      window.addEventListener('beforeunload', () => {
        if (net.peer) {
          try { net.peer.destroy(); } catch (_) {}
        }
      });

      // Auto-join if opened via ?room=XXXX invite link
      try {
        const roomParam = new URLSearchParams(location.search).get('room');
        if (roomParam && roomParam.trim().length >= 3) {
          const cleanCode = roomParam.trim().toUpperCase();
          mpCodeInput.value = cleanCode;
          setTimeout(() => netStartJoin(cleanCode), 250);
        }
      } catch (_) {}
    }

    initMpUi();

    // --- MOBILE CONSOLE CONTROLS (KR·BOY 60/40) ---
    const MOVE_DEADZONE = 0.22;
    const AIM_TURN_DEADZONE = 0.20;
    const SHOOT_DEADZONE = 0.36;
    const mobileTouch = {
      move: { active: false, id: null, baseX: 0, baseY: 0, vx: 0, vy: 0, maxR: 44, reset: null },
      aim:  { active: false, id: null, baseX: 0, baseY: 0, vx: 0, vy: 0, maxR: 44, reset: null }
    };
    const touchOwnedCodes = new Set();
    let mobilePaused = false;

    const interactBtnEl = document.getElementById('interactBtn');
    const mobileMpBtnEl = document.getElementById('mobileMpBtn');
    const mobilePauseBtnEl = document.getElementById('mobilePauseBtn');
    const pausedOverlayEl = document.getElementById('paused-overlay');
    const mobileAmmoLabelEl = document.getElementById('mobile-ammo-label');

    function haptic(ms) {
      if (!isMobile) return;
      if (navigator.vibrate) {
        try { navigator.vibrate(ms); } catch (_) {}
      }
    }

    function releaseTouchOwnedCodes() {
      touchOwnedCodes.forEach(code => {
        heldCodes.delete(code);
        const mapped = CODE_TO_KEY[code];
        if (mapped) keys[mapped] = false;
      });
      touchOwnedCodes.clear();
    }

    function pressTouchCode(code) {
      heldCodes.add(code);
      const mapped = CODE_TO_KEY[code];
      if (mapped) keys[mapped] = true;
      touchOwnedCodes.add(code);
    }

    function resetMobileSticks() {
      ['move', 'aim'].forEach(which => {
        const state = mobileTouch[which];
        state.active = false;
        state.id = null;
        state.vx = 0;
        state.vy = 0;
        if (typeof state.reset === 'function') state.reset();
      });
      releaseTouchOwnedCodes();
    }

    function setMobilePaused(next) {
      const target = !!(next && isMobile && net.role === 'solo');
      mobilePaused = target;
      if (pausedOverlayEl) pausedOverlayEl.classList.toggle('show', mobilePaused);
      if (mobilePaused) resetMobileSticks();
      if (mobilePauseBtnEl) {
        mobilePauseBtnEl.textContent = mobilePaused ? 'RESUME' : 'PAUSE';
        mobilePauseBtnEl.classList.toggle('active', mobilePaused);
      }
    }

    function toggleMobilePause() {
      if (!isMobile || net.role !== 'solo' || wasted) return;
      setMobilePaused(!mobilePaused);
      haptic(12);
    }

    function findNearestEnterableVehicle() {
      let best = null;
      let bestDist = Infinity;
      for (let i = 0; i < vehicles.length; i++) {
        const v = vehicles[i];
        if (!v || v.dead || isVehicleOccupiedByOther(v)) continue;
        const maxDist = v.isBike ? BIKE.enterDist : 55;
        const d = Math.hypot(player.x - v.x, player.y - v.y);
        if (d <= maxDist && d < bestDist) {
          bestDist = d;
          best = v;
        }
      }
      return best;
    }

    function updateMobileHudAndControls() {
      if (!isMobile) return;

      if (mobileAmmoLabelEl) {
        if (gun.reloadTimer > 0) {
          mobileAmmoLabelEl.textContent = 'RELOAD';
          mobileAmmoLabelEl.classList.add('reloading');
        } else {
          mobileAmmoLabelEl.textContent = `${gun.ammo}/${COMBAT.magSize}`;
          mobileAmmoLabelEl.classList.remove('reloading');
        }
      }

      if (interactBtnEl) {
        if (wasted) {
          interactBtnEl.textContent = 'ENTER';
          interactBtnEl.classList.remove('available');
        } else if (player.mode === 'driving' || player.mode === 'biking') {
          interactBtnEl.textContent = 'EXIT';
          interactBtnEl.classList.add('available');
        } else if (findNearestEnterableVehicle()) {
          interactBtnEl.textContent = 'ENTER';
          interactBtnEl.classList.add('available');
        } else {
          interactBtnEl.textContent = 'ENTER';
          interactBtnEl.classList.remove('available');
        }
      }

      if (mobilePauseBtnEl) {
        const isSolo = net.role === 'solo';
        if (!isSolo && mobilePaused) setMobilePaused(false);
        mobilePauseBtnEl.disabled = !isSolo || wasted;
        mobilePauseBtnEl.textContent = mobilePaused ? 'RESUME' : 'PAUSE';
        mobilePauseBtnEl.classList.toggle('active', mobilePaused);
      }

      if (mobileMpBtnEl) {
        const open = mpPanel.classList.contains('mobile-open');
        const inRoom = net.role !== 'solo';
        mobileMpBtnEl.textContent = inRoom ? `MP·${net.players.size + 1}` : 'MP';
        mobileMpBtnEl.classList.toggle('active', open || inRoom);
      }
    }

    function applyMobileTouchInput() {
      if (!isMobile) return;
      releaseTouchOwnedCodes();
      if (wasted || mobilePaused) return;

      // Left joystick → WASD (Move / Drive & Steer)
      if (mobileTouch.move.active) {
        if (mobileTouch.move.vy < -MOVE_DEADZONE) pressTouchCode('KeyW');
        if (mobileTouch.move.vy >  MOVE_DEADZONE) pressTouchCode('KeyS');
        if (mobileTouch.move.vx < -MOVE_DEADZONE) pressTouchCode('KeyA');
        if (mobileTouch.move.vx >  MOVE_DEADZONE) pressTouchCode('KeyD');
      }

      // Right joystick → Arrow keys (Horizontal: Turn/Spin; Vertical: Shoot Up/Down with wider deadzone)
      if (mobileTouch.aim.active) {
        if (mobileTouch.aim.vx < -AIM_TURN_DEADZONE) pressTouchCode('ArrowLeft');
        if (mobileTouch.aim.vx >  AIM_TURN_DEADZONE) pressTouchCode('ArrowRight');
        if (mobileTouch.aim.vy < -SHOOT_DEADZONE) {
          pressTouchCode('ArrowUp');
          gun.lastShootCode = 'ArrowUp';
        } else if (mobileTouch.aim.vy > SHOOT_DEADZONE) {
          pressTouchCode('ArrowDown');
          gun.lastShootCode = 'ArrowDown';
        }
      }
    }

    function attachMobileJoystick(zoneEl, baseEl, knobEl, which) {
      if (!zoneEl || !baseEl || !knobEl) return;
      const state = mobileTouch[which];
      const wellEl = zoneEl.querySelector('.stick-well');

      function placeEl(el, x, y) {
        if (!el) return;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
      }

      function computeMaxR() {
        if (wellEl) {
          const wr = wellEl.getBoundingClientRect();
          if (wr.width > 0) return Math.max(28, Math.min(56, wr.width * 0.4));
        }
        return 46;
      }

      function resetVisuals() {
        const r = zoneEl.getBoundingClientRect();
        const cx = r.width * 0.5;
        const cy = r.height * 0.48;
        state.baseX = cx;
        state.baseY = cy;
        state.maxR = computeMaxR();
        placeEl(wellEl, cx, cy);
        placeEl(baseEl, cx, cy);
        placeEl(knobEl, cx, cy);
      }

      state.reset = resetVisuals;
      resetVisuals();
      window.addEventListener('resize', resetVisuals);
      window.addEventListener('orientationchange', () => setTimeout(resetVisuals, 140));
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resetVisuals);
      }

      function startAt(id, clientX, clientY) {
        if (state.active) return;
        const r = zoneEl.getBoundingClientRect();
        const wellR = wellEl ? (wellEl.getBoundingClientRect().width * 0.5) : 48;
        const padX = Math.min(r.width * 0.35, wellR * 0.45);
        const padY = Math.min(r.height * 0.35, wellR * 0.35);
        const lx = Math.max(padX, Math.min(r.width - padX, clientX - r.left));
        const ly = Math.max(padY, Math.min(r.height - padY, clientY - r.top));
        state.active = true;
        state.id = id;
        state.maxR = computeMaxR();
        state.baseX = lx;
        state.baseY = ly;
        state.vx = 0;
        state.vy = 0;
        placeEl(wellEl, lx, ly);
        placeEl(baseEl, lx, ly);
        placeEl(knobEl, lx, ly);
      }

      function moveAt(clientX, clientY) {
        if (!state.active) return;
        const r = zoneEl.getBoundingClientRect();
        const lx = clientX - r.left;
        const ly = clientY - r.top;
        let dx = lx - state.baseX;
        let dy = ly - state.baseY;
        const d = Math.hypot(dx, dy);
        const maxR = state.maxR || 42;
        const clamped = Math.min(d, maxR);
        if (d > 0) {
          dx = (dx / d) * clamped;
          dy = (dy / d) * clamped;
        }
        placeEl(knobEl, state.baseX + dx, state.baseY + dy);
        state.vx = dx / maxR;
        state.vy = dy / maxR;
      }

      function endStick() {
        state.active = false;
        state.id = null;
        state.vx = 0;
        state.vy = 0;
        resetVisuals();
      }

      zoneEl.addEventListener('touchstart', e => {
        e.preventDefault();
        if (state.active) return;
        const t = e.changedTouches[0];
        if (t) startAt(t.identifier, t.clientX, t.clientY);
      }, { passive: false });

      zoneEl.addEventListener('touchmove', e => {
        e.preventDefault();
        if (!state.active) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.identifier === state.id) {
            moveAt(t.clientX, t.clientY);
            break;
          }
        }
      }, { passive: false });

      const onTouchEnd = e => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === state.id) {
            endStick();
            break;
          }
        }
      };
      zoneEl.addEventListener('touchend', onTouchEnd, { passive: false });
      zoneEl.addEventListener('touchcancel', onTouchEnd, { passive: false });

      // Desktop ?mobile=1 mouse-drag support so sticks are testable without a touch screen
      if (mobileQueryParam === true) {
        zoneEl.addEventListener('mousedown', e => {
          if (e.button !== 0) return;
          e.preventDefault();
          startAt('mouse', e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', e => {
          if (state.active && state.id === 'mouse') moveAt(e.clientX, e.clientY);
        });
        window.addEventListener('mouseup', () => {
          if (state.active && state.id === 'mouse') endStick();
        });
      }
    }

    function bindMobileTap(el, handler) {
      if (!el) return;
      let lastTouchAt = 0;
      el.addEventListener('touchend', e => {
        e.preventDefault();
        lastTouchAt = performance.now();
        handler();
      }, { passive: false });
      el.addEventListener('click', e => {
        if (performance.now() - lastTouchAt < 400) return;
        e.preventDefault();
        handler();
      });
    }

    if (isMobile) {
      document.addEventListener('touchmove', e => {
        if (e.target && e.target.closest && e.target.closest('#mp-panel')) return;
        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener('touchstart', e => {
        e.preventDefault();
      }, { passive: false });

      attachMobileJoystick(
        document.querySelector('#pad .stick-zone.left'),
        document.getElementById('leftBase'),
        document.getElementById('leftKnob'),
        'move'
      );
      attachMobileJoystick(
        document.querySelector('#pad .stick-zone.right'),
        document.getElementById('rightBase'),
        document.getElementById('rightKnob'),
        'aim'
      );

      bindMobileTap(interactBtnEl, () => {
        if (mobilePaused || wasted) return;
        if (!interactBtnEl.classList.contains('available')) return;
        togglePlayerMode();
        haptic(15);
      });

      bindMobileTap(mobilePauseBtnEl, () => {
        toggleMobilePause();
      });

      bindMobileTap(mobileMpBtnEl, () => {
        const willOpen = !mpPanel.classList.contains('mobile-open');
        mpPanel.classList.toggle('mobile-open', willOpen);
        if (willOpen) {
          mpPanel.classList.remove('collapsed');
          mpToggle.textContent = '−';
        }
        haptic(10);
        updateMobileHudAndControls();
      });
    }

    // --- MAIN GAME LOOP (Fixed 120 ticks/sec across 60Hz / 120Hz / 144Hz displays) ---
    const SIM_TPS = 120;
    const SIM_STEP_MS = 1000 / SIM_TPS;
    const SIM_MAX_STEPS_PER_FRAME = 6;
    let lastFrameTime = 0;
    let simAccumulator = 0;

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        lastFrameTime = 0;
        simAccumulator = 0;
      }
    });

    function stepSimulation() {
      if (isMobile) {
        if (wasted) releaseTouchOwnedCodes();
        else applyMobileTouchInput();
      }
      if (net.role === 'guest') {
        if (!wasted) {
          handleInput();
          tryPlayerShoot();
        }
        netGuestTick();
      } else {
        if (!wasted) {
          handleInput();
          tryPlayerShoot();
        }
        if (net.role === 'host' || !wasted) {
          updatePoliceCarHuntState();
          maintainPoliceCars();
          updateEntities();
          updatePedestrians();
          updatePolice();
          updatePoliceSpawning();
          handleVehiclePedHits();
          updateWanted();
          updateBullets();
          updateSkidMarks();
          updateBillboardEffects();
          handlePlayerCarHits();
          updateWreckFx();
        } else {
          updateWreckFx();
        }
        if (net.role === 'host') {
          netHostTick();
        }
      }
      updateCameraShake();
    }

    function loop(now) {
      const ts = typeof now === 'number' ? now : performance.now();
      if (isMobile && mobilePaused && net.role === 'solo') {
        lastFrameTime = ts;
        simAccumulator = 0;
        render();
        updateHud();
        requestAnimationFrame(loop);
        return;
      }

      if (!lastFrameTime) {
        lastFrameTime = ts;
        stepSimulation();
      } else {
        let dt = Math.min(100, Math.max(0, ts - lastFrameTime));
        lastFrameTime = ts;
        // Snap common 120Hz / 60Hz frame intervals to avoid 0/2 or 1/3 micro-jitter.
        if (Math.abs(dt - SIM_STEP_MS) < 0.85) dt = SIM_STEP_MS;
        else if (Math.abs(dt - SIM_STEP_MS * 2) < 1.35) dt = SIM_STEP_MS * 2;
        simAccumulator += dt;
        const maxAccum = SIM_STEP_MS * SIM_MAX_STEPS_PER_FRAME;
        if (simAccumulator > maxAccum) simAccumulator = maxAccum;

        let steps = 0;
        while (simAccumulator >= SIM_STEP_MS && steps < SIM_MAX_STEPS_PER_FRAME) {
          stepSimulation();
          simAccumulator -= SIM_STEP_MS;
          steps++;
        }
      }

      render();
      updateHud();
      requestAnimationFrame(loop);
    }

    updateWantedStarsUi();
    resizeCanvas();
    if (isMobile) resetMobileSticks();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
