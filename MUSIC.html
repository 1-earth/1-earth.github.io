    <script>
        (function () {
            var carousel = document.querySelector('[data-carousel]');
            if (!carousel) return;

            var viewport = carousel.querySelector('[data-carousel-viewport]');
            var track = carousel.querySelector('[data-carousel-track]');
            var live = carousel.querySelector('[data-carousel-live]');
            var dotsWrap = carousel.querySelector('[data-carousel-dots]');
            var originals = Array.prototype.slice.call(track.children);
            var songCount = originals.length;
            if (songCount < 2) return;

            var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var index = 1;
            var dragging = false;
            var suppressClick = false;
            var startX = 0;
            var startY = 0;
            var startOffset = 0;
            var axis = '';
            var animating = false;
            var motionId = 0;

            function songName(slide) {
                var heading = slide.querySelector('h2');
                var artist = slide.querySelector('.artist');
                var name = heading ? heading.textContent.replace(/\s+/g, ' ').trim() : 'Song';
                var who = artist ? artist.textContent.replace(/\s+/g, ' ').trim() : '';
                return who ? name + ', ' + who : name;
            }

            function logicalIndex() {
                return (index - 1 + songCount) % songCount;
            }

            function stride() {
                var slide = track.children[0];
                return slide ? slide.getBoundingClientRect().width : viewport.clientWidth;
            }

            function offsetFor(i) {
                var width = stride();
                return (viewport.clientWidth - width) / 2 - i * width;
            }

            function pauseFrame(frame) {
                try {
                    if (!frame.contentWindow) return;
                    frame.contentWindow.postMessage(JSON.stringify({
                        event: 'command',
                        func: 'pauseVideo',
                        args: ''
                    }), '*');
                } catch (err) {
                    return;
                }
            }

            function pauseInactive() {
                var slides = track.children;
                for (var i = 0; i < slides.length; i += 1) {
                    if (i === index) continue;
                    var frames = slides[i].querySelectorAll('iframe');
                    for (var f = 0; f < frames.length; f += 1) pauseFrame(frames[f]);
                }
            }

            function updateA11y() {
                var slides = track.children;
                var current = logicalIndex();
                for (var i = 0; i < slides.length; i += 1) {
                    var active = i === index;
                    slides[i].setAttribute('aria-hidden', active ? 'false' : 'true');
                    if ('inert' in slides[i]) slides[i].inert = !active;
                }
                var dots = dotsWrap.querySelectorAll('[data-carousel-dot]');
                for (var d = 0; d < dots.length; d += 1) {
                    var on = Number(dots[d].getAttribute('data-carousel-dot')) === current;
                    if (on) dots[d].setAttribute('aria-current', 'true');
                    else dots[d].removeAttribute('aria-current');
                }
                if (live && slides[index]) live.textContent = songName(slides[index]);
            }

            function normalize() {
                if (index === 0) index = songCount;
                else if (index === songCount + 1) index = 1;
                else return;
                track.style.transition = 'none';
                track.style.transform = 'translate3d(' + offsetFor(index) + 'px,0,0)';
            }

            function finish() {
                animating = false;
                normalize();
                updateA11y();
                pauseInactive();
            }

            function place(animate) {
                var useMotion = animate && !reduced;
                track.style.transition = useMotion ? 'transform 0.45s ease' : 'none';
                track.style.transform = 'translate3d(' + offsetFor(index) + 'px,0,0)';
                if (!useMotion) {
                    finish();
                    return;
                }
                animating = true;
                var id = ++motionId;
                window.setTimeout(function () {
                    if (id !== motionId) return;
                    finish();
                }, 520);
            }

            function go(delta) {
                if (animating || !delta) return;
                index += delta;
                pauseInactive();
                place(true);
            }

            function goToSong(songIndex) {
                var current = logicalIndex();
                if (songIndex === current) return;
                var forward = (songIndex - current + songCount) % songCount;
                var back = (current - songIndex + songCount) % songCount;
                go(forward <= back ? forward : -back);
            }

            var prevClone = originals[songCount - 1].cloneNode(true);
            var nextClone = originals[0].cloneNode(true);
            [prevClone, nextClone].forEach(function (clone) {
                clone.removeAttribute('id');
                clone.setAttribute('data-clone', 'true');
            });
            track.insertBefore(prevClone, track.firstChild);
            track.appendChild(nextClone);

            originals.forEach(function (slide, i) {
                var dot = document.createElement('button');
                dot.type = 'button';
                dot.className = 'carousel-dot';
                dot.setAttribute('data-carousel-dot', String(i));
                dot.setAttribute('aria-label', songName(slide));
                dot.addEventListener('click', function () {
                    goToSong(i);
                });
                dotsWrap.appendChild(dot);
            });

            carousel.querySelector('[data-carousel-prev]').addEventListener('click', function () {
                go(-1);
            });
            carousel.querySelector('[data-carousel-next]').addEventListener('click', function () {
                go(1);
            });

            track.addEventListener('transitionend', function (event) {
                if (event.target !== track || event.propertyName !== 'transform') return;
                motionId += 1;
                finish();
            });

            document.addEventListener('keydown', function (event) {
                if (event.altKey || event.ctrlKey || event.metaKey) return;
                var tag = event.target && event.target.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
                if (event.key === 'ArrowLeft') {
                    event.preventDefault();
                    go(-1);
                } else if (event.key === 'ArrowRight') {
                    event.preventDefault();
                    go(1);
                }
            });

            viewport.addEventListener('pointerdown', function (event) {
                if (event.button !== undefined && event.button !== 0) return;
                if (animating) return;
                dragging = true;
                suppressClick = false;
                axis = '';
                startX = event.clientX;
                startY = event.clientY;
                startOffset = offsetFor(index);
                if (viewport.setPointerCapture) viewport.setPointerCapture(event.pointerId);
            });

            viewport.addEventListener('pointermove', function (event) {
                if (!dragging) return;
                var dx = event.clientX - startX;
                var dy = event.clientY - startY;
                if (!axis) {
                    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
                    axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
                }
                if (axis !== 'x') return;
                suppressClick = true;
                if (event.cancelable) event.preventDefault();
                track.style.transition = 'none';
                track.style.transform = 'translate3d(' + (startOffset + dx) + 'px,0,0)';
            }, { passive: false });

            function endDrag(event) {
                if (!dragging) return;
                dragging = false;
                if (axis !== 'x') return;
                var dx = event.clientX - startX;
                var threshold = Math.max(48, stride() * 0.18);
                if (dx <= -threshold) go(1);
                else if (dx >= threshold) go(-1);
                else place(true);
            }

            viewport.addEventListener('pointerup', endDrag);
            viewport.addEventListener('pointercancel', endDrag);

            viewport.addEventListener('click', function (event) {
                if (!suppressClick) return;
                event.preventDefault();
                event.stopPropagation();
                suppressClick = false;
            }, true);

            window.addEventListener('resize', function () {
                if (dragging) return;
                place(false);
            });

            if (window.ResizeObserver) {
                var observer = new ResizeObserver(function () {
                    if (dragging) return;
                    if (animating) {
                        track.style.transition = 'none';
                        track.style.transform = 'translate3d(' + offsetFor(index) + 'px,0,0)';
                        return;
                    }
                    place(false);
                });
                observer.observe(viewport);
            }

            place(false);
        })();
    </script>
