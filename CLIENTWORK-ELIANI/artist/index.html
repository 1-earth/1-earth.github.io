<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist | Eliani Studios</title>
  <link rel="icon" type="image/png" href="../static/assets/logo 2.png">
  <link rel="apple-touch-icon" href="../static/assets/logo 2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Baskervville:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@400;500&family=Geist:wght@400;500&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <meta property="og:description" content="Artists at Eliani Studios.">

  <meta property="og:image:alt" content="Eliani Studios artists">

  <style>
    .eliani-work-page {
      background: var(--page-bg);
    }

    body.eliani-viewer-open {
      overflow: hidden;
    }

    .eliani-work-shell {
      width: min(100%, 1440px);
      margin: 0 auto;
      padding: 0 clamp(1.4rem, 4vw, 3rem) clamp(4rem, 6vw, 5rem);
    }

    .eliani-back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin: 1.6rem 0 1.2rem;
      font-family: "Geist", sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-bottom: 1px solid currentColor;
    }

    .eliani-work-status,
    .eliani-work-intro,
    .eliani-related-section {
      background: rgba(255, 255, 255, 0.48);
      border: 1px solid rgba(38, 35, 32, 0.1);
      border-radius: 28px;
      backdrop-filter: blur(6px);
    }

    .eliani-work-status {
      padding: clamp(2rem, 4vw, 3rem);
      text-align: center;
    }

    .eliani-kicker {
      margin: 0 0 0.9rem;
      font-family: "Geist", sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted-text);
    }

    .eliani-work-status h1,
    .eliani-work-hero-copy h1,
    .eliani-related-heading h2 {
      margin: 0;
      font-family: "Aboreto", serif;
      font-size: clamp(2rem, 4vw, 4.2rem);
      font-weight: 400;
      line-height: 0.96;
      text-transform: uppercase;
    }

    .eliani-work-status p,
    .eliani-work-intro p,
    .eliani-related-card p,
    .blog-body-frontend,
    .blog-media-caption {
      margin: 0;
      color: var(--muted-text);
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1.2rem, 1.7vw, 1.58rem);
      line-height: 1.45;
      text-align: center;
    }

    .eliani-work-layout {
      display: grid;
      gap: 1.5rem;
    }

    .eliani-work-hero {
      position: relative;
      min-height: min(74vh, 820px);
      margin-left: calc(50% - 50vw);
      margin-right: calc(50% - 50vw);
      border-radius: 0;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      overflow: hidden;
    }

    .eliani-work-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, rgba(38, 35, 32, 0.42), rgba(38, 35, 32, 0.08) 35%, rgba(38, 35, 32, 0.18));
    }

    .eliani-work-hero-copy {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: calc(var(--header-offset) + 2rem) 1.5rem 3rem;
      color: #fffdf8;
    }

    .eliani-work-hero-inner {
      width: min(100%, 860px);
    }

    .eliani-work-hero h1 {
      color: inherit;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.24);
    }

    .eliani-work-hero-copy .eliani-kicker,
    .eliani-work-hero-copy .eliani-work-date {
      color: rgba(255, 253, 248, 0.95);
    }

    .eliani-work-hero-meta {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem;
      margin-top: 0.7rem;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1rem, 1.6vw, 1.35rem);
      line-height: 1.1;
      letter-spacing: 0.02em;
    }

    .eliani-work-intro {
      max-width: 980px;
      margin: 0 auto;
      padding: clamp(2rem, 4vw, 3rem);
      text-align: center;
    }

    .eliani-work-intro p {
      max-width: 34ch;
      margin: 0 auto;
      font-size: clamp(1.35rem, 2vw, 2rem);
      line-height: 1.32;
      color: var(--text-color);
    }

    .eliani-work-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 1rem;
      align-items: center;
      margin: 1.2rem 0 1rem;
    }

    .eliani-work-date {
      font-family: "Geist", sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted-text);
    }

    .eliani-tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
    }

    .eliani-tag {
      padding: 0.5rem 0.8rem;
      border: 1px solid rgba(38, 35, 32, 0.18);
      border-radius: 999px;
      font-family: "Geist", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-color);
      background: rgba(255, 252, 247, 0.82);
    }

    .eliani-work-body {
      display: grid;
      gap: 1.4rem;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
    }

    .eliani-related-section {
      overflow: hidden;
      border-radius: 28px;
    }

    .blog-section-frontend,
    .blog-block-frontend {
      display: grid;
      gap: 1rem;
    }

    .blog-subtitle-frontend {
      font-family: "Baskervville", serif;
      font-size: clamp(2.35rem, 3vw, 5rem);
      line-height: 1.15;
      color: var(--text-color);
      border-bottom: 1px solid rgb(38, 35, 32);
      text-align: center;
    }

    .blog-subtitle-frontend p {
      margin: 0;
    }

    .blog-body-frontend p {
      margin: 0 0 1rem;
    }

    .blog-body-frontend p:last-child {
      margin-bottom: 0;
    }

    .blog-media-frontend,
    .blog-embed-frontend,
    .blog-column-group-frontend {
      width: 100%;
    }

    .blog-gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.95rem;
    }

    .blog-gallery-item {
      appearance: none;
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      text-align: left;
      text-decoration: none;
      color: inherit;
    }

    .blog-gallery-trigger,
    .blog-gallery-link {
      cursor: pointer;
    }

    .blog-gallery-static {
      cursor: default;
    }

    .blog-gallery-item img {
      width: 100%;
      aspect-ratio: 1 / 1.25;
      object-fit: cover;
      border-radius: 0;
      display: block;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .blog-media-frontend .blog-gallery-item img {
      border-radius: 0;
    }

    .blog-gallery-trigger:hover img,
    .blog-gallery-trigger:focus-visible img,
    .blog-gallery-link:hover img,
    .blog-gallery-link:focus-visible img {
      transform: scale(0.985);
      opacity: 0.94;
    }

    .blog-gallery-caption {
      margin: 0.6rem 0 0;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.45;
      color: rgba(38, 35, 32, 0.82);
    }

    .blog-media-frontend img,
    .blog-media-frontend video {
      width: 100%;
      display: block;
      /* border-radius: 24px; */
      background: rgba(38, 35, 32, 0.06);
      object-fit: cover;
      max-height: 84vh;
    }

    .blog-media-caption {
      padding-top: 0.75rem;
      text-align: center;
      font-size: 1.02rem;
    }

    .embed-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      overflow: hidden;
      /* border-radius: 24px; */
      background: rgba(38, 35, 32, 0.08);
    }

    .embed-container iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .blog-column-group-frontend {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .blog-column-frontend {
      min-width: min(100%, 280px);
      display: grid;
      gap: 1rem;
    }

    .eliani-related-section {
      padding: clamp(1.8rem, 4vw, 3rem);
      margin-top: 1rem;
      max-width: 1120px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    .eliani-related-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.4rem;
    }

    .eliani-related-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
    }

    .eliani-related-card {
      display: grid;
      gap: 0.85rem;
    }

    .eliani-related-card-media img {
      width: 100%;
      aspect-ratio: 1.08 / 1;
      object-fit: cover;
      /* border-radius: 22px; */
    }

    .eliani-related-card h3 {
      margin: 0;
      font-family: "Baskervville", serif;
      font-size: clamp(1.12rem, 1.8vw, 1.65rem);
      font-weight: 400;
      line-height: 1.05;
    }

    .eliani-related-card .eliani-kicker {
      margin-bottom: 0.45rem;
      font-size: 0.72rem;
    }

    .eliani-pager {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      margin-top: 1.6rem;
    }

    .eliani-pager-btn {
      appearance: none;
      border: 1px solid rgba(38, 35, 32, 0.22);
      background: rgba(255, 252, 247, 0.82);
      color: var(--text-color);
      border-radius: 999px;
      padding: 0.9rem 1.25rem;
      font-family: "Geist", sans-serif;
      font-size: 0.76rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .eliani-pager-btn:hover,
    .eliani-pager-btn:focus-visible {
      background: rgba(146, 170, 121, 0.28);
      transform: translateY(-1px);
    }

    .eliani-pager-btn[hidden] {
      display: none;
    }

    .eliani-viewer {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      background: rgba(14, 13, 11, 0.105);
      backdrop-filter: blur(27px);
    }

    .eliani-viewer.is-open {
      display: block;
    }

    .eliani-viewer-inner {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 1rem;
      padding: 1rem 1rem 1.2rem;
    }

    .eliani-viewer-close,
    .eliani-viewer-nav {
      appearance: none;
      border: 1px solid rgba(255, 253, 248, 0.3);
      background: rgba(255, 252, 247, 0.08);
      color: #fffdf8;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    }

    .eliani-viewer-close:hover,
    .eliani-viewer-close:focus-visible,
    .eliani-viewer-nav:hover,
    .eliani-viewer-nav:focus-visible {
      background: rgba(255, 252, 247, 0.16);
      border-color: rgba(255, 253, 248, 0.52);
      transform: translateY(-1px);
    }

    .eliani-viewer-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 2;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      font-size: 1.8rem;
      line-height: 1;
    }

    .eliani-viewer-stage {
      position: relative;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .eliani-viewer-viewport {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 4.75rem 1rem;
    }

    .eliani-viewer-media {
      max-width: min(100%, 1180px);
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .eliani-viewer-media img {
      display: block;
      width: auto;
      height: calc(100vh - 11rem);
      max-width: 50vw;
      max-height: calc(100vh - 11rem);
      object-fit: contain;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);
    }

    .eliani-viewer-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      width: 60px;
      height: 42px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "Geist", sans-serif;
      font-size: 1rem;
      line-height: 1;
      letter-spacing: 0.08em;
      opacity: 0.9;
    }

    .eliani-viewer-nav--prev {
      left: 1rem;
    }

    .eliani-viewer-nav--prev::before,
    .eliani-viewer-nav--next::before {
      display: block;
      font-family: "Cormorant Garamond", serif;
      font-size: 1.55rem;
      line-height: 1;
      transform: translateY(-1px);
    }

    .eliani-viewer-nav--prev::before {
      content: "←";
    }

    .eliani-viewer-nav--next {
      right: 1rem;
    }

    .eliani-viewer-nav--next::before {
      content: "→";
    }

    .eliani-viewer-footer {
      display: grid;
      gap: 0.75rem;
      align-self: end;
    }

    .eliani-viewer-caption {
      min-height: 1.4rem;
      margin: 0;
      text-align: center;
      color: rgba(255, 253, 248, 0.92);
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1rem, 1.4vw, 1.2rem);
      line-height: 1.2;
    }

    .eliani-viewer-thumbs {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      overflow-x: auto;
      padding-bottom: 0.2rem;
      scrollbar-width: thin;
    }

    .eliani-viewer-thumb {
      appearance: none;
      padding: 0;
      border: 2px solid transparent;
      background: transparent;
      cursor: pointer;
      flex: 0 0 auto;
      opacity: 0.72;
      transition: opacity 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .eliani-viewer-thumb.is-active {
      border-color: rgba(255, 253, 248, 0.9);
      opacity: 1;
    }

    .eliani-viewer-thumb:hover,
    .eliani-viewer-thumb:focus-visible {
      opacity: 1;
      transform: translateY(-1px);
    }

    .eliani-viewer-thumb img {
      width: 54px;
      height: 54px;
      display: block;
      object-fit: cover;
    }

    @media (max-width: 980px) {
      .blog-gallery-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .eliani-related-grid {
        grid-template-columns: 1fr;
      }

      .blog-column-group-frontend {
        flex-direction: column;
      }

      .blog-column-frontend {
        width: 100% !important;
        flex-basis: 100% !important;
      }

      .eliani-viewer-viewport {
        padding-left: 4rem;
        padding-right: 4rem;
      }
    }

    @media (max-width: 640px) {
      .eliani-work-shell {
        padding-left: 1rem;
        padding-right: 1rem;
      }

      .eliani-work-status,
      .eliani-work-intro,
      .eliani-related-section {
        border-radius: 22px;
      }

      .eliani-work-hero {
        min-height: 56vh;
      }

      .eliani-work-hero-copy {
        padding-top: calc(var(--header-offset) + 1.5rem);
        padding-bottom: 2rem;
      }

      .blog-gallery-grid {
        grid-template-columns: 1fr;
        gap: 0.8rem;
      }

      .blog-media-frontend img,
      .blog-media-frontend video,
      .embed-container,
      .eliani-related-card-media img {
        border-radius: 18px;
      }

      .eliani-pager {
        flex-direction: column;
      }

      .eliani-pager-btn {
        width: 100%;
      }

      .eliani-viewer-inner {
        padding: 0.75rem 0.75rem 1rem;
      }

      .eliani-viewer-close {
        top: 0.75rem;
        right: 0.75rem;
        width: 42px;
        height: 42px;
      }

      .eliani-viewer-nav {
        width: 50px;
        height: 38px;
      }

      .eliani-viewer-nav--prev {
        left: 0.4rem;
      }

      .eliani-viewer-nav--next {
        right: 0.4rem;
      }

      .eliani-viewer-viewport {
        padding: 3.5rem 2.8rem 0.5rem;
      }

      .eliani-viewer-media img {
        width: auto;
        height: calc(100vh - 12rem);
        max-width: 80vw;
        max-height: calc(100vh - 12rem);
      }

      .eliani-viewer-thumb img {
        width: 46px;
        height: 46px;
      }
    }
  </style>
</head>
<body class="header-parallax-page eliani-work-page">
  <div class="page">
    <header class="site-header">
      <a class="site-logo" href="../index.html" aria-label="Eliani home">
        <img src="../static/assets/logo 2.png" alt="Eliani logo">
      </a>

      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-menu" aria-label="Open menu">
        <span class="menu-toggle-line"></span>
        <span class="menu-toggle-line"></span>
        <span class="menu-toggle-line"></span>
      </button>

      <nav class="site-nav" id="primary-menu" aria-label="Primary">
        <a href="../index.html">Home</a>
        <a href="../about.html">About</a>
        <a href="../artists.html">Artists</a>
        <a href="../contact.html">Contact</a>
      </nav>
    </header>

    <div class="menu-backdrop" aria-hidden="true"></div>

    <main class="eliani-work-shell">
      <!-- <a class="eliani-back-link" href="../index.html">&#8592; Back to home</a> -->
      <div id="artist-content" class="eliani-work-layout" aria-live="polite">
        <section class="eliani-work-status">
          <p class="eliani-kicker">Loading</p>
          <h1>Preparing artist profile.</h1>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-block">
        <h3>Follow Us</h3>
        <a href="https://www.instagram.com/elianistudios/" target="_blank" rel="noreferrer">Instagram</a>
        <a href="https://www.linkedin.com" target="_blank" rel="noreferrer">LinkedIn</a>
      </div>

      <div class="footer-block footer-contact">
        <h3>Contact Us</h3>
        <a href="mailto:hello@elianistudios.com">hello@elianistudios.com</a>
        <p>182 high street north, London, e6 2ja, UK</p>
      </div>
    </footer>
  </div>

  <div class="eliani-viewer" id="eliani-gallery-viewer" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Image viewer">
    <div class="eliani-viewer-inner">
      <button class="eliani-viewer-close" type="button" aria-label="Close viewer">&times;</button>
      <div class="eliani-viewer-stage">
        <button class="eliani-viewer-nav eliani-viewer-nav--prev" type="button" aria-label="Previous image">&#8249;</button>
        <div class="eliani-viewer-viewport" id="eliani-gallery-viewport">
          <div class="eliani-viewer-media">
            <img id="eliani-gallery-image" src="" alt="">
          </div>
        </div>
        <button class="eliani-viewer-nav eliani-viewer-nav--next" type="button" aria-label="Next image">&#8250;</button>
      </div>
      <div class="eliani-viewer-footer">
        <p class="eliani-viewer-caption" id="eliani-gallery-caption"></p>
        <div class="eliani-viewer-thumbs" id="eliani-gallery-thumbs" aria-label="Gallery thumbnails"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var menuButton = document.querySelector(".menu-toggle");
      var siteNav = document.querySelector(".site-nav");
      var menuBackdrop = document.querySelector(".menu-backdrop");
      var mobileBreakpoint = window.matchMedia("(max-width: 980px)");

      if (!menuButton || !siteNav || !menuBackdrop) return;

      function setMenuState(isOpen) {
        document.body.classList.toggle("menu-open", isOpen);
        menuButton.setAttribute("aria-expanded", String(isOpen));
        menuButton.setAttribute("aria-label", isOpen ? "Close menu" : "Open menu");
      }

      menuButton.addEventListener("click", function () {
        var isOpen = menuButton.getAttribute("aria-expanded") !== "true";
        setMenuState(isOpen);
      });

      menuBackdrop.addEventListener("click", function () {
        setMenuState(false);
      });

      siteNav.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", function () {
          if (mobileBreakpoint.matches) {
            setMenuState(false);
          }
        });
      });

      function handleMobileBreakpointChange(event) {
        if (!event.matches) {
          setMenuState(false);
        }
      }

      if (typeof mobileBreakpoint.addEventListener === "function") {

      function normalizeGalleryLinkHref(value) {
        var href = String(value || "").trim();
        if (!href || /^\s*javascript:/i.test(href)) return "";

        var hasExplicitProtocol = /^[a-z][a-z0-9+.-]*:/i.test(href);
        if (hasExplicitProtocol) {
          try {
            var parsedExplicit = new URL(href);

        // Same-page / site-relative (browser must not treat as hostname)

        }

        // resolves these as paths under the current folder (broken). Prepend https://.
        if (/^www\./i.test(href)) {

        var hostLike = /^([a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$/i;

        var slash = href.indexOf("/");

          if (commonFileExt.test(href)) return href;
          if (hostLike.test(href)) return "https://" + href;
          return href;
        }

        var hostPart = href.slice(0, slash);
        if (hostLike.test(hostPart)) {
          return "https://" + href;
        }

        return href;

      function getColumnGroupColumns(block) {
        if (block && Array.isArray(block.columns) && block.columns.length) {
          var mappedColumns = block.columns.slice().sort(function (a, b) {
            return (a.order || 0) - (b.order || 0);
          }).map(function (column, index) {
            return {
              id: column.id || ("column-" + index),
              width: Number(column.width) || 0,
              blocks: Array.isArray(column.blocks) ? column.blocks.slice().sort(function (a, b) {
                return (a.order || 0) - (b.order || 0);
              }) : []
            };
          });

          var totalWidth = mappedColumns.reduce(function (sum, column) {
            return sum + (column.width || 0);
          }, 0);

          if (totalWidth > 0) {
            var runningWidth = 0;
            mappedColumns = mappedColumns.map(function (column, index) {
              var normalizedWidth = index === mappedColumns.length - 1
                ? Math.max(0, 100 - runningWidth)
                : Math.round((column.width / totalWidth) * 100);
              runningWidth += normalizedWidth;
              return {
                id: column.id,
                width: normalizedWidth,
                blocks: column.blocks
              };
            });
          } else {
            var evenWidth = Math.floor(100 / mappedColumns.length);
            mappedColumns = mappedColumns.map(function (column, index) {
              return {
                id: column.id,
                width: index === mappedColumns.length - 1 ? 100 - (evenWidth * (mappedColumns.length - 1)) : evenWidth,
                blocks: column.blocks
              };
            });
          }

          return mappedColumns;
        }

        var leftRatio = block && block.columnRatio && typeof block.columnRatio.left === "number" ? block.columnRatio.left : 50;
        var rightRatio = block && block.columnRatio && typeof block.columnRatio.right === "number" ? block.columnRatio.right : (100 - leftRatio);
        return [
          {
            id: "left",
            width: leftRatio,
            blocks: (block && block.leftColumn ? block.leftColumn : []).slice().sort(function (a, b) {

          {
            id: "right",

            blocks: (block && block.rightColumn ? block.rightColumn : []).slice().sort(function (a, b) {
              return (a.order || 0) - (b.order || 0);
            })
          }
        ];
      }

      async function renderColumnGroup(db, block) {

              '<button class="eliani-viewer-thumb' + activeClass + '" type="button" data-thumb-index="' + index + '" aria-label="Show image ' + (index + 1) + '">' +
                '<img loading="lazy" src="' + escapeHtml(item.thumb || item.url) + '" alt="' + escapeHtml(item.alt || "Thumbnail") + '">' +
              '</button>';
          }).join("");
          var activeThumb = thumbs.querySelector('.eliani-viewer-thumb.is-active');
          if (activeThumb && activeThumb.scrollIntoView) {
            activeThumb.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
          }
        }

        function render() {
          var items = getItems();
          if (!items.length) return;
          var current = items[state.index];
          image.src = current.url;
          image.alt = current.alt || "Gallery image";
          caption.textContent = current.caption || "";
          renderThumbs(items);
        }

        function open(galleryId, index) {
          state.galleryId = galleryId;
          state.index = index || 0;
          viewer.classList.add("is-open");
          viewer.setAttribute("aria-hidden", "false");
          document.body.classList.add("eliani-viewer-open");
          render();
          closeBtn.focus();
        }

        function close() {
          viewer.classList.remove("is-open");
          viewer.setAttribute("aria-hidden", "true");
          document.body.classList.remove("eliani-viewer-open");
          image.removeAttribute("src");
          image.alt = "";
          caption.textContent = "";
          thumbs.innerHTML = "";
          state.galleryId = "";
          state.index = 0;
        }

        function step(direction) {
          var items = getItems();
          if (!items.length) return;
          state.index = (state.index + direction + items.length) % items.length;
          render();
        }

        function goTo(index) {
          var items = getItems();
          if (!items.length || index < 0 || index >= items.length) return;
          state.index = index;
          render();
        }

        closeBtn.addEventListener("click", close);
        prevBtn.addEventListener("click", function () {
          step(-1);
        });
        nextBtn.addEventListener("click", function () {
          step(1);
        });
        viewer.addEventListener("click", function (event) {
          if (event.target === viewer) close();
        });
        thumbs.addEventListener("click", function (event) {
          var thumb = event.target.closest("[data-thumb-index]");
          if (!thumb) return;
          goTo(Number(thumb.getAttribute("data-thumb-index")) || 0);
        });
        document.addEventListener("keydown", function (event) {
          if (!viewer.classList.contains("is-open")) return;
          if (event.key === "Escape") {
            close();
          } else if (event.key === "ArrowLeft") {
            event.preventDefault();
            step(-1);
          } else if (event.key === "ArrowRight") {
            event.preventDefault();
            step(1);
          }
        });
        viewport.addEventListener("touchstart", function (event) {
          if (!event.changedTouches || !event.changedTouches.length) return;
          state.touchStartX = event.changedTouches[0].clientX;
        }, { passive: true });
        viewport.addEventListener("touchend", function (event) {
          if (!event.changedTouches || !event.changedTouches.length) return;
          var touchEndX = event.changedTouches[0].clientX;
          var deltaX = touchEndX - state.touchStartX;
          if (Math.abs(deltaX) < 40) return;
          if (deltaX > 0) {
            step(-1);
          } else {
            step(1);
          }
        }, { passive: true });

        return {
          open: open
        };
      }

      function buildRelatedCardHtml(post) {
        var image = pickThumbnailFromWork(post) || PLACEHOLDER_IMAGE;
        var title = escapeHtml(post.title || "Untitled");
        var category = escapeHtml(post.category || "Artist");
        var excerpt = escapeHtml(getSummary(post));
        return '' +
          '<a class="eliani-related-card" href="' + buildArtistHref(post) + '" aria-label="Open ' + title + '">' +
            '<div class="eliani-related-card-media">' +
              '<img loading="lazy" src="' + escapeHtml(image) + '" alt="' + title + '">' +
            '</div>' +
            '<div>' +
              '<p class="eliani-kicker">' + category + '</p>' +
              '<h3>' + title + '</h3>' +
              '<p>' + excerpt + '</p>' +
            '</div>' +
          '</a>';
      }

      async function queryWorks(db) {
        try {
          var orderedSnap = await db.collection("users").doc(TARGET_USER_UID)
            .collection("items")
            .where("type", "==", "blog")
            .orderBy("datePosted", "desc")
            .get();
          var orderedPosts = [];
          orderedSnap.forEach(function (doc) {
            orderedPosts.push(normalizeWork(Object.assign({ id: doc.id }, doc.data())));
          });
          return orderedPosts;
        } catch (_) {
          var snap = await db.collection("users").doc(TARGET_USER_UID)
            .collection("items")
            .where("type", "==", "blog")
            .get();
          var posts = [];
          snap.forEach(function (doc) {
            posts.push(normalizeWork(Object.assign({ id: doc.id }, doc.data())));
          });
          return posts;
        }
      }

      async function renderRelatedWork(db, currentId) {
        var container = document.getElementById("related-work-container");
        var section = document.getElementById("related-work-section");
        if (!container || !section) return;
        try {
          var posts = await queryWorks(db);
          posts = posts.filter(hasArtistTag).filter(function (post) {
            return post.id !== currentId;
          });
          if (!posts.length) {
            section.hidden = true;
            return;
          }
          for (var i = posts.length - 1; i > 0; i--) {
            var swapIndex = Math.floor(Math.random() * (i + 1));
            var temp = posts[i];
            posts[i] = posts[swapIndex];
            posts[swapIndex] = temp;
          }
          container.innerHTML = posts.slice(0, 3).map(buildRelatedCardHtml).join("");
        } catch (_) {
          section.hidden = true;
        }
      }

      async function bindPostPager(db, currentId) {
        var prevBtn = document.querySelector('.eliani-pager-btn[data-dir="prev"]');
        var nextBtn = document.querySelector('.eliani-pager-btn[data-dir="next"]');
        if (!prevBtn || !nextBtn) return;
        try {
          var allPosts = await queryWorks(db);
          var posts = allPosts.filter(hasArtistTag);
          if (posts.length < 2) {
            prevBtn.hidden = true;
            nextBtn.hidden = true;
            return;
          }
          var currentIndex = -1;
          for (var i = 0; i < posts.length; i++) {
            if (posts[i].id === currentId) {
              currentIndex = i;
              break;
            }
          }
          if (currentIndex < 0) {
            prevBtn.hidden = true;
            nextBtn.hidden = true;
            return;
          }
          var prevPost = posts[(currentIndex - 1 + posts.length) % posts.length];
          var nextPost = posts[(currentIndex + 1) % posts.length];

          prevBtn.addEventListener("click", function () {
            window.location.href = buildArtistHref(prevPost);
          });
          nextBtn.addEventListener("click", function () {
            window.location.href = buildArtistHref(nextPost);
          });
          document.addEventListener("keydown", function (event) {
            if (event.key === "ArrowLeft") {
              window.location.href = buildArtistHref(prevPost);
            } else if (event.key === "ArrowRight") {
              window.location.href = buildArtistHref(nextPost);
            }
          });
        } catch (_) {}
      }

      async function run() {
        var content = document.getElementById("artist-content");
        var viewerController = createViewerController();
        if (!content) return;

        var slug = getArtistSlugFromLocation();
        if (!slug) {
          content.innerHTML = renderStatus("Missing item", "No artist specified.", "Add a name to the URL, for example ?VINCENT-ZHOU");
          return;
        }

        if (!safeInitFirebase() || !window.firebase) {
          content.innerHTML = renderStatus("Unavailable", "Firestore could not be initialised.", "The detail page is ready, but content is unavailable right now.");
          return;
        }

        try {
          var db = firebase.firestore();
          var posts = await queryWorks(db);
          var work = null;
          var currentId = "";
          for (var i = 0; i < posts.length; i++) {
            if (normalizeSlug(posts[i].title) === normalizeSlug(slug)) {
              work = posts[i];
              currentId = posts[i].id;
              break;
            }
          }

          if (!work) {
            var snap = await db.collection("users").doc(TARGET_USER_UID).collection("items").doc(slug).get();
            if (snap.exists) {
              work = normalizeWork(Object.assign({ id: snap.id }, snap.data()));
              currentId = snap.id;
            }
          }

          if (!work) {
            content.innerHTML = renderStatus("Not found", "That artist could not be found.", "Please return to the site and try another selection.");
            return;
          }

          var title = escapeHtml(work.title || "Untitled");
          var category = escapeHtml(getWorkKicker(work));
          var metaLabel = escapeHtml(getWorkMeta(work));
          var summary = escapeHtml(getSummary(work));
          var tagsHtml = parseCsv(work.tags || work.keywords || "").map(function (tag) {
            return '<span class="eliani-tag">' + escapeHtml(tag) + '</span>';
          }).join("");
          var heroImage = pickThumbnailFromWork(work) || PLACEHOLDER_IMAGE;

          var bodyHtml = await renderModularBlogContent(db, work);

          content.innerHTML = '' +
            '<section class="eliani-work-hero reveal-on-scroll" style="background-image:url(\'' + escapeHtml(heroImage) + '\');">' +
              '<div class="eliani-work-hero-copy">' +
                '<div class="eliani-work-hero-inner">' +
                  '<h1>' + title + '</h1>' +
                  '<div class="eliani-work-hero-meta">' +
                    '<span>' + category + '</span>' +
                    '<span>|</span>' +
                    '<span>' + summary + '</span>' +
                  '</div>' +
                '</div>' +
              '</div>' +
            '</section>' +
            
            '<section class="eliani-work-body reveal-on-scroll">' + bodyHtml + '</section>' +
            '<section class="eliani-related-section reveal-on-scroll" id="related-work-section" aria-labelledby="related-work-title">' +
              '<div class="eliani-related-heading">' +
                '<div>' +
                  '<p class="eliani-kicker">Artists</p>' +
                  '<h2 id="related-work-title">More artists</h2>' +
                '</div>' +
              '</div>' +
              '<div class="eliani-related-grid" id="related-work-container"></div>' +
              '<div class="eliani-pager">' +
                '<button class="eliani-pager-btn" type="button" data-dir="prev">Previous artist</button>' +
                '<button class="eliani-pager-btn" type="button" data-dir="next">Next artist</button>' +
              '</div>' +
            '</section>';

          updateSocialMeta(work);
          renderRelatedWork(db, currentId);
          bindPostPager(db, currentId);

          var revealMotionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");
          var revealElements = Array.prototype.slice.call(document.querySelectorAll(".reveal-on-scroll"));
          if (revealMotionPreference.matches || !("IntersectionObserver" in window)) {
            revealElements.forEach(function (element) {
              element.classList.add("is-visible");
            });
          } else {
            revealElements.forEach(function (element, index) {
              element.style.setProperty("--reveal-delay", index * 80 + "ms");
            });
            var revealObserver = new IntersectionObserver(function (entries, observer) {
              entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                  entry.target.classList.add("is-visible");
                  observer.unobserve(entry.target);
                }
              });
            }, {
              threshold: 0.08,
              rootMargin: "0px 0px -8% 0px"
            });
            revealElements.forEach(function (element) {
              revealObserver.observe(element);
            });
          }

          content.addEventListener("click", function (event) {
            var trigger = event.target.closest(".blog-gallery-trigger");
            if (!trigger || !viewerController) return;
            viewerController.open(
              trigger.getAttribute("data-gallery-id"),
              Number(trigger.getAttribute("data-gallery-index")) || 0
            );
          });
        } catch (_) {
          content.innerHTML = renderStatus("Error", "The artist profile could not be loaded.", "Please try again shortly.");
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", run);
      } else {
        run();
      }
    })();
  </script>
</body>
