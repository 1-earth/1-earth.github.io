  <script>
    (function () {
      var toggle = document.querySelector(".mobile-menu-toggle");
      var menu = document.getElementById("mobile-menu");
      var panel = menu ? menu.querySelector(".mobile-menu-panel") : null;
      if (!toggle || !menu || !panel) return;

      var lastFocused = null;

      function setOpen(open) {
        if (open) {
          lastFocused = document.activeElement;
        }
        document.body.classList.toggle("menu-open", open);
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
        menu.setAttribute("aria-hidden", open ? "false" : "true");
        if (open) {
          var firstLink = panel.querySelector(".mobile-menu-link");
          if (firstLink) firstLink.focus();
        } else if (lastFocused && lastFocused.focus) {
          lastFocused.focus();
        }
      }

      function trapFocus(event) {
        if (event.key !== "Tab" || menu.getAttribute("aria-hidden") === "true") return;
        var focusable = panel.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])');
        if (!focusable.length) return;
        var first = focusable[0];
        var last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }

      toggle.addEventListener("click", function () {
        setOpen(toggle.getAttribute("aria-expanded") !== "true");
      });

      menu.addEventListener("click", function (event) {
        if (event.target === menu || event.target.classList.contains("mobile-menu-link")) {
          setOpen(false);
        }
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") setOpen(false);
        trapFocus(event);
      });

      window.addEventListener("resize", function () {
        if (window.innerWidth > 768) setOpen(false);
      });
    })();
  </script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script>
    (function () {
      var TARGET_USER_UID = "vDAW0f0Hhvcbl8inEnn8sJXvv6M2";
      var PLACEHOLDER_IMAGE = "static/img/placeholder-art.svg";
      var firebaseConfig = {
        apiKey: "AIzaSyBLhjeaX_vl5-7_I9xT1Ae9JMQnLlKCpX4",
        authDomain: "one-earth-cms.firebaseapp.com",
        projectId: "one-earth-cms",
        storageBucket: "one-earth-cms.appspot.com",
        messagingSenderId: "649151856539",
        appId: "1:649151856539:web:3c5b6a1fe176a4f31ed347"
      };

      function safeInitFirebase() {
        try {
          if (!window.firebase) return false;
          if (!firebase.apps || !firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
          }
          return true;
        } catch (_) {
          return !!window.firebase;
        }
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function parseCsv(csv) {
        if (!csv) return [];
        return String(csv).split(",").map(function (part) {
          return part.trim();
        }).filter(Boolean);
      }

      function isVideoUrl(url) {
        return /\.(mp4|webm|ogg|mov|m4v|avi)(?:$|[?#])/i.test((url || "").split("?")[0]);
      }

      function isImageUrl(url) {
        return /\.(png|jpe?g|webp|gif|avif|svg)(?:$|[?#])/i.test((url || "").split("?")[0]);
      }

      function setMeta(selector, attr, value) {
        if (!value) return;
        var el = document.querySelector(selector);
        if (!el) {
          el = document.createElement(selector.indexOf("link") === 0 ? "link" : "meta");
          if (selector.indexOf('property="') !== -1) {
            el.setAttribute("property", selector.match(/property="([^"]+)"/)[1]);
          } else if (selector.indexOf('name="') !== -1) {
            el.setAttribute("name", selector.match(/name="([^"]+)"/)[1]);
          } else if (selector.indexOf('rel="') !== -1) {
            el.setAttribute("rel", selector.match(/rel="([^"]+)"/)[1]);
          }
          document.head.appendChild(el);
        }
        el.setAttribute(attr, value);
      }

      function normalizeWork(work) {
        if (!work) return work;
        if (!work.featuredMedia && work.featuredImage) {
          work.featuredMedia = { url: work.featuredImage };
        }
        return work;
      }

      function textFromHtml(html) {
        if (!html) return "";
        var div = document.createElement("div");
        div.innerHTML = html;
        return (div.textContent || div.innerText || "").replace(/\s+/g, " ").trim();
      }

      function sanitizeRichText(html) {
        if (!html) return "";
        var template = document.createElement("template");
        template.innerHTML = String(html);
        var blocked = template.content.querySelectorAll("script, style, iframe, object, embed, link, meta");
        blocked.forEach(function (node) {
          if (node.parentNode) node.parentNode.removeChild(node);
        });
        var elements = template.content.querySelectorAll("*");
        elements.forEach(function (element) {
          Array.prototype.slice.call(element.attributes).forEach(function (attr) {
            var name = attr.name.toLowerCase();
            var value = attr.value || "";
            if (name.indexOf("on") === 0) {
              element.removeAttribute(attr.name);
            }
            if ((name === "href" || name === "src") && /^\s*javascript:/i.test(value)) {
              element.removeAttribute(attr.name);
            }
          });
        });
        return template.innerHTML;
      }

      function renderMediaFromUrl(url, caption, poster) {
        var safeCaption = escapeHtml(caption || "");
        if (!url) {
          return '<div class="blog-media-frontend"><img class="blog-media-img" src="' + escapeHtml(PLACEHOLDER_IMAGE) + '" alt="Placeholder artwork"><p class="blog-media-caption">Image coming soon.</p></div>';
        }
        if (isVideoUrl(url)) {
          var posterAttr = poster ? ' poster="' + escapeHtml(poster) + '"' : "";
          return '<div class="blog-media-frontend"><video class="blog-media-video" src="' + escapeHtml(url) + '"' + posterAttr + ' controls playsinline></video>' + (safeCaption ? '<p class="blog-media-caption">' + safeCaption + '</p>' : "") + '</div>';
        }
        return '<div class="blog-media-frontend"><img class="blog-media-img" loading="lazy" src="' + escapeHtml(url) + '" alt="' + (safeCaption || "Artwork") + '">' + (safeCaption ? '<p class="blog-media-caption">' + safeCaption + '</p>' : '<p class="blog-media-caption">Caption forthcoming.</p>') + '</div>';
      }

      function renderEmbed(block) {
        var content = block && block.content;
        if (!content) return "";
        var data = null;
        try {
          data = typeof content === "string" ? JSON.parse(content) : content;
        } catch (_) {
          return String(content);
        }
        if (!data || !data.platform) return "";
        var widthStyle = data.width && data.width < 100 ? ' style="width:' + Number(data.width) + '%; margin:0 auto;"' : "";
        if (data.platform === "youtube") {
          return '<div class="blog-embed-frontend youtube-embed-frontend"' + widthStyle + '><div class="embed-container"><iframe src="https://www.youtube.com/embed/' + encodeURIComponent(data.embedId) + '" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div></div>';
        }
        if (data.platform === "spotify") {
          return '<div class="blog-embed-frontend spotify-embed-frontend"' + widthStyle + '><div class="embed-container"><iframe src="https://open.spotify.com/embed/' + escapeHtml(data.embedId) + '?utm_source=generator&theme=0" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe></div></div>';
        }
        if (data.platform === "soundcloud") {
          return '<div class="blog-embed-frontend soundcloud-embed-frontend"' + widthStyle + '><div class="embed-container"><iframe src="https://w.soundcloud.com/player/?url=' + encodeURIComponent("https://soundcloud.com/" + data.embedId) + '" frameborder="0" allow="autoplay"></iframe></div></div>';
        }
        return "";
      }

      async function renderBlockAsync(db, block) {
        if (!block) return "";
        var type = block.blockType || block.type;
        if (type === "subtitle") {
          return '<div class="blog-subtitle-frontend">' + sanitizeRichText(block.content || "") + '</div>';
        }
        if (type === "body") {
          return '<div class="blog-body-frontend">' + sanitizeRichText(block.content || "") + '</div>';
        }
        if (type === "embed") {
          return renderEmbed(block);
        }
        if (type === "media") {
          if (block.cachedMediaUrl) {
            return renderMediaFromUrl(block.cachedMediaUrl, block.caption, block.poster);
          }
          if (block.mediaId) {
            try {
              var mediaDoc = await db.collection("users").doc(TARGET_USER_UID).collection("items").doc(block.mediaId).get();
              if (mediaDoc.exists) {
                var media = mediaDoc.data();
                if (media && media.files && media.files.length) {
                  var file = media.files[0];
                  return renderMediaFromUrl(file.url, file.caption, file.poster);
                }
              }
            } catch (_) {}
          }
          return renderMediaFromUrl("", block.caption, block.poster);
        }
        return "";
      }

      async function renderColumnGroup(db, block) {
        if (!block) return "";
        var left = (block.leftColumn || []).slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
        var right = (block.rightColumn || []).slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
        var html = '<div class="blog-column-group-frontend">';
        html += '<div class="blog-column-frontend">';
        for (var i = 0; i < left.length; i++) {
          html += '<div class="blog-block-frontend">' + await renderBlockAsync(db, left[i]) + '</div>';
        }
        html += '</div><div class="blog-column-frontend">';
        for (var j = 0; j < right.length; j++) {
          html += '<div class="blog-block-frontend">' + await renderBlockAsync(db, right[j]) + '</div>';
        }
        html += '</div></div>';
        return html;
      }

      async function renderModularBlogContent(db, work) {
        if (!work || !work.sections || !work.sections.length) {
          return work && work.content ? '<div class="blog-body-frontend">' + sanitizeRichText(work.content) + '</div>' : "";
        }
        var html = "";
        var sections = work.sections.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
        for (var i = 0; i < sections.length; i++) {
          var section = sections[i];
          var items = (section.items || section.blocks || []).slice().sort(function (a, b) {
            return (a.order || 0) - (b.order || 0);
          });
          if (!items.length) continue;
          html += '<section class="blog-section-frontend">';
          for (var j = 0; j < items.length; j++) {
            var item = items[j];
            var type = item.blockType || item.type;
            if (type === "column-group") {
              html += await renderColumnGroup(db, item);
              continue;
            }
            html += await renderBlockAsync(db, item);
          }
          html += "</section>";
        }
        return html;
      }

      function pickThumbnailFromWork(work) {
        try {
          if (work && work.featuredMedia) {
            if (work.featuredMedia.poster && isImageUrl(work.featuredMedia.poster)) return work.featuredMedia.poster;
            if (work.featuredMedia.url && isImageUrl(work.featuredMedia.url)) return work.featuredMedia.url;
          }
          if (work && work.featuredImage && isImageUrl(work.featuredImage)) return work.featuredImage;
          if (work && work.sections) {
            for (var i = 0; i < work.sections.length; i++) {
              var items = work.sections[i].items || work.sections[i].blocks || [];
              for (var j = 0; j < items.length; j++) {
                var item = items[j];
                if (item.cachedMediaUrl && isImageUrl(item.cachedMediaUrl)) return item.cachedMediaUrl;
              }
            }
          }
        } catch (_) {}
        return "";
      }

      function getSummary(work) {
        if (work && work.summary) return String(work.summary);
        if (work && work.subtitle) return String(work.subtitle);
        if (work && work.excerpt) return String(work.excerpt);
        if (work && work.content) return textFromHtml(work.content).slice(0, 180);
        if (work && work.sections) {
          for (var i = 0; i < work.sections.length; i++) {
            var items = work.sections[i].items || work.sections[i].blocks || [];
            for (var j = 0; j < items.length; j++) {
              var item = items[j];
              var type = item.blockType || item.type;
              if (type === "body" && item.content) {
                var summary = textFromHtml(item.content);
                if (summary) return summary.slice(0, 180);
              }
            }
          }
        }
        return "Selected work from the portfolio.";
      }

      function getDateLabel(work) {
        if (!work || !work.datePosted || !work.datePosted.seconds) return "Undated";
        return new Date(work.datePosted.seconds * 1000).toLocaleDateString("en-GB", {
          day: "2-digit",
          month: "short",
          year: "numeric"
        });
      }

      function updateSocialMeta(work, postId) {
        var title = (work && work.title ? work.title : "Selected Work") + " | Otu Ibe-Enwo";
        var description = getSummary(work);
        var image = pickThumbnailFromWork(work);
        if (!image) {
          image = new URL(PLACEHOLDER_IMAGE, window.location.href).href;
        }
        var url = window.location.origin + window.location.pathname + "?id=" + encodeURIComponent(postId || "");
        setMeta('meta[property="og:title"]', "content", title);
        setMeta('meta[property="og:description"]', "content", description);
        setMeta('meta[property="og:url"]', "content", url);
        setMeta('meta[property="og:image"]', "content", image);
        setMeta('meta[name="twitter:title"]', "content", title);
        setMeta('meta[name="twitter:description"]', "content", description);
        setMeta('meta[name="twitter:image"]', "content", image);
        setMeta('link[rel="canonical"]', "href", url);
        document.title = title;
      }

      function buildRelatedCardHtml(post) {
        var image = pickThumbnailFromWork(post) || PLACEHOLDER_IMAGE;
        var title = escapeHtml(post.title || "Untitled");
        var category = escapeHtml(post.category || "Selected work");
        var excerpt = escapeHtml(getSummary(post));
        return '' +
          '<a class="related-card" href="work.html?id=' + encodeURIComponent(post.id) + '" aria-label="Open ' + title + '">' +
            '<div class="related-card-media"><img loading="lazy" src="' + escapeHtml(image) + '" alt="' + title + '"></div>' +
            '<div class="related-card-body">' +
              '<div class="meta-row"><span class="meta-copy">' + category + '</span></div>' +
              '<h3 class="related-card-title">' + title + '</h3>' +
              '<p class="work-description">' + excerpt + '</p>' +
            '</div>' +
          '</a>';
      }

      async function renderRelatedWork(db, currentId) {
        var container = document.getElementById("related-work-container");
        if (!container) return;
        try {
          var snap = await db.collection("users").doc(TARGET_USER_UID)
            .collection("items")
            .where("type", "==", "blog")
            .get();
          var posts = [];
          snap.forEach(function (doc) {
            if (doc.id !== currentId) {
              posts.push(normalizeWork(Object.assign({ id: doc.id }, doc.data())));
            }
          });
          if (!posts.length) {
            container.innerHTML = "";
            return;
          }
          for (var i = posts.length - 1; i > 0; i--) {
            var swapIndex = Math.floor(Math.random() * (i + 1));
            var temp = posts[i];
            posts[i] = posts[swapIndex];
            posts[swapIndex] = temp;
          }
          container.innerHTML = posts.slice(0, 3).map(buildRelatedCardHtml).join("");
        } catch (_) {
          container.innerHTML = "";
        }
      }

      async function bindPostPager(db, currentId) {
        var prevBtn = document.querySelector('.pager-btn[data-dir="prev"]');
        var nextBtn = document.querySelector('.pager-btn[data-dir="next"]');
        if (!prevBtn || !nextBtn) return;
        try {
          var snap;
          try {
            snap = await db.collection("users").doc(TARGET_USER_UID)
              .collection("items")
              .where("type", "==", "blog")
              .orderBy("datePosted", "desc")
              .get();
          } catch (_) {
            snap = await db.collection("users").doc(TARGET_USER_UID)
              .collection("items")
              .where("type", "==", "blog")
              .get();
          }
          var ids = [];
          snap.forEach(function (doc) {
            ids.push(doc.id);
          });
          if (ids.length < 2) {
            prevBtn.hidden = true;
            nextBtn.hidden = true;
            return;
          }
          var currentIndex = Math.max(0, ids.indexOf(currentId));
          var prevId = ids[(currentIndex - 1 + ids.length) % ids.length];
          var nextId = ids[(currentIndex + 1) % ids.length];

          prevBtn.addEventListener("click", function () {
            window.location.href = "work.html?id=" + encodeURIComponent(prevId);
          });
          nextBtn.addEventListener("click", function () {
            window.location.href = "work.html?id=" + encodeURIComponent(nextId);
          });
          document.addEventListener("keydown", function (event) {
            if (event.key === "ArrowLeft") {
              window.location.href = "work.html?id=" + encodeURIComponent(prevId);
            } else if (event.key === "ArrowRight") {
              window.location.href = "work.html?id=" + encodeURIComponent(nextId);
            }
          });
        } catch (_) {}
      }

      async function run() {
        var content = document.getElementById("work-content");
        if (!content) return;

        var params = new URLSearchParams(window.location.search);
        var id = params.get("id");
        if (!id) {
          content.innerHTML = '' +
            '<div class="error-box">' +
              '<div class="section-kicker">Missing item</div>' +
              '<h1 class="work-title">No work item specified.</h1>' +
              '<p>Please return to the portfolio and choose a work.</p>' +
            '</div>';
          return;
        }

        if (!safeInitFirebase() || !window.firebase) {
          content.innerHTML = '' +
            '<div class="error-box">' +
              '<div class="section-kicker">Unavailable</div>' +
              '<h1 class="work-title">Firestore could not be initialised.</h1>' +
              '<p>The detail page is ready, but content is unavailable right now.</p>' +
            '</div>';
          return;
        }

        try {
          var db = firebase.firestore();
          var snap = await db.collection("users").doc(TARGET_USER_UID).collection("items").doc(id).get();
          if (!snap.exists) {
            content.innerHTML = '' +
              '<div class="error-box">' +
                '<div class="section-kicker">Not found</div>' +
                '<h1 class="work-title">That work item could not be found.</h1>' +
                '<p>Please return to the portfolio and try another piece.</p>' +
              '</div>';
            return;
          }

          var work = normalizeWork(snap.data());
          var title = escapeHtml(work.title || "Untitled");
          var category = escapeHtml(work.category || "Selected work");
          var summary = escapeHtml(getSummary(work));
          var tagsHtml = parseCsv(work.tags || work.keywords || "").map(function (tag) {
            return '<span class="detail-pill">' + escapeHtml(tag) + '</span>';
          }).join("");

          var heroMedia = "";
          if (work.featuredMedia && work.featuredMedia.url) {
            heroMedia = renderMediaFromUrl(work.featuredMedia.url, work.featuredMedia.caption, work.featuredMedia.poster);
          } else {
            heroMedia = renderMediaFromUrl(pickThumbnailFromWork(work) || "", "", "");
          }

          var bodyHtml = await renderModularBlogContent(db, work);
          content.innerHTML = '' +
            '<article class="work-header">' +
              '<div class="section-kicker">' + category + '</div>' +
              '<h1 class="work-title">' + title + '</h1>' +
              '<div class="work-meta">' +
                '<span class="work-date">' + escapeHtml(getDateLabel(work)) + '</span>' +
                (tagsHtml ? '<div class="detail-tags">' + tagsHtml + '</div>' : '') +
              '</div>' +
              '<p class="work-summary">' + summary + '</p>' +
            '</article>' +
            '<div class="work-hero-media">' + heroMedia + '</div>' +
            '<div class="work-content">' + bodyHtml + '</div>' +
            '<section class="related-section" aria-labelledby="related-title">' +
              '<div class="section-head">' +
                '<div>' +
                  '<div class="section-kicker">More Works</div>' +
                  '<h2 class="section-title" id="related-title">Related selections</h2>' +
                '</div>' +
              '</div>' +
              '<div class="related-grid" id="related-work-container"></div>' +
              '<div class="pager-row">' +
                '<button class="button-secondary pager-btn" type="button" data-dir="prev">Previous work</button>' +
                '<button class="button pager-btn" type="button" data-dir="next">Next work</button>' +
              '</div>' +
            '</section>';

          updateSocialMeta(work, id);
          renderRelatedWork(db, id);
          bindPostPager(db, id);
        } catch (_) {
          content.innerHTML = '' +
            '<div class="error-box">' +
              '<div class="section-kicker">Error</div>' +
              '<h1 class="work-title">The work could not be loaded.</h1>' +
              '<p>Please try again shortly.</p>' +
            '</div>';
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", run);
      } else {
        run();
      }
    })();
  </script>
</body>
</html>
