    <style>
        html {

        .video-background {

            z-index: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .portfolio-header .site-title-link {

        .release {

            margin: 0 auto;
            padding: 23px 0 48px;

            position: relative;
            z-index: 2;

        .kr-logo {

            display: block;

        }

            margin: 0;
            font-size: 2.4rem;
            font-weight: bold;
            letter-spacing: 0.01em;
            line-height: 1.1;
        }

        .artist {
            margin: 10px 0 0;
            font-size: 1.15rem;
            color: #d0d0d0;
        }

        .feat {
            margin: 4px 0 0;
            font-size: 0.95rem;
            color: #999;
        }

        .streams {
            list-style: none;
            margin: 32px 0 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        .stream-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 64px;
            padding: 8px 8px 8px 14px;
            background: rgba(26, 26, 26, 0.8);
            color: #fff;
            text-decoration: none;
            border: 0.5px solid #fff;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .stream-link:hover,
        .stream-link:focus-visible {
            background: #111;
        }

        .stream-link:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }

        .stream-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            font-size: 1.05rem;
        }

        .stream-brand img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .youtube-video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
            border: 0.5px solid #fff;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .stream-play {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            background: #0000ff;
            color: #fff;
            border: 0.5px solid #fff;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: bold;
            transition: background 0.2s, color 0.2s;
        }

        .stream-link:hover .stream-play,
        .stream-link:focus-visible .stream-play {
            background: #fff;
            color: #000;
        }

        .play-icon {
            width: 0;
            height: 0;
            border-left: 9px solid currentColor;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
        }

        .release-footer {
            text-align: center;
            color: hsl(0, 0%, 54%);
            padding: 28px 16px 40px;
            border-top: 0.5px solid #333;
            position: relative;
            z-index: 2;
        }

        .release-footer p {
            margin: 0;
        }

        .release-footer a {
            color: #ff8c00;
            text-decoration: none;
        }

        .release-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .release {
                padding-top: 23px;
            }

            .release h1 {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            .portfolio-header .site-title-link {
