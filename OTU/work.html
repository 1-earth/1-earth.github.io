<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <meta name="robots" content="noindex">
</head>
<body>
  <p>Redirecting to the work page...</p>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script>
    (async function () {
      var TARGET_USER_UID = "vDAW0f0Hhvcbl8inEnn8sJXvv6M2";
      var firebaseConfig = {
        apiKey: "AIzaSyBLhjeaX_vl5-7_I9xT1Ae9JMQnLlKCpX4",
        authDomain: "one-earth-cms.firebaseapp.com",
        projectId: "one-earth-cms",
        storageBucket: "one-earth-cms.appspot.com",
        messagingSenderId: "649151856539",
        appId: "1:649151856539:web:3c5b6a1fe176a4f31ed347"
      };

      function slugifyTitle(title) {
        return String(title || "")
          .trim()
          .replace(/\s+/g, "-")
          .replace(/[^A-Za-z0-9-]/g, "")
          .replace(/-+/g, "-");
      }

      function safeInitFirebase() {
        try {
          if (!window.firebase) return false;
          if (!firebase.apps || !firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
          }
          return true;
        } catch (_) {
          return !!window.firebase;
        }
      }

      var search = window.location.search || "";
      var raw = search.charAt(0) === "?" ? search.slice(1) : search;
      var slug = "";
      var legacyId = "";

      if (raw) {
        try {
          var params = new URLSearchParams(raw);
          legacyId = params.get("id") || "";
          slug = params.get("title") || "";
        } catch (_) {}
        if (!slug && !legacyId && raw.indexOf("=") === -1 && raw.indexOf("&") === -1) {
          slug = raw;
        }
      }

      if (!slug && legacyId && safeInitFirebase()) {
        try {
          var snap = await firebase.firestore()
            .collection("users").doc(TARGET_USER_UID)
            .collection("items").doc(legacyId)
            .get();
          if (snap.exists) {
            slug = slugifyTitle((snap.data() || {}).title);
          }
        } catch (_) {}
      }

      var target = "work/" + (slug ? "?" + encodeURIComponent(slug) : "");
      window.location.replace(target);
    })();
  </script>
</body>
</html>
