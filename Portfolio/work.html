<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <meta name="robots" content="noindex">
</head>
<body>
    <p>Redirecting to the work page...</p>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="1eCMSconnect.js"></script>
    <script>
        (async function () {
            const firebaseConfig = {
                apiKey: "AIzaSyBLhjeaX_vl5-7_I9xT1Ae9JMQnLlKCpX4",
                authDomain: "one-earth-cms.firebaseapp.com",
                projectId: "one-earth-cms",
                storageBucket: "one-earth-cms.appspot.com",
                messagingSenderId: "649151856539",
                appId: "1:649151856539:web:3c5b6a1fe176a4f31ed347"
            };

            function safeInitFirebase() {
                try {
                    if (!window.firebase) return false;
                    if (!firebase.apps || !firebase.apps.length) {
                        firebase.initializeApp(firebaseConfig);
                    }
                    return true;
                } catch (_) {
                    return !!window.firebase;
                }
            }

            const search = window.location.search || "";
            const raw = search.charAt(0) === "?" ? search.slice(1) : search;
            const hash = window.location.hash || "";
            let slug = "";
            let legacyId = "";
            let lucky = false;

            if (raw) {
                try {
                    const params = new URLSearchParams(raw);
                    slug = params.get("title") || "";
                    legacyId = params.get("id") || "";
                    lucky = params.get("lucky") === "1";
                } catch (_) {}

                if (!slug && !legacyId && raw.indexOf("=") === -1 && raw.indexOf("&") === -1) {
                    try {
                        slug = decodeURIComponent(raw);
                    } catch (_) {
                        slug = raw;
                    }
                }
            }

            if (!slug && legacyId && safeInitFirebase()) {
                try {
                    const doc = await firebase.firestore()
                        .collection("users").doc(USER_ID)
                        .collection("items").doc(legacyId)
                        .get();
                    if (doc.exists) {
                        slug = typeof window.slugifyPortfolioTitle === "function"
                            ? window.slugifyPortfolioTitle((doc.data() || {}).title)
                            : "";
                    }
                } catch (_) {}
            }

            const target = "work/" + (slug ? "?" + encodeURIComponent(slug) : "") + (lucky || hash === "#lucky" ? "#lucky" : "");
            window.location.replace(target);
        })();
    </script>
</body>
</html>
